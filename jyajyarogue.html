/* ===== 야생 펫 생성 (모든 펫 랜덤 등장) ===== */
function spawnWild() {
  // 일반/1등급/2등급 다 포함해서 342마리 전체 중 랜덤
  const candidates = PET_DATA;
  const petData = candidates[Math.floor(Math.random() * candidates.length)];
  // 야생 레벨은 내 파티 평균 레벨 기준 ±2
  const partyAvg = state.party.reduce((s, u) => s + u.level, 0) / state.party.length;
  const level = Math.max(3, Math.floor(partyAvg + (Math.random() * 4 - 2)));
  return createUnit(petData, level);
}

/* ===== 보스 생성 (랭커 보유 펫 중 랜덤) ===== */
function spawnBoss() {
  // 랭커 정보가 있는 모든 펫 중 랜덤
  const candidates = PET_DATA.filter(p => p.topRanker);
  const petData = candidates[Math.floor(Math.random() * candidates.length)];
  const partyAvg = state.party.reduce((s, u) => s + u.level, 0) / state.party.length;
  // 보스 레벨 = 파티 평균 +5 (난이도 ↑)
  const rankerLv = Math.min(petData.topRanker.level, Math.floor(partyAvg + 5));
  const boss = createUnit(petData, rankerLv, {
    isBoss: true,
    iv: 0.15,
    ownerName: petData.topRanker.owner || jaBossOwner(),
  });
  // 보스는 HP 30% / ATK 15% 부스트 (난이도 ↑)
  boss.maxHp = Math.floor(boss.maxHp * 1.3);
  boss.hp = boss.maxHp;
  boss.atk = Math.floor(boss.atk * 1.15);
  // 보스는 기술 1~2개 장착
  const skillKeys = Object.keys(SKILLS);
  const shuf = [...skillKeys].sort(() => Math.random() - 0.5);
  boss.skills = shuf.slice(0, 1 + Math.floor(Math.random() * 2));
  return boss;
}

/* ===== 스타터 후보 ===== */
function rollStarters() {
  // 일반 등급 펫 중 랜덤 6마리 (초반 진입장벽 낮추려고 일반만, 2등급/1등급은 포획/상점 등 고급 루트로)
  const pool = PET_DATA.filter(p => p.grade === '일반');
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 6);
}

/* ===== 렌더링 ===== */
const app = document.getElementById('app');

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'className') e.className = v;
    else if (k === 'onclick') e.addEventListener('click', v);
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
}

function render() {
  app.innerHTML = '';
  if (state.scene === 'title') renderTitle();
  else if (state.scene === 'starter') renderStarter();
  else if (state.scene === 'shop') renderShop();
  else if (state.scene === 'ranking') renderRanking();
  else if (state.scene === 'battle' || state.scene === 'reward') renderBattle();
  else if (state.scene === 'gameover' || state.scene === 'victory') renderGameOver();
}

async function renderRanking() {
  const screen = el('div', { className: 'ranking-screen' });
  screen.innerHTML = `
    <div class="ranking-title">🏆 JAJAROGUE 랭킹</div>
    <div class="ranking-sub">도달 웨이브 ↓ · 동점 시 클리어타임 ↑</div>
    <div id="ranking-list" class="ranking-list">
      <div class="ranking-loading">불러오는 중...</div>
    </div>
    <button class="btn" id="ranking-refresh" style="margin-top: 12px;">🔄 새로고침</button>
    <button class="btn full" id="ranking-back" style="margin-top: 8px; max-width: 400px; width: 100%;">타이틀로</button>
  `;
  app.appendChild(screen);
  document.getElementById('ranking-back').addEventListener('click', () => {
    state.scene = 'title';
    render();
  });
  document.getElementById('ranking-refresh').addEventListener('click', () => renderRanking());

  const list = await fetchRanking();
  const container = document.getElementById('ranking-list');
  if (!container) return;
  if (list.length === 0) {
    container.innerHTML = '<div class="ranking-empty">아직 기록이 없습니다. 첫 번째 랭커가 되어보세요!</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach((r, i) => {
    const row = el('div', { className: 'ranking-row' + (r.nickname === state.nickname ? ' mine' : '') });
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
    const timeStr = formatTime(r.timeMs || 0);
    const victoryTag = r.victory ? '<span class="rank-victory">🏆 클리어</span>' : '';
    row.innerHTML = `
      <div class="rank-medal">${medal}</div>
      <div class="rank-info">
        <div class="rank-nick">${r.nickname}${victoryTag}</div>
        <div class="rank-meta">포획 ${r.captures || 0}마리 · ${r.date || ''}</div>
      </div>
      <div class="rank-stats">
        <div class="rank-wave">W${r.wave}</div>
        <div class="rank-time">⏱ ${timeStr}</div>
      </div>
    `;
    container.appendChild(row);
  });
}

function renderTitle() {
  const screen = el('div', { className: 'title-screen' });
  const nickHtml = state.nickname
    ? `<div class="current-nick">👤 ${state.nickname} <button id="change-nick-btn" class="link-btn">변경</button></div>`
    : '';
  screen.innerHTML = `
    <h1>JAJA<br>ROGUE</h1>
    <div class="subtitle">쟈쟈로그 · 펫 로그라이트 모험</div>
    ${nickHtml}
    <div class="title-menu">
      <button class="btn full ok" id="start-btn" style="padding: 14px; font-size: 20px;">모험 시작</button>
      <button class="btn full" id="continue-btn" style="padding: 12px;">이어하기</button>
      <button class="btn full" id="ranking-btn" style="padding: 12px;">🏆 랭킹</button>
    </div>
    <div class="stats-line">
      전체 플레이: ${state.stats.totalRuns} · 최고 웨이브: ${state.stats.bestWave} · 포획: ${state.captured.size}종
    </div>
    <div style="margin-top: 30px; font-size: 11px; color: #566; text-align: center; line-height: 1.6;">
      ⬤ 3마리 파티로 30웨이브 클리어 도전<br>
      ⬤ 속성 상성 · 포획 · 레벨업 · 기술 · 상점<br>
      ⬤ 10웨이브마다 실제 랭커 펫이 보스로 등장
    </div>
  `;
  app.appendChild(screen);
  document.getElementById('start-btn').addEventListener('click', onStartClick);
  document.getElementById('continue-btn').addEventListener('click', onContinueClick);
  document.getElementById('ranking-btn').addEventListener('click', onRankingClick);
  const changeBtn = document.getElementById('change-nick-btn');
  if (changeBtn) changeBtn.addEventListener('click', () => promptNickname(true));
}

async function onStartClick() {
  if (!state.nickname) {
    const ok = await promptNickname(false);
    if (!ok) return;
  }
  startStarter();
}

async function onContinueClick() {
  if (!state.nickname) {
    const ok = await promptNickname(false);
    if (!ok) return;
  }
  const save = await loadFromCloud(state.nickname);
  if (!save || !save.party || save.party.length === 0) {
    alert('저장된 기록이 없습니다.');
    return;
  }
  const alive = save.party.filter(p => p.hp > 0).length;
  if (alive === 0) {
    alert('저장된 기록은 전멸 상태입니다.');
    return;
  }
  if (confirm(`웨이브 ${save.wave}에서 저장된 기록 (파티 ${save.party.length}마리, 생존 ${alive})을 이어하시겠습니까?`)) {
    initAudio();
    restoreFromSave(save);
  }
}

async function onRankingClick() {
  state.scene = 'ranking';
  render();
}

/* 닉네임 입력 다이얼로그 */
function promptNickname(isChange) {
  return new Promise(resolve => {
    const overlay = el('div', { className: 'nick-overlay' });
    const panel = el('div', { className: 'nick-panel' });
    const current = state.nickname || '';
    panel.innerHTML = `
      <div class="nick-title">${isChange ? '닉네임 변경' : '닉네임을 입력해주세요'}</div>
      <div class="nick-sub">랭킹에 표시될 이름 (2~10자)</div>
      <input type="text" id="nick-input" class="nick-input" maxlength="10" value="${current}" placeholder="예: 유피테르">
      <div class="nick-err" id="nick-err"></div>
      <div class="nick-btns">
        <button class="btn" id="nick-cancel">취소</button>
        <button class="btn ok" id="nick-ok">확인</button>
      </div>
    `;
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    const input = document.getElementById('nick-input');
    input.focus();
    input.select();

    const close = (result) => {
      overlay.remove();
      resolve(result);
    };
    document.getElementById('nick-cancel').addEventListener('click', () => close(false));
    document.getElementById('nick-ok').addEventListener('click', async () => {
      const v = input.value.trim();
      if (v.length < 2 || v.length > 10) {
        document.getElementById('nick-err').textContent = '2~10자 사이로 입력해주세요';
        return;
      }
      if (!/^[a-zA-Z0-9가-힣_-]+$/.test(v)) {
        document.getElementById('nick-err').textContent = '한글, 영문, 숫자, _, - 만 사용 가능';
        return;
      }
      state.nickname = v;
      try { localStorage.setItem('jajarogue:nick', v); } catch(e) {}
      close(true);
      render();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('nick-ok').click();
      else if (e.key === 'Escape') close(false);
    });
  });
}

function startStarter() {
  initAudio(); // 첫 사용자 인터랙션에 오디오 준비
  startBgm('title'); // 타이틀/선택 BGM
  state.scene = 'starter';
  state.starterPool = rollStarters();
  state.starterPicks = [];
  render();
}

function renderStarter() {
  const screen = el('div', { className: 'starter-screen' });
  screen.innerHTML = `
    <h2>파티 선택</h2>
    <div class="sub">3마리를 고르세요 (선택: <span id="pick-count">0</span>/3)</div>
  `;
  const grid = el('div', { className: 'starter-grid' });
  for (const pet of state.starterPool) {
    const card = el('div', { className: 'starter-card', 'data-name': pet.name });
    const attrs = pet.attr || {};
    const attrTags = ATTRS
      .filter(a => (attrs[a] || 0) > 0)
      .map(a => `<span class="attr-tag attr-${ATTR_KEY[a]}">${a}${attrs[a]}</span>`)
      .join('');
    card.innerHTML = `
      <img src="${pet.image}" alt="${pet.name}" onerror="this.style.visibility='hidden'">
      <div class="n">${pet.name}</div>
      <div class="stats">
        <div class="stat-attrs">${attrTags}</div>
        <div>HP ${Math.round(pet.sg.hp*10)/10} · ATK ${Math.round(pet.sg.atk*10)/10}</div>
      </div>
    `;
    card.addEventListener('click', () => toggleStarterPick(pet.name, card));
    grid.appendChild(card);
  }
  screen.appendChild(grid);
  const btn = el('button', {
    className: 'btn full ok confirm-btn',
    id: 'confirm-starter',
    style: 'max-width: 300px',
  }, ['모험 시작']);
  btn.disabled = true;
  btn.style.opacity = '0.4';
  btn.addEventListener('click', startRun);
  screen.appendChild(btn);
  app.appendChild(screen);
}

function toggleStarterPick(name, card) {
  const idx = state.starterPicks.indexOf(name);
  if (idx >= 0) {
    state.starterPicks.splice(idx, 1);
    card.classList.remove('selected');
  } else if (state.starterPicks.length < 3) {
    state.starterPicks.push(name);
    card.classList.add('selected');
  }
  document.getElementById('pick-count').textContent = state.starterPicks.length;
  const btn = document.getElementById('confirm-starter');
  btn.disabled = state.starterPicks.length !== 3;
  btn.style.opacity = state.starterPicks.length === 3 ? '1' : '0.4';
}

function startRun() {
  // 파티 생성
  state.party = state.starterPicks.map(name => {
    const pd = PET_DATA.find(p => p.name === name);
    return createUnit(pd, 5, { isCaptured: true });
  });
  state.activeIndex = 0;
  state.wave = 1;
  state.log = [];
  state.stones = 0;
  state.inventory = {};
  state.scene = 'battle';
  state.runStartTime = Date.now();
  state.runEndTime = 0;
  state.stats.totalRuns++;
  saveStats();
  beginBattle();
}

function beginBattle() {
  const isBoss = state.wave % 10 === 0;

  // 상태 초기화
  state.enemy = null;
  state.enemies = [];
  state.busy = false;
  state.nextBossAnnounced = false;
  state.lastActiveEnemy = null;

  if (isBoss) {
    // 보스 2마리 (서로 다른 펫)
    const boss1 = spawnBoss();
    let boss2 = spawnBoss();
    let tries = 0;
    while (boss2.petData.name === boss1.petData.name && tries++ < 10) {
      boss2 = spawnBoss();
    }
    state.enemies = [boss1, boss2];
    state.enemy = boss1;
    state.lastActiveEnemy = boss1;
    pushLog(`⚠ 보스전! ${boss1.ownerName}의 ${boss1.petData.name} & ${boss2.ownerName}의 ${boss2.petData.name} 등장!`, 'boss');
  } else {
    state.enemy = spawnWild();
    state.enemies = [state.enemy];
    state.lastActiveEnemy = state.enemy;
    pushLog(`야생 ${state.enemy.petData.name} Lv.${state.enemy.level} 출현!`, 'info');
  }

  state.scene = 'battle';
  state.mode = 'action';
  // BGM
  if (isBoss) {
    startBgm('boss');
  } else {
    const biome = getCurrentBiome();
    startBgm(biome.id);
  }
  render();
}

function pushLog(text, cls = '') {
  state.log.push({ text, cls });
  if (state.log.length > 40) state.log.shift();
}

function renderBattle() {
  const biome = getCurrentBiome();
  // HUD
  const hud = el('div', { className: 'hud' });
  hud.innerHTML = `
    <div>💎 ${state.stones}</div>
    <div class="wave">WAVE ${state.wave}</div>
    <div class="right biome">${biome.name} <button id="mute-btn" style="background:none;border:none;color:inherit;cursor:pointer;font-size:14px;margin-left:6px;vertical-align:middle;">${audio.muted?'🔇':'🔊'}</button></div>
  `;
  app.appendChild(hud);
  const muteBtn = document.getElementById('mute-btn');
  if (muteBtn) muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

  // 씬
  const scene = el('div', { className: 'scene', 'data-biome': biome.id });

  // 적 영역 (보스전은 여러 마리 태그전 - 활성 1마리만 싸움, 나머지는 옆에 대기)
  const enemyZone = el('div', { className: 'enemy-zone' });
  const enemies = state.enemies && state.enemies.length ? state.enemies : (state.enemy ? [state.enemy] : []);
  const activeEnemy = getCurrentEnemy();
  // 대기 중인 보스 (활성 아닌 것) 먼저 표시 (작게, 왼쪽)
  enemies.forEach((e, idx) => {
    if (e === activeEnemy || e.hp <= 0) return;
    enemyZone.appendChild(renderWaitingBoss(e, idx));
  });
  // 활성 적
  if (activeEnemy) {
    const activeIdx = enemies.indexOf(activeEnemy);
    enemyZone.appendChild(renderUnit(activeEnemy, 'enemy', { isActive: true, enemyIdx: activeIdx }));
  }
  scene.appendChild(enemyZone);

  // 내 영역
  const myZone = el('div', { className: 'my-zone' });
  const active = state.party[state.activeIndex];
  if (active) myZone.appendChild(renderUnit(active, 'mine'));
  scene.appendChild(myZone);

  app.appendChild(scene);

  // 파티 미니
  const partyBar = el('div', { className: 'party' });
  state.party.forEach((u, i) => {
    const slot = el('div', {
      className: 'party-slot' + (i === state.activeIndex ? ' active' : '') + (u.hp <= 0 ? ' fainted' : ''),
    });
    const img = el('img', { src: u.petData.image, onerror: "this.style.display='none'" });
    slot.appendChild(img);
    const mini = el('div', { className: 'mini-hp' });
    mini.style.width = Math.max(0, (u.hp / u.maxHp) * 100) + '%';
    mini.style.background = u.hp / u.maxHp < 0.3 ? 'var(--danger)' : u.hp / u.maxHp < 0.6 ? 'var(--accent)' : 'var(--ok)';
    slot.appendChild(mini);
    partyBar.appendChild(slot);
  });
  app.appendChild(partyBar);

  // 하단 박스
  if (state.mode === 'next') {
    renderNextBox();
  } else if (state.scene === 'reward') {
    renderRewardBox();
  } else {
    renderActionBox();
  }
}

function renderNextBox() {
  const box = el('div', { className: 'box' });
  const log = el('div', { className: 'log' });
  state.log.slice(-6).forEach(l => {
    const p = el('p', { className: l.cls }, [l.text]);
    log.appendChild(p);
  });
  box.appendChild(log);
  const row = el('div', { className: 'next-row' });
  const next = el('button', {
    className: 'btn ok next-main',
    style: 'font-size: 18px; padding: 12px;'
  }, ['▶ 다음 라운드']);
  next.addEventListener('click', goToNextRound);
  row.appendChild(next);
  if (state.nickname && wrDb) {
    const saveBtn = el('button', { className: 'btn next-save' }, ['💾 저장']);
    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = '저장중...';
      const ok = await saveToCloud();
      saveBtn.textContent = ok ? '✓ 저장됨' : '⚠ 실패';
      setTimeout(() => { saveBtn.textContent = '💾 저장'; saveBtn.disabled = false; }, 1500);
    });
    row.appendChild(saveBtn);
  }
  box.appendChild(row);
  app.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

function goToNextRound() {
  state.wave++;
  state.stats.bestWave = Math.max(state.stats.bestWave, state.wave);
  saveStats();
  // 5웨이브마다 상점 (5, 10, 15, 20, 25 진입 시 → 즉 방금 4, 9, 14... 를 클리어했을 때)
  // state.wave는 막 +1 된 상태. 새 웨이브가 6,11,16,21,26이면 상점
  // 보스 직전(10,20,30) 이전이 좋으니 5,10,15,20,25 웨이브 들어가기 직전에 열기
  if ((state.wave - 1) % 5 === 0 && state.wave > 1) {
    state.scene = 'shop';
    state.shopStock = rollShop();
    render();
    return;
  }
  state.scene = 'reward';
  state.pendingRewards = rollRewards();
  state.mode = 'action';
  render();
}

function renderWaitingBoss(unit, idx) {
  const card = el('div', {
    className: 'waiting-boss',
    'data-side': 'enemy',
    'data-enemy-idx': String(idx),
  });
  const hpPct = Math.max(0, (unit.hp / unit.maxHp) * 100);
  card.innerHTML = `
    <div class="wb-owner">👑 ${unit.ownerName || '???'}</div>
    <img class="pet-sprite" data-sprite="enemy" data-idx="${idx}" src="${unit.petData.image}" alt="${unit.petData.name}" onerror="this.style.visibility='hidden'">
    <div class="wb-name">${unit.petData.name}</div>
    <div class="wb-hpbar"><div class="wb-hpfill" style="width:${hpPct}%"></div></div>
    <div class="wb-wait">대기중</div>
  `;
  return card;
}

function renderUnit(unit, side, opts = {}) {
  const card = el('div', {
    className: 'pet-card' + (opts.isActive === false ? ' inactive-enemy' : '') + (unit.hp <= 0 ? ' defeated' : ''),
    'data-side': side,
    'data-enemy-idx': opts.enemyIdx !== undefined ? String(opts.enemyIdx) : '',
  });
  const attrs = unit.petData.attr || {};
  const hpPct = Math.max(0, (unit.hp / unit.maxHp) * 100);
  const hpCls = hpPct < 25 ? 'crit' : hpPct < 50 ? 'low' : '';
  // 보스면 큰 랭커 이름 헤더
  const bossHeader = unit.isBoss && unit.ownerName
    ? `<div class="boss-header">👑 ${unit.ownerName}<span class="boss-of">의</span></div>`
    : '';
  // 상태 태그
  const statusTags = [];
  if (unit.isGuarding) statusTags.push('<span class="unit-status defend">🛡️ 방어</span>');
  if (unit.charging) statusTags.push('<span class="unit-status charge">🔋 충전</span>');
  if (unit.allInRisk) statusTags.push('<span class="unit-status risk">⚔️ 배수</span>');

  // 속성 태그 (수치가 있는 것만 표시, 예: 지8 수2)
  const attrTags = ATTRS
    .filter(a => (attrs[a] || 0) > 0)
    .map(a => `<span class="attr-tag attr-${ATTR_KEY[a]}">${a}${attrs[a]}</span>`)
    .join('');

  const spriteSize = (opts.enemyIdx !== undefined && state.enemies && state.enemies.length > 1) ? 'small-sprite' : '';

  card.innerHTML = `
    ${bossHeader}
    <div class="name">${unit.petData.name}${unit.isBoss ? ' ★' : ''}</div>
    <div class="lv">Lv.${unit.level}</div>
    <img class="pet-sprite ${spriteSize}" data-sprite="${side}" data-idx="${opts.enemyIdx !== undefined ? opts.enemyIdx : ''}" src="${unit.petData.image}" alt="${unit.petData.name}" onerror="this.style.visibility='hidden'">
    <div class="hpbar"><div class="hpfill ${hpCls}" style="width:${hpPct}%"></div></div>
    <div class="hptext">${Math.max(0, unit.hp)} / ${unit.maxHp}</div>
    <div class="attrs">${attrTags}<span class="attr-tag">ATK ${unit.atk}</span><span class="attr-tag">DEF ${unit.def}</span><span class="attr-tag">AGI ${unit.agi}</span></div>
    ${statusTags.length ? `<div class="status-tags">${statusTags.join('')}</div>` : ''}
  `;
  return card;
}

function renderActionBox() {
  const box = el('div', { className: 'box action-box' });
  const me = state.party[state.activeIndex];

  // 버프/상태 표시
  if (me.charging || me.allInRisk || me.isGuarding) {
    const status = el('div', { className: 'status-line' });
    const tags = [];
    if (me.charging) tags.push('🔋 충전 중 (다음 공격 2배)');
    if (me.allInRisk) tags.push('⚔️ 배수의진 리스크 (피해↑)');
    if (me.isGuarding) tags.push('🛡️ 방어 중');
    status.textContent = tags.join(' · ');
    box.appendChild(status);
  }

  const choices = el('div', { className: 'choices' });

  // 공격
  const atkBtn = el('button', { className: 'btn ok' });
  atkBtn.innerHTML = `⚔️ 공격<small>속성 상성으로 데미지</small>`;
  atkBtn.addEventListener('click', () => playerAttack());
  choices.appendChild(atkBtn);

  // 방어
  const defBtn = el('button', { className: 'btn' });
  defBtn.innerHTML = `🛡️ 방어<small>받는 데미지 90% 감소</small>`;
  defBtn.addEventListener('click', () => playerDefend());
  choices.appendChild(defBtn);

  // 기술 (배운 스킬이 있으면)
  const skillBtn = el('button', { className: 'btn' });
  const skillCount = me.skills ? me.skills.length : 0;
  skillBtn.innerHTML = `✨ 기술<small>${skillCount ? skillCount + '개 사용 가능' : '배운 기술 없음'}</small>`;
  if (skillCount > 0) skillBtn.addEventListener('click', () => showSkills());
  else { skillBtn.disabled = true; skillBtn.style.opacity = '0.4'; }
  choices.appendChild(skillBtn);

  // 아이템
  const itemBtn = el('button', { className: 'btn' });
  const itemCount = Object.values(state.inventory).reduce((s, n) => s + n, 0);
  itemBtn.innerHTML = `🎒 아이템<small>${itemCount ? itemCount + '개 보유' : '보유 없음'}</small>`;
  if (itemCount > 0) itemBtn.addEventListener('click', () => showItems());
  else { itemBtn.disabled = true; itemBtn.style.opacity = '0.4'; }
  choices.appendChild(itemBtn);

  // 교체
  const swapBtn = el('button', { className: 'btn' });
  swapBtn.innerHTML = `🔄 교체<small>다른 펫으로 전환</small>`;
  swapBtn.addEventListener('click', () => showSwap());
  choices.appendChild(swapBtn);

  // 포획
  const captureBtn = el('button', { className: 'btn' });
  const currentEnemy = getCurrentEnemy();
  const canCapture = currentEnemy && !currentEnemy.isBoss;
  captureBtn.innerHTML = `🎯 포획<small>${canCapture ? '체력 낮을수록 성공↑' : '보스는 불가'}</small>`;
  if (canCapture) captureBtn.addEventListener('click', () => tryCapture());
  else { captureBtn.disabled = true; captureBtn.style.opacity = '0.4'; }
  choices.appendChild(captureBtn);

  // 도망
  const fleeBtn = el('button', { className: 'btn danger' });
  const agiDiff = currentEnemy ? (me.agi - currentEnemy.agi) : 0;
  const fleeRate = Math.max(0.2, Math.min(0.9, 0.3 + agiDiff * 0.02));
  const isBossFight = currentEnemy && currentEnemy.isBoss;
  fleeBtn.innerHTML = `🏃 도망<small>${isBossFight ? '보스전은 불가' : `성공률 ${Math.round(fleeRate*100)}%`}</small>`;
  if (!isBossFight) fleeBtn.addEventListener('click', () => tryFlee());
  else { fleeBtn.disabled = true; fleeBtn.style.opacity = '0.4'; }
  choices.appendChild(fleeBtn);

  box.appendChild(choices);
  app.appendChild(box);
}

/* ===== 전투 루프 =====
   모든 플레이어 액션은 turnRun()을 거쳐서 → 입력 잠금 / 내 행동 / 적 행동 / 상태 정리 */
async function turnRun(playerActionFn) {
  if (state.busy) return;
  state.busy = true;
  try {
    // 0) 적의 이번 턴 행동을 "미리" 결정 (아직 실행 X)
    //    → 방어면 내 공격이 들어오기 전에 방어 선언, 아니면 바로 내 행동부터
    const enemy = getCurrentEnemy();
    let preEnemyAction = null;
    if (enemy && enemy.hp > 0) {
      preEnemyAction = pickEnemyAction(enemy);
      // 적이 방어/충전을 선택했으면 내 행동 전에 미리 활성화 (방어막 먼저 걸림)
      if (preEnemyAction.type === 'defend' || preEnemyAction.type === 'charge') {
        await executeEnemyPreAction(enemy, preEnemyAction);
        // 이 턴에 적은 이미 행동 완료됨 (추후 enemyTurn 스킵)
      }
    }

    // 1) 내 행동 실행
    const meResult = await playerActionFn();
    if (meResult && meResult.earlyExit) return;

    // 2) 전투 상태 체크
    if (checkBattleEnd()) return;

    // 3) 적 행동
    //    - pre-action이 방어/충전이었으면 이미 했으니 이번 턴엔 아무것도 안 함
    //    - 아니면 enemyTurn에서 공격/스킬 실행
    if (enemy && enemy.hp > 0) {
      if (preEnemyAction && (preEnemyAction.type === 'defend' || preEnemyAction.type === 'charge')) {
        // 이미 방어/충전으로 턴 소모함. 상태 클린업만.
        endOfTurnCleanup(enemy);
      } else {
        // 공격/스킬을 실행
        await executeEnemyCombatAction(enemy, preEnemyAction);
      }
    }

    // 4) 내가 기절했으면 다음 생존자로 즉시 교체
    const me = state.party[state.activeIndex];
    if (me && me.hp <= 0) {
      autoSwapToNext();
    }

    // 5) 최종 체크
    checkBattleEnd();
  } finally {
    state.busy = false;
  }
}

/* 방어/충전은 내 행동 전에 미리 발동 (선제 방어) */
async function executeEnemyPreAction(enemy, action) {
  const enemies = state.enemies || [state.enemy];
  const idx = enemies.indexOf(enemy);
  const card = (enemies.length > 1 && idx >= 0)
    ? document.querySelector(`.pet-card[data-side="enemy"][data-enemy-idx="${idx}"]`)
    : document.querySelector('.pet-card[data-side="enemy"]');

  if (action.type === 'defend') {
    enemy.isGuarding = true;
    pushLog(`${enemy.petData.name}이(가) 방어 자세!`, 'info');
    playSfx('swap');
    if (card) {
      const shield = document.createElement('div');
      shield.className = 'shield-effect';
      card.appendChild(shield);
      setTimeout(() => shield.remove(), 700);
      card.classList.add('guarding-persist');
    }
    updateHpBars();
    await sleep(500);
  } else if (action.type === 'charge') {
    // 모아치기는 "이번 턴 무방비" - 방어 없이 충전만
    enemy.charging = true;
    pushLog(`${enemy.petData.name}이(가) 힘을 모은다... (무방비)`, 'info');
    playSfx('swap');
    updateHpBars();
    await sleep(400);
  }
}

/* 적의 실제 전투 행동 (공격/스킬) - 방어 이외 */
async function executeEnemyCombatAction(enemy, action) {
  const me = state.party[state.activeIndex];
  if (!me || me.hp <= 0) return;

  if (action.type === 'skill') {
    const opts = {};
    if (action.skill === 'all_in') { enemy.allInRisk = true; opts.allIn = true; pushLog(`${enemy.petData.name}: 배수의진!`, 'boss'); }
    else if (action.skill === 'guard_break') { opts.guardBreak = true; pushLog(`${enemy.petData.name}: 가드브레이크!`, 'boss'); }
    await animateAttack(enemy, me, false, opts);
  } else {
    // 평타 (충전 중이면 2배)
    const opts = {};
    if (enemy.charging) { opts.charged = true; enemy.charging = false; pushLog(`${enemy.petData.name}: 모아친 일격!`, 'boss'); }
    await animateAttack(enemy, me, false, opts);
  }

  endOfTurnCleanup(enemy);
  const me2 = state.party[state.activeIndex];
  endOfTurnCleanup(me2);
}

/* 매 턴 종료 후: 방어 자세/배수의진 리스크 해제 (충전은 유지) */
function endOfTurnCleanup(unit) {
  if (!unit) return;
  const wasGuarding = unit.isGuarding;
  unit.isGuarding = false;
  unit.allInRisk = false;
  // DOM에서 guarding-persist 제거
  if (wasGuarding) {
    document.querySelectorAll('.pet-card.guarding-persist').forEach(c => {
      c.classList.remove('guarding-persist');
    });
  }
}

/* 전투 끝 상태 체크. 끝났으면 true 반환 */
function checkBattleEnd() {
  // 적이 전멸했나
  const enemies = getAliveEnemies();
  if (enemies.length === 0) {
    onAllEnemiesDown();
    return true;
  }
  // 파티 전멸
  const aliveMine = state.party.filter(u => u.hp > 0);
  if (aliveMine.length === 0) {
    state.scene = 'gameover';
    finalizeRun();
    render();
    return true;
  }
  // 보스전에서 일부만 쓰러뜨린 경우 다음 보스 알림
  if (state.enemies && state.enemies.length > 1) {
    const alive = state.enemies.filter(e => e.hp > 0);
    if (alive.length > 0) {
      const currentActive = alive[0];
      if (state.lastActiveEnemy && state.lastActiveEnemy !== currentActive) {
        pushLog(`${currentActive.ownerName}의 ${currentActive.petData.name} 등장!`, 'boss');
        if (state.mode === 'action') render();
      }
      state.lastActiveEnemy = currentActive;
    }
  }
  return false;
}

function getAliveEnemies() {
  if (state.enemies && state.enemies.length) {
    return state.enemies.filter(e => e.hp > 0);
  }
  return state.enemy && state.enemy.hp > 0 ? [state.enemy] : [];
}

function getCurrentEnemy() {
  if (state.enemies && state.enemies.length) {
    // 현재 활성 적 (죽으면 다음으로)
    for (let i = 0; i < state.enemies.length; i++) {
      if (state.enemies[i].hp > 0) return state.enemies[i];
    }
    return null;
  }
  return state.enemy;
}

/* 기절 시 자동으로 다음 살아있는 펫으로 교체 */
function autoSwapToNext() {
  const nextIdx = state.party.findIndex((u, i) => i !== state.activeIndex && u.hp > 0);
  if (nextIdx >= 0) {
    pushLog(`${state.party[state.activeIndex].petData.name}이(가) 쓰러졌다...`, 'crit');
    state.activeIndex = nextIdx;
    pushLog(`${state.party[nextIdx].petData.name} 출전!`, 'info');
    render();
  }
}

/* ===== 플레이어 액션 ===== */
async function playerAttack() {
  await turnRun(async () => {
    const me = state.party[state.activeIndex];
    const enemy = getCurrentEnemy();
    if (!enemy) return { earlyExit: true };
    await animateAttack(me, enemy, true);
  });
}

async function playerDefend() {
  await turnRun(async () => {
    const me = state.party[state.activeIndex];
    me.isGuarding = true;
    pushLog(`${me.petData.name}이(가) 방어 자세를 취했다!`, 'info');
    playSfx('swap');
    // 쉴드 애니메이션
    const myCard = document.querySelector('.pet-card[data-side="mine"]');
    if (myCard) {
      const shield = document.createElement('div');
      shield.className = 'shield-effect';
      myCard.appendChild(shield);
      setTimeout(() => shield.remove(), 700);
      myCard.classList.add('guarding-persist');
    }
    updateHpBars();
    await sleep(500);
  });
}

/* 기술 즉시 발동 */
async function useSkillImmediate(skillId) {
  await turnRun(async () => {
    const me = state.party[state.activeIndex];
    const enemy = getCurrentEnemy();
    if (!enemy) return { earlyExit: true };

    if (skillId === 'all_in') {
      me.allInRisk = true;
      pushLog(`${me.petData.name}: 배수의진! 이번 공격 2배, 피해 증가!`, 'heal');
      await animateAttack(me, enemy, true, { allIn: true });
    } else if (skillId === 'guard_break') {
      pushLog(`${me.petData.name}: 가드브레이크!`, 'heal');
      await animateAttack(me, enemy, true, { guardBreak: true });
    } else if (skillId === 'charge_strike') {
      // 이번 턴 무방비 + 충전 (적에게 무방비로 공격 맞음)
      me.charging = true;
      // isGuarding 설정 안 함 (무방비)
      pushLog(`${me.petData.name}: 힘을 모은다... (다음 공격 2배, 이번 턴 무방비!)`, 'info');
      playSfx('swap');
      updateHpBars();
      await sleep(400);
    }
  });
  // 모아치기 사용 직후, 다음 턴에 자동 발동
  const me = state.party[state.activeIndex];
  if (me && me.hp > 0 && me.charging && state.scene === 'battle' && state.mode === 'action') {
    await sleep(400);
    await autoChargedStrike();
  }
}

/* 충전 후 자동 공격 (사용자 입력 없이) */
async function autoChargedStrike() {
  await turnRun(async () => {
    const me = state.party[state.activeIndex];
    const enemy = getCurrentEnemy();
    if (!enemy || !me.charging) return { earlyExit: true };
    pushLog(`${me.petData.name}: 모아친 일격!`, 'heal');
    me.charging = false;
    await animateAttack(me, enemy, true, { charged: true });
  });
}

/* ===== 적 AI =====
   1순위: HP 낮으면 고기 모방 (지금은 아이템 없음, 생략)
   2순위: 배운 기술 사용 (보스 40%, 일반 15%)
   3순위: 방어 확률 (HP 40% 이하면 30%, HP 낮을수록 ↑)
   4순위: 평타 */
async function enemyTurn() {
  // 태그전: 현재 활성 적 1마리만 행동
  const enemy = getCurrentEnemy();
  if (!enemy) return;
  const me = state.party[state.activeIndex];
  if (!me || me.hp <= 0) return;

  // AI 판단
  const action = pickEnemyAction(enemy);

  if (action.type === 'defend') {
    enemy.isGuarding = true;
    pushLog(`${enemy.petData.name}이(가) 방어 자세!`, 'info');
    playSfx('swap');
    // 적 쉴드 이펙트
    const enemies = state.enemies || [state.enemy];
    const idx = enemies.indexOf(enemy);
    const card = (enemies.length > 1 && idx >= 0)
      ? document.querySelector(`.pet-card[data-side="enemy"][data-enemy-idx="${idx}"]`)
      : document.querySelector('.pet-card[data-side="enemy"]');
    if (card) {
      const shield = document.createElement('div');
      shield.className = 'shield-effect';
      card.appendChild(shield);
      setTimeout(() => shield.remove(), 700);
      card.classList.add('guarding-persist');
    }
    updateHpBars();
    await sleep(500);
  } else if (action.type === 'charge') {
    enemy.isGuarding = true;
    enemy.charging = true;
    pushLog(`${enemy.petData.name}이(가) 힘을 모은다...`, 'info');
    playSfx('swap');
    updateHpBars();
    await sleep(350);
  } else if (action.type === 'skill') {
    const opts = {};
    if (action.skill === 'all_in') { enemy.allInRisk = true; opts.allIn = true; pushLog(`${enemy.petData.name}: 배수의진!`, 'boss'); }
    else if (action.skill === 'guard_break') { opts.guardBreak = true; pushLog(`${enemy.petData.name}: 가드브레이크!`, 'boss'); }
    await animateAttack(enemy, me, false, opts);
  } else {
    // 평타 (충전 중이었으면 2배)
    const opts = {};
    if (enemy.charging) { opts.charged = true; enemy.charging = false; pushLog(`${enemy.petData.name}: 모아친 일격!`, 'boss'); }
    await animateAttack(enemy, me, false, opts);
  }

  // 턴 종료: 적의 방어/리스크 해제 (충전은 유지)
  endOfTurnCleanup(enemy);
  // 내 방어/리스크도 해제
  const me2 = state.party[state.activeIndex];
  endOfTurnCleanup(me2);
}

function pickEnemyAction(enemy) {
  const hpPct = enemy.hp / enemy.maxHp;
  const isBoss = enemy.isBoss;
  const skills = enemy.skills || [];

  // 기술 사용 시도
  if (skills.length > 0) {
    const skillRate = isBoss ? 0.40 : 0.20;
    if (Math.random() < skillRate) {
      const skill = skills[Math.floor(Math.random() * skills.length)];
      if (skill === 'charge_strike') return { type: 'charge' };
      return { type: 'skill', skill };
    }
  }

  // 방어 확률 (더 상향)
  let defendRate = 0;
  if (hpPct < 0.3) defendRate = 0.55;      // 위급
  else if (hpPct < 0.6) defendRate = 0.35; // 중간
  else defendRate = 0.22;                   // 건강
  if (isBoss) defendRate += 0.08;           // 보스는 더 자주
  if (enemy.justDefended) defendRate *= 0.3; // 직전에 방어했으면 감소

  if (Math.random() < defendRate) {
    enemy.justDefended = true;
    return { type: 'defend' };
  }
  enemy.justDefended = false;

  return { type: 'attack' };
}

/* 적 전멸 시 보상 처리 (onEnemyDown 대체) */
function onAllEnemiesDown() {
  const defeatedList = state.enemies && state.enemies.length
    ? state.enemies
    : [state.enemy];
  const anyBoss = defeatedList.some(e => e.isBoss);
  const lastEnemy = defeatedList[defeatedList.length - 1];
  pushLog(`${lastEnemy.petData.name}을(를) 쓰러뜨렸다!`, 'hit');
  playSfx('victory');

  // 레벨업
  const levelGain = anyBoss ? 4 : 2;
  const alive = state.party.filter(p => p.hp > 0);
  alive.forEach(u => { u.level += levelGain; recalcUnit(u); });
  pushLog(`파티 +${levelGain} 레벨업!`, 'heal');

  // 스톤 지급
  let stoneGain;
  if (anyBoss) {
    stoneGain = defeatedList.length * (40 + Math.floor(Math.random() * 21) - 10);
  } else {
    stoneGain = 10 + Math.floor(Math.random() * 7) - 3;
  }
  state.stones += stoneGain;
  pushLog(`💎 스톤 +${stoneGain} (보유: ${state.stones})`, 'heal');

  // 보스 클리어시 전체 회복
  if (anyBoss) {
    state.party.forEach(u => { u.hp = u.maxHp; });
    pushLog(`보스 클리어! 파티 전체 회복!`, 'heal');
  }

  // 전투 상태 초기화
  state.party.forEach(u => {
    u.isGuarding = false;
    u.charging = false;
    u.allInRisk = false;
  });

  if (state.wave >= 30) {
    state.scene = 'victory';
    finalizeRun();
    render();
    return;
  }

  state.mode = 'next';
  render();
}

/* 스킬 사용 메뉴 - 기술 버튼 누르면 바로 발동 */
function showSkills() {
  const me = state.party[state.activeIndex];
  state.mode = 'skill_menu';
  const existingBox = document.querySelector('.box');
  if (existingBox) existingBox.remove();
  const box = el('div', { className: 'box' });
  const h = el('div', { style: 'margin-bottom: 8px', className: 'panel-title' }, ['기술 선택 (선택 즉시 발동)']);
  box.appendChild(h);
  const grid = el('div', { className: 'choices' });
  me.skills.forEach(skillId => {
    const s = SKILLS[skillId];
    if (!s) return;
    const b = el('button', { className: 'btn' });
    b.innerHTML = `${s.icon} ${s.name}<small>${s.desc}</small>`;
    b.addEventListener('click', () => {
      state.mode = 'action';
      useSkillImmediate(skillId);
    });
    grid.appendChild(b);
  });
  box.appendChild(grid);
  const cancel = el('button', { className: 'btn full', style: 'margin-top: 6px' }, ['취소']);
  cancel.addEventListener('click', () => { state.mode = 'action'; render(); });
  box.appendChild(cancel);
  app.appendChild(box);
}

function executeSkill(skillId) { useSkillImmediate(skillId); }

/* 아이템 사용 메뉴 */
function showItems() {
  state.mode = 'item_menu';
  const existingBox = document.querySelector('.box');
  if (existingBox) existingBox.remove();
  const box = el('div', { className: 'box' });
  const h = el('div', { style: 'margin-bottom: 8px', className: 'panel-title' }, ['아이템 사용']);
  box.appendChild(h);
  const grid = el('div', { className: 'choices' });
  Object.entries(state.inventory).forEach(([itemId, count]) => {
    if (count <= 0) return;
    const it = ITEMS[itemId];
    if (!it) return;
    const b = el('button', { className: 'btn' });
    b.innerHTML = `${it.icon} ${it.name} ×${count}<small>${it.desc}</small>`;
    b.addEventListener('click', () => useItem(itemId));
    grid.appendChild(b);
  });
  box.appendChild(grid);
  const cancel = el('button', { className: 'btn full', style: 'margin-top: 6px' }, ['취소']);
  cancel.addEventListener('click', () => { state.mode = 'action'; render(); });
  box.appendChild(cancel);
  app.appendChild(box);
}

async function useItem(itemId) {
  if (state.busy) return;
  const it = ITEMS[itemId];
  if (!it || !state.inventory[itemId]) return;
  const me = state.party[state.activeIndex];

  if (it.revive) {
    const fainted = state.party.find(u => u.hp <= 0);
    const target = fainted || me;
    target.hp = target.maxHp;
    pushLog(`${it.icon} ${it.name} 사용! ${target.petData.name} 완전 회복!`, 'heal');
  } else {
    const before = me.hp;
    const healAmt = Math.floor(me.maxHp * it.heal);
    me.hp = Math.min(me.maxHp, me.hp + healAmt);
    pushLog(`${it.icon} ${it.name} 사용! +${me.hp - before} HP`, 'heal');
  }
  state.inventory[itemId]--;
  if (state.inventory[itemId] <= 0) delete state.inventory[itemId];
  playSfx('capture_success');
  state.mode = 'action';
  render();
  // 아이템 사용 후 적 공격
  await turnRun(async () => {
    await sleep(400);
  });
}

function doAttack(attacker, defender, isMine, opts = {}) {
  // 가드브레이크: 상대가 방어 중일 때만 적중, 아니면 miss
  if (opts.guardBreak) {
    if (!defender.isGuarding) {
      pushLog(`${attacker.petData.name}의 가드브레이크! 상대가 방어하지 않아 빗나갔다!`, 'info');
      return { dmg: 0, isCrit: false, multi: 1, miss: true };
    }
    // 방어 중이면 무조건 적중 (hitCheck 스킵)
  } else {
    // 일반 공격은 명중 체크
    const hit = hitCheck(attacker, defender);
    if (!hit) {
      pushLog(`${attacker.petData.name}의 공격이 빗나갔다!`, 'info');
      return { dmg: 0, isCrit: false, multi: 1, miss: true };
    }
  }

  const result = calcDamage(attacker, defender, opts);
  defender.hp = Math.max(0, defender.hp - result.dmg);

  const effText = result.multi > 1.2 ? ' (효과적!)' : result.multi < 0.8 ? ' (별로다...)' : '';
  const critText = result.isCrit ? ' 🔥크리티컬!' : '';
  const brkText = opts.guardBreak ? ' (가드 파괴!)' : '';
  const chgText = opts.charged ? ' (모아친 일격!)' : '';
  pushLog(
    `${attacker.petData.name} → ${defender.petData.name} ${result.dmg} 데미지${effText}${critText}${brkText}${chgText}`,
    result.isCrit ? 'crit' : (result.multi > 1.2 ? 'hit' : '')
  );
  return { ...result, miss: false };
}

/* 공격 애니메이션 + 사운드 + 데미지 팝업 */
async function animateAttack(attacker, defender, isMine, opts = {}) {
  const result = doAttack(attacker, defender, isMine, opts);
  if (result.miss) {
    playSfx('miss');
  } else {
    playSfx(result.isCrit ? 'crit' : (result.multi > 1.2 ? 'hit_effective' : 'hit'));
  }

  // 공격자/방어자 측 결정
  const attackerIsMine = state.party.includes(attacker);
  const attackerSide = attackerIsMine ? 'mine' : 'enemy';
  const defenderSide = state.party.includes(defender) ? 'mine' : 'enemy';

  let defenderSelector = `.pet-card[data-side="${defenderSide}"]`;
  let defenderSpriteSelector = `.pet-sprite[data-sprite="${defenderSide}"]`;
  if (defenderSide === 'enemy' && state.enemies && state.enemies.length > 1) {
    const idx = state.enemies.indexOf(defender);
    if (idx >= 0) {
      defenderSelector = `.pet-card[data-side="enemy"][data-enemy-idx="${idx}"]`;
      defenderSpriteSelector = `.pet-sprite[data-sprite="enemy"][data-idx="${idx}"]`;
    }
  }
  let attackerSpriteSelector = `.pet-sprite[data-sprite="${attackerSide}"]`;
  if (attackerSide === 'enemy' && state.enemies && state.enemies.length > 1) {
    const idx = state.enemies.indexOf(attacker);
    if (idx >= 0) attackerSpriteSelector = `.pet-sprite[data-sprite="enemy"][data-idx="${idx}"]`;
  }

  const attackerSprite = document.querySelector(attackerSpriteSelector);
  const defenderSprite = document.querySelector(defenderSpriteSelector);
  const defenderCard = document.querySelector(defenderSelector);
  const scene = document.querySelector('.scene');

  // 공격 모션
  if (attackerSprite) {
    attackerSprite.classList.remove('attack-mine', 'attack-enemy');
    void attackerSprite.offsetWidth;
    attackerSprite.classList.add(attackerSide === 'mine' ? 'attack-mine' : 'attack-enemy');
  }

  await sleep(240);

  if (result.miss) {
    if (defenderCard) showMissPopup(defenderCard);
    await sleep(400);
    return;
  }

  // === 타격 순간 이펙트 ===
  // 슬래시 라인
  if (defenderCard) {
    addSlashEffect(defenderCard, attackerSide, result.isCrit);
  }

  // 화면 플래시
  if (scene) {
    scene.classList.remove('impact-flash', 'crit-flash');
    void scene.offsetWidth;
    scene.classList.add(result.isCrit ? 'crit-flash' : 'impact-flash');
    setTimeout(() => scene.classList.remove('impact-flash', 'crit-flash'), 400);
  }

  // 카메라 셰이크
  if (scene) {
    scene.classList.remove('shake-small', 'shake-big');
    void scene.offsetWidth;
    scene.classList.add(result.isCrit || opts.guardBreak || opts.charged || opts.allIn ? 'shake-big' : 'shake-small');
    setTimeout(() => scene.classList.remove('shake-small', 'shake-big'), 500);
  }

  // 피격 모션
  if (defenderSprite) {
    defenderSprite.classList.remove('hit-flash');
    void defenderSprite.offsetWidth;
    defenderSprite.classList.add('hit-flash');
  }
  if (defenderCard) {
    defenderCard.classList.remove('shake');
    void defenderCard.offsetWidth;
    defenderCard.classList.add('shake');

    // 방어 성공 시 BLOCK 텍스트
    if (defender.isGuarding && !opts.guardBreak) {
      addBlockEffect(defenderCard);
    } else {
      showDamagePopup(defenderCard, result.dmg, result.isCrit, result.multi);
    }

    // 크리티컬/강타는 충격파 + 스파크
    if (result.isCrit || opts.guardBreak || opts.charged || opts.allIn) {
      addImpactRing(defenderCard, result.isCrit);
      if (result.isCrit) addSparks(defenderCard);
    }
  }

  await sleep(320);
  updateHpBars();

  if (defender.hp <= 0 && defenderSprite) {
    defenderSprite.classList.add('faint');
    playSfx('faint');
    await sleep(700);
    // 보스 태그전 - 다음 보스로 전환
    if (state.enemies && state.enemies.length > 1) {
      const aliveEnemies = state.enemies.filter(e => e.hp > 0);
      if (aliveEnemies.length > 0 && !state.party.includes(defender)) {
        render();
      }
    }
  } else {
    await sleep(120);
  }
}

function addSlashEffect(cardEl, attackerSide, isCrit) {
  const slash = document.createElement('div');
  slash.className = 'slash-effect slash-' + attackerSide + (isCrit ? ' crit' : '');
  cardEl.appendChild(slash);
  setTimeout(() => slash.remove(), 400);
}

function addImpactRing(cardEl, isCrit) {
  const ring = document.createElement('div');
  ring.className = 'impact-ring' + (isCrit ? ' crit' : '');
  cardEl.appendChild(ring);
  setTimeout(() => ring.remove(), 600);
}

function addSparks(cardEl) {
  for (let i = 0; i < 8; i++) {
    const spark = document.createElement('div');
    spark.className = 'spark';
    const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.3;
    const dist = 30 + Math.random() * 30;
    spark.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    spark.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    spark.style.left = '50%';
    spark.style.top = '50%';
    cardEl.appendChild(spark);
    setTimeout(() => spark.remove(), 650);
  }
}

function addBlockEffect(cardEl) {
  // 쉴드 번쩍
  const shield = document.createElement('div');
  shield.className = 'shield-effect';
  cardEl.appendChild(shield);
  setTimeout(() => shield.remove(), 750);
  // BLOCK 텍스트
  const block = document.createElement('div');
  block.className = 'block-effect';
  block.textContent = 'BLOCK!';
  cardEl.appendChild(block);
  setTimeout(() => block.remove(), 750);
}

function showMissPopup(cardEl) {
  const pop = document.createElement('div');
  pop.className = 'dmg-popup miss';
  pop.textContent = 'MISS';
  cardEl.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showDamagePopup(cardEl, dmg, isCrit, multi) {
  const pop = document.createElement('div');
  pop.className = 'dmg-popup' + (isCrit ? ' crit' : '') + (multi > 1 ? ' eff' : '');
  pop.textContent = (isCrit ? '💥 ' : '') + '-' + dmg;
  cardEl.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
}

function updateHpBars() {
  const me = state.party[state.activeIndex];
  updateCardHp('mine', me);
  // 적은 여러 마리
  const enemies = state.enemies && state.enemies.length ? state.enemies : (state.enemy ? [state.enemy] : []);
  enemies.forEach((e, idx) => {
    const card = enemies.length > 1
      ? document.querySelector(`.pet-card[data-side="enemy"][data-enemy-idx="${idx}"]`)
      : document.querySelector('.pet-card[data-side="enemy"]');
    if (card) updateCardEl(card, e);
  });
  updatePartyMiniBars();
}

function updateCardEl(card, unit) {
  if (!card || !unit) return;
  const pct = Math.max(0, (unit.hp / unit.maxHp) * 100);
  const fill = card.querySelector('.hpfill');
  const text = card.querySelector('.hptext');
  if (fill) {
    fill.style.width = pct + '%';
    fill.classList.remove('low', 'crit');
    if (pct < 25) fill.classList.add('crit');
    else if (pct < 50) fill.classList.add('low');
  }
  if (text) text.textContent = `${Math.max(0, unit.hp)} / ${unit.maxHp}`;
}

function updateCardHp(side, unit) {
  if (!unit) return;
  const card = document.querySelector(`.pet-card[data-side="${side}"]`);
  if (!card) return;
  const pct = Math.max(0, (unit.hp / unit.maxHp) * 100);
  const fill = card.querySelector('.hpfill');
  const text = card.querySelector('.hptext');
  if (fill) {
    fill.style.width = pct + '%';
    fill.classList.remove('low', 'crit');
    if (pct < 25) fill.classList.add('crit');
    else if (pct < 50) fill.classList.add('low');
  }
  if (text) text.textContent = `${Math.max(0, unit.hp)} / ${unit.maxHp}`;
}

function updatePartyMiniBars() {
  const slots = document.querySelectorAll('.party-slot');
  state.party.forEach((u, i) => {
    const slot = slots[i];
    if (!slot) return;
    const mini = slot.querySelector('.mini-hp');
    if (mini) {
      const pct = Math.max(0, (u.hp / u.maxHp) * 100);
      mini.style.width = pct + '%';
      mini.style.background = pct < 30 ? 'var(--danger)' : pct < 60 ? 'var(--accent)' : 'var(--ok)';
    }
    if (u.hp <= 0) slot.classList.add('fainted');
  });
}

function recalcUnit(u) {
  const s = u.petData.sg;
  const i = u.petData.ic;
  let hpStat = Math.floor(i.hp + s.hp * u.level * (1 + u.iv));
  let atkStat = Math.floor(i.atk + s.atk * u.level * (1 + u.iv));
  let defStat = Math.floor(i.def + s.def * u.level * (1 + u.iv));
  if (u.isCaptured) {
    hpStat = Math.floor(hpStat * 1.2);
    atkStat = Math.floor(atkStat * 1.15);
    defStat = Math.floor(defStat * 1.1);
  }
  u.maxHp = hpStat;
  u.atk = atkStat;
  u.def = defStat;
  u.agi = Math.floor(i.agi + s.agi * u.level);
  // HP는 회복되지 않음 (상한만 올라감)
  if (u.hp > u.maxHp) u.hp = u.maxHp;
}

/* ===== 교체 ===== */
function showSwap() {
  state.mode = 'swap';
  const box = document.querySelector('.box');
  if (box) box.remove();
  const newBox = el('div', { className: 'box' });
  const h = el('div', { style: 'margin-bottom: 8px' }, ['교체할 펫 선택']);
  newBox.appendChild(h);
  const grid = el('div', { className: 'choices' });
  state.party.forEach((u, i) => {
    const b = el('button', {
      className: 'btn' + (u.hp <= 0 ? ' danger' : (i === state.activeIndex ? ' ok' : '')),
    });
    b.innerHTML = `${u.petData.name} Lv.${u.level}<small>HP ${u.hp}/${u.maxHp}${u.hp<=0?' (기절)':i===state.activeIndex?' (출전중)':''}</small>`;
    if (u.hp > 0 && i !== state.activeIndex) {
      b.addEventListener('click', () => swapTo(i));
    } else {
      b.disabled = true; b.style.opacity = '0.5';
    }
    grid.appendChild(b);
  });
  newBox.appendChild(grid);
  const cancel = el('button', { className: 'btn full', style: 'margin-top: 6px' }, ['취소']);
  cancel.addEventListener('click', () => { state.mode = 'action'; render(); });
  newBox.appendChild(cancel);
  app.appendChild(newBox);
}

async function swapTo(i) {
  if (state.busy) return;
  const outgoing = state.party[state.activeIndex];
  outgoing.isGuarding = false;
  outgoing.charging = false;
  outgoing.allInRisk = false;
  const oldName = outgoing.petData.name;
  state.activeIndex = i;
  pushLog(`${oldName} → ${state.party[i].petData.name} 교체!`, 'info');
  playSfx('swap');
  state.mode = 'action';
  render();
  // 교체 턴: 적이 공격
  await turnRun(async () => {
    await sleep(200);
    // 내 행동 없음, enemyTurn이 처리
  });
}

/* ===== 포획 ===== */
async function showCaptureAnimation() {
  const scene = document.querySelector('.scene');
  if (!scene) return;
  const overlay = document.createElement('div');
  overlay.className = 'capture-overlay';
  overlay.innerHTML = '<div class="capture-rope"></div>';
  scene.appendChild(overlay);
  await sleep(900);
  overlay.remove();
}

async function tryCapture() {
  if (state.busy) return;
  const enemy = getCurrentEnemy();
  if (!enemy) return;
  if (enemy.isBoss) return;
  if (state.party.length >= 6) {
    pushLog('파티가 가득 찼다! (최대 6마리)', 'info');
    return;
  }
  const rate = (1 - enemy.hp / enemy.maxHp) * 0.7 + 0.1;

  state.busy = true;
  try {
    pushLog(`${enemy.petData.name} 포획을 시도했다!`, 'info');
    playSfx('capture');
    await showCaptureAnimation();

    if (Math.random() < rate) {
      pushLog(`성공! ${enemy.petData.name}을(를) 잡았다!`, 'heal');
      playSfx('capture_success');
      state.captured.add(enemy.petData.name);
      state.stats.totalCaptures++;
      const newUnit = createUnit(enemy.petData, enemy.level, {
        isCaptured: true,
        iv: enemy.iv,
      });
      state.party.push(newUnit);
      saveStats();
      enemy.hp = 0; // 포획 = 적 제거
      state.busy = false;
      checkBattleEnd();
      return;
    }
    pushLog(`아! 놓쳤다!`, 'crit');
    playSfx('miss');
    // 실패 시 적 반격
    await enemyTurn();
    const me = state.party[state.activeIndex];
    if (me && me.hp <= 0) autoSwapToNext();
    state.busy = false;
    checkBattleEnd();
  } catch(e) {
    state.busy = false;
    console.error(e);
  }
}

async function tryFlee() {
  if (state.busy) return;
  const me = state.party[state.activeIndex];
  const enemy = getCurrentEnemy();
  if (!enemy) return;
  const agiDiff = me.agi - enemy.agi;
  const fleeRate = Math.max(0.2, Math.min(0.9, 0.3 + agiDiff * 0.02));

  state.busy = true;
  try {
    if (Math.random() < fleeRate) {
      pushLog(`무사히 도망쳤다! (순발력 차 ${agiDiff})`, 'info');
      playSfx('flee');
      state.mode = 'next';
      state.busy = false;
      render();
      return;
    }
    pushLog(`도망에 실패했다! (성공률 ${Math.round(fleeRate*100)}%)`, 'crit');
    await enemyTurn();
    const m2 = state.party[state.activeIndex];
    if (m2 && m2.hp <= 0) autoSwapToNext();
    state.busy = false;
    checkBattleEnd();
  } catch(e) {
    state.busy = false;
    console.error(e);
  }
}

/* ===== 보상 ===== */
function rollRewards() {
  const hasFainted = state.party.some(u => u.hp <= 0);
  const pool = [
    { id: 'heal-full', label: '🌿 전체 회복', desc: '파티 전원 HP 회복', apply: () => {
      state.party.forEach(u => { if (u.hp > 0) u.hp = u.maxHp; });
      pushLog('파티 전체 HP 회복!', 'heal');
    }},
    // 부활의 샘은 기절자가 있을 때만 풀에 포함
    ...(hasFainted ? [{ id: 'revive', label: '✨ 부활의 샘', desc: '기절한 펫 1마리 완전 회복', apply: () => {
      const fainted = state.party.find(u => u.hp <= 0);
      if (fainted) {
        fainted.hp = fainted.maxHp;
        pushLog(`${fainted.petData.name} 부활!`, 'heal');
      }
    }}] : []),
    { id: 'atk-up', label: '⚔️ 공격 증폭', desc: '파티 공격력 +15%', apply: () => {
      state.party.forEach(u => u.atk = Math.floor(u.atk * 1.15));
      pushLog('파티 공격력 상승!', 'heal');
    }},
    { id: 'def-up', label: '🛡️ 방어 강화', desc: '파티 방어력 +20%', apply: () => {
      state.party.forEach(u => u.def = Math.floor(u.def * 1.20));
      pushLog('파티 방어력 상승!', 'heal');
    }},
    { id: 'hp-up', label: '❤️ 체력 확장', desc: '파티 최대 HP +20%', apply: () => {
      state.party.forEach(u => {
        const bonus = Math.floor(u.maxHp * 0.2);
        u.maxHp += bonus; u.hp += bonus;
      });
      pushLog('파티 최대 HP 상승!', 'heal');
    }},
    { id: 'level-up', label: '📈 레벨업의 정수', desc: '파티 전원 +3 레벨', apply: () => {
      state.party.forEach(u => { u.level += 3; recalcUnit(u); });
      pushLog('파티 +3 레벨업!', 'heal');
    }},
    { id: 'agi-up', label: '💨 순발력 강화', desc: '파티 순발력 +20%', apply: () => {
      state.party.forEach(u => u.agi = Math.floor(u.agi * 1.20));
      pushLog('파티 순발력 상승!', 'heal');
    }},
    { id: 'stones', label: '💎 스톤 주머니', desc: '스톤 +50 획득', apply: () => {
      state.stones += 50;
      pushLog(`💎 +50 스톤 (보유: ${state.stones})`, 'heal');
    }},
  ];
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 3);
}

function renderRewardBox() {
  const box = el('div', { className: 'box' });
  const title = el('div', {
    style: 'margin-bottom: 8px; color: var(--accent); font-size: 20px; text-align: center',
  }, [`⭐ 보상 선택 ⭐`]);

    });

  });

    beginBattle();

/* ===== 상점 =====
   고기 3종(랜덤 2~3개) + 스킬(배우지 않은 것 중 1~2개 랜덤) + 엘릭서(확률) */
function rollShop() {
  const meatKeys = ['meat_berga', 'meat_manmo', 'meat_kaku'];
  const skillKeys = Object.keys(SKILLS);
  const stock = [];

  // 고기 2~3개
  const meatShuf = [...meatKeys].sort(() => Math.random() - 0.5);
  const meatCount = 2 + (Math.random() < 0.5 ? 1 : 0);
  meatShuf.slice(0, meatCount).forEach(k => stock.push({ type: 'item', id: k }));

  // 엘릭서 30% 확률
  if (Math.random() < 0.3) stock.push({ type: 'item', id: 'elixir' });

  // 스킬 1~2개 (현재 출전 펫이 안 배운 것 우선)
  const me = state.party[state.activeIndex];
  const learned = new Set(me.skills || []);
  const unlearned = skillKeys.filter(k => !learned.has(k));
  const skillShuf = unlearned.sort(() => Math.random() - 0.5);
  const skillCount = Math.min(1 + (Math.random() < 0.5 ? 1 : 0), skillShuf.length);
  skillShuf.slice(0, skillCount).forEach(k => stock.push({ type: 'skill', id: k }));

  return stock;
}

function renderShop() {
  // HUD
  const hud = el('div', { className: 'hud' });
  hud.innerHTML = `
    <div>💎 ${state.stones}</div>
    <div class="wave">SHOP</div>

  `;

  const wrap = el('div', { className: 'shop-screen' });

  const grid = el('div', { className: 'shop-grid' });

      if (affordable) {

      } else {

      }

        <div class="shop-icon">${s.icon}</div>
        <div class="shop-name">${s.name}</div>
        <div class="shop-desc">${s.desc}</div>
        <div class="shop-price">💎 ${s.price}</div>
        <div class="shop-tag">기술</div>
      `;
      const affordable = state.stones >= s.price;
      if (affordable) {
        card.addEventListener('click', () => buySkill(entry.id, idx));
      } else {
        card.classList.add('unaffordable');
      }
    }
    grid.appendChild(card);
  });

    grid.appendChild(el('div', { className: 'shop-empty' }, ['매진! 상점을 나가세요.']));

  const invList = el('div', { className: 'shop-inv-list' });
  const invEntries = Object.entries(state.inventory).filter(([,c]) => c > 0);
  if (invEntries.length === 0) {
    invList.appendChild(el('span', { className: 'shop-inv-empty' }, ['없음']));
  } else {
    invEntries.forEach(([id, count]) => {
      const it = ITEMS[id];
      invList.appendChild(el('span', { className: 'shop-inv-item' }, [`${it.icon} ${it.name} ×${count}`]));
    });
  }
  invWrap.appendChild(invList);
  wrap.appendChild(invWrap);

  // 출전 펫이 배운 기술
  const me = state.party[state.activeIndex];
  if (me.skills && me.skills.length > 0) {
    const sWrap = el('div', { className: 'shop-inv' });
    sWrap.appendChild(el('div', { className: 'shop-inv-title' }, [`✨ ${me.petData.name}의 기술`]));
    const sList = el('div', { className: 'shop-inv-list' });

      sList.appendChild(el('span', { className: 'shop-inv-item' }, [`${sk.icon} ${sk.name}`]));

    style: 'margin-top: 16px; padding: 12px; font-size: 18px; max-width: 400px; width: 100%;'
  }, ['▶ 다음 전투로']);

      <div class="skill-picker-title">${s.icon} ${s.name}</div>

    `;

    state.party.forEach((p, i) => {
      const hasSkill = p.skills && p.skills.includes(state.shopPicker.skillId);
      const card = el('div', { className: 'skill-picker-pet' + (hasSkill ? ' disabled' : '') });
      card.innerHTML = `
        <img src="${p.petData.image}" onerror="this.style.visibility='hidden'">
        <div class="n">${p.petData.name}</div>
        <div class="lv">Lv.${p.level}${hasSkill ? ' · 이미 배움' : ''}</div>
      `;
      if (!hasSkill) card.addEventListener('click', () => confirmSkillLearn(i));
      grid.appendChild(card);
    });
    panel.appendChild(grid);
    const cancel = el('button', { className: 'btn full', style: 'margin-top: 12px;' }, ['취소']);
    cancel.addEventListener('click', cancelSkillPicker);
    panel.appendChild(cancel);
    overlay.appendChild(panel);
    wrap.appendChild(overlay);
  }

  app.appendChild(wrap);
}

function buyItem(itemId, stockIdx) {
  const it = ITEMS[itemId];
  if (!it) return;
  if (state.stones < it.price) return;
  state.stones -= it.price;
  state.inventory[itemId] = (state.inventory[itemId] || 0) + 1;
  state.shopStock.splice(stockIdx, 1);
  playSfx('capture_success');
  render();
}

function buySkill(skillId, stockIdx) {
  const s = SKILLS[skillId];
  if (!s) return;
  if (state.stones < s.price) return;
  // 펫 선택 UI 띄우기
  state.shopPicker = { skillId, stockIdx };
  render();
}

function confirmSkillLearn(petIdx) {
  const pick = state.shopPicker;
  if (!pick) return;
  const s = SKILLS[pick.skillId];
  const pet = state.party[petIdx];
  if (!pet || !s) return;
  if (state.stones < s.price) { state.shopPicker = null; render(); return; }
  if (!pet.skills) pet.skills = [];
  if (pet.skills.includes(pick.skillId)) {
    // 이미 배운 기술 - 환불 없이 취소만
    state.shopPicker = null;
    render();
    return;
  }
  pet.skills.push(pick.skillId);
  state.stones -= s.price;
  state.shopStock.splice(pick.stockIdx, 1);
  state.shopPicker = null;
  playSfx('crit');
  render();
}

function cancelSkillPicker() {
  state.shopPicker = null;
  render();
}

function leaveShop() {
  state.scene = 'reward';
  state.pendingRewards = rollRewards();
  state.mode = 'action';
  render();
}

/* ===== 게임오버 / 승리 ===== */
function finalizeRun() {
  state.runEndTime = Date.now();

    state.stats.victories = (state.stats.victories || 0) + 1;
    playSfx('victory');
    startBgm('ending');
  } else {
    stopBgm();
  }
  saveStats();

}

function renderGameOver() {

}

/* ===== 오디오 시스템 (Tone.js) ===== */
const audio = {
  ready: false,
  muted: false,
  ctx: null,       // Tone 전역
  master: null,
  bgmLoop: null,
  currentBiome: null,
};

async function initAudio() {
  if (audio.ready) return;
  if (typeof Tone === 'undefined') return;
  try {
    await Tone.start();
    audio.master = new Tone.Volume(-8).toDestination();
    audio.ready = true;
  } catch(e) { /* 실패해도 게임은 돌아감 */ }
}

function playSfx(name) {
  if (!audio.ready || audio.muted || typeof Tone === 'undefined') return;
  try {
    const now = Tone.now();
    if (name === 'hit' || name === 'hit_effective') {
      const s = new Tone.MembraneSynth({
        pitchDecay: 0.02, octaves: 4,
        envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 }
      }).connect(audio.master);
      s.triggerAttackRelease(name === 'hit_effective' ? 'C3' : 'G2', 0.12, now);
      setTimeout(() => s.dispose(), 400);
    } else if (name === 'crit') {
      const s = new Tone.Synth({
        oscillator: { type: 'sawtooth' },
        envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      s.triggerAttackRelease('A4', 0.05, now);
      s.triggerAttackRelease('E5', 0.08, now + 0.05);
      s.triggerAttackRelease('A5', 0.15, now + 0.13);
      setTimeout(() => s.dispose(), 600);
    } else if (name === 'faint') {
      const s = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.3 }
      }).connect(audio.master);
      s.triggerAttackRelease('E4', 0.1, now);
      s.triggerAttackRelease('C4', 0.15, now + 0.1);
      s.triggerAttackRelease('G3', 0.3, now + 0.25);
      setTimeout(() => s.dispose(), 800);
    } else if (name === 'victory') {
      const s = new Tone.Synth({
        oscillator: { type: 'square' },
        envelope: { attack: 0.005, decay: 0.2, sustain: 0.1, release: 0.15 }
      }).connect(audio.master);
      ['C5','E5','G5','C6'].forEach((n, i) => s.triggerAttackRelease(n, 0.12, now + i*0.1));
      setTimeout(() => s.dispose(), 900);
    } else if (name === 'swap') {
      const s = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      s.triggerAttackRelease('G4', 0.08, now);
      s.triggerAttackRelease('D5', 0.08, now + 0.08);
      setTimeout(() => s.dispose(), 400);
    } else if (name === 'capture') {
      const s = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.15 }
      }).connect(audio.master);
      s.triggerAttackRelease('A4', 0.1, now);
      s.triggerAttackRelease('A4', 0.1, now + 0.18);
      s.triggerAttackRelease('A4', 0.1, now + 0.36);
      setTimeout(() => s.dispose(), 700);
    } else if (name === 'capture_success') {
      const s = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
      }).connect(audio.master);
      s.triggerAttackRelease(['C5','E5','G5'], 0.4, now);
      s.triggerAttackRelease(['D5','F5','A5'], 0.4, now + 0.2);
      s.triggerAttackRelease(['C6','E6','G6'], 0.5, now + 0.4);
      setTimeout(() => s.dispose(), 1200);
    } else if (name === 'miss') {
      const s = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      s.triggerAttackRelease('D4', 0.15, now);
      s.triggerAttackRelease('A3', 0.2, now + 0.15);
      setTimeout(() => s.dispose(), 500);
    } else if (name === 'flee') {
      const s = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      ['E5','C5','A4','F4'].forEach((n, i) => s.triggerAttackRelease(n, 0.08, now + i*0.06));
      setTimeout(() => s.dispose(), 500);
    } else if (name === 'select') {
      const s = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 }
      }).connect(audio.master);
      s.triggerAttackRelease('E5', 0.04, now);
      setTimeout(() => s.dispose(), 200);
    }
  } catch(e) { /* ignore */ }
}

/* BGM - 바이옴별 MP3 파일 로드 */
const BGM_FILES = {
  title:   'bgm/bgm_title.mp3',
  meadow:  'bgm/bgm_meadow.mp3',
  cave:    'bgm/bgm_cave.mp3',
  coast:   'bgm/bgm_coast.mp3',
  island:  'bgm/bgm_island.mp3',
  volcano: 'bgm/bgm_volcano.mp3',
  frozen:  'bgm/bgm_frozen.mp3',
  boss:    'bgm/bgm_boss.mp3',
  ending:  'bgm/bgm_ending.mp3',
};

let currentBgmAudio = null;  // 현재 재생 중인 Audio 객체

async function startBgm(bgmId) {
  if (audio.muted) return;
  if (audio.currentBiome === bgmId && currentBgmAudio && !currentBgmAudio.paused) return;
  stopBgm();
  const src = BGM_FILES[bgmId];
  if (!src) return;
  try {
    const a = new Audio(src);
    a.loop = true;
    a.volume = 0.35; // 기본 볼륨
    // 약간의 페이드인
    a.volume = 0;
    const playPromise = a.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(() => { /* autoplay 막힘 */ });
    }
    // 페이드인 (0 → 0.35, 1초)
    let vol = 0;
    const fadeIn = setInterval(() => {
      vol += 0.035;
      if (vol >= 0.35) { vol = 0.35; clearInterval(fadeIn); }
      if (a && !a.paused) a.volume = vol;
    }, 100);

    currentBgmAudio = a;
    audio.currentBiome = bgmId;
  } catch(e) { /* ignore */ }
}

function stopBgm() {
  if (currentBgmAudio) {
    try {
      // 짧은 페이드아웃
      const a = currentBgmAudio;
      let vol = a.volume;
      const fadeOut = setInterval(() => {
        vol -= 0.07;
        if (vol <= 0) {
          vol = 0;
          clearInterval(fadeOut);
          a.pause();
          a.src = '';
        }
        try { a.volume = Math.max(0, vol); } catch(e) {}
      }, 40);
    } catch(e) {}
    currentBgmAudio = null;
  }
  audio.currentBiome = null;
}

function toggleMute() {
  audio.muted = !audio.muted;
  if (audio.muted) {
    stopBgm();
  } else {
    // 현재 씬에 맞는 BGM 재개
    if (state.scene === 'battle' || state.scene === 'reward') {
      if (state.enemy && state.enemy.isBoss) startBgm('boss');
      else startBgm(getCurrentBiome().id);
    } else if (state.scene === 'starter') {
      startBgm('title');
    } else if (state.scene === 'victory') {
      startBgm('ending');
    }
  }
  const btn = document.getElementById('mute-btn');
  if (btn) btn.textContent = audio.muted ? '🔇' : '🔊';
}

/* 랭킹 불러오기 - 도달 웨이브 내림차순, 같으면 클리어타임 오름차순 */
async function fetchRanking() {
  if (!wrDb) return [];
  try {
    const snap = await wrDb.ref('jajarogue_rankings').once('value');
    const data = snap.val() || {};
    const list = Object.values(data);
    // 정렬: wave ↓, 같으면 timeMs ↑
    list.sort((a, b) => {
      if (b.wave !== a.wave) return b.wave - a.wave;
      return (a.timeMs || 0) - (b.timeMs || 0);
    });
    // 랭킹에 오른 플레이어 이름을 보스 소유자 풀로 재활용한다
    JA_RANKER_NAMES = list.map(r => r.nickname).filter(n => n && n.length <= 12).slice(0, 20);
    return list.slice(0, 10);
  } catch(e) {
    console.warn('랭킹 로드 실패', e);
    return [];
  }
}

/* 로드된 데이터로 state 복원 */
function restoreFromSave(save) {
  if (!save || !save.party) return false;
  state.nickname = save.nickname;
  state.scene = 'battle';
  state.wave = save.wave;
  state.stones = save.stones || 0;
  state.inventory = save.inventory || {};
  state.runStartTime = save.runStartTime || Date.now();
  state.captured = new Set(save.captured || []);
  state.party = save.party.map(p => {
    const pd = PET_DATA.find(x => x.name === p.name);
    if (!pd) return null;
    const u = createUnit(pd, p.level, { isCaptured: p.isCaptured, iv: p.iv, skills: p.skills });
    u.hp = p.hp; u.maxHp = p.maxHp; u.atk = p.atk; u.def = p.def; u.agi = p.agi;
    return u;
  }).filter(Boolean);
  state.activeIndex = Math.min(save.activeIndex || 0, state.party.length - 1);
  state.busy = false;
  state.mode = 'action';
  // 불러온 시점부터 웨이브 시작
  beginBattle();
  return true;
}

/* 시간 포맷 mm:ss */
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}
