<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쟈쟈서버 펫 도감</title>
<meta name="description" content="쟈쟈서버 펫의 속성, 획득 방법, S급 성장률과 초기치를 한눈에 보는 도감">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="preload" href="pet_data.json" as="fetch" crossorigin>
<link rel="stylesheet" href="jaja-mate.css">
<style>
.tr-mark{font-size:10.5px;font-weight:800;color:#b86f00;background:#fff1d1;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:2px}
[data-theme="dark"] .tr-mark{background:#3a2c10;color:#ffcf6b}
.tr-plus{display:block;font-size:11px;font-weight:800;color:#d08a00}
.m-sec.trans{background:linear-gradient(135deg,rgba(255,236,196,.45),rgba(255,248,232,.25));border-radius:18px;padding:12px 12px 10px;box-shadow:inset 0 0 0 1px rgba(245,166,35,.3)}
[data-theme="dark"] .m-sec.trans{background:rgba(70,55,20,.35)}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.skin-card{background:var(--tint);border-radius:14px;padding:8px 6px;text-align:center}
.skin-img{width:100%;aspect-ratio:1;border-radius:10px;background:var(--img-bg);display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.skin-img img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated}
.skin-title{font-size:12px;font-weight:800;color:var(--ink2)}
.skin-ride{font-size:11px;color:var(--ink3);margin-top:1px}
.dex-table td:nth-child(2){white-space:nowrap}
.f-btn-tip{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5}
</style>
<script src="jaja-mate.js"></script>
</head>
<body>

<header class="top"><div class="top-in">
  <button class="toggle-btn" id="toggleBtn" type="button" aria-label="메뉴 열기">☰</button>
  <a class="brand" href="index.html">SA 쟈쟈<small>JAJA SERVER TOOLS</small></a>
  <span class="top-page">🐾 펫 도감</span>
  <button class="top-dark" id="darkBtn" type="button" aria-label="다크모드"><span class="moon">🌙</span><span class="sun">☀️</span></button>
</div></header>

<div class="sb-backdrop" id="sbBackdrop"></div>
<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo"><span class="sb-logo-dot"></span>SA 쟈쟈</div>
    <div class="sb-sub">JAJA SERVER TOOLS</div>
  </div>
  <div class="sb-nav" id="sbNav" data-expanded="true"></div>
  <div class="sb-filler">
    <div class="sb-mascot">🐾</div>
    <div class="sb-filler-title">카드를 누르면<br>자세히 볼 수 있어요</div>
    <div class="sb-filler-sub">♡ 를 눌러 즐겨찾기도 돼요</div>
  </div>
  <div class="sb-footer"><span class="sb-footer-txt" id="loadStatusSb">로딩중...</span></div>
</div>

<main class="shell">
  <div class="page-head">
    <h1 class="page-title">펫 도감</h1>
    <p class="page-sub">초기치 &amp; 성장률 자동계산 · 공홈 펫 정보를 바탕으로 S급 기준으로 보여줘요</p>
  </div>
  <button class="btn ghost filter-toggle" id="filterToggle" type="button" aria-expanded="false">검색·필터 열기</button>
  <div class="dex-layout">
    <aside class="filters box" id="filters">
      <div class="f-title">검색</div>
      <input id="search" class="f-input" type="search" placeholder="펫 이름 / 획득처 (초성 가능)" autocomplete="off" aria-label="펫 검색">
      <div class="f-title">속성</div>
      <div class="f-seg" id="attrSeg"></div>
      <div class="f-title">속성값 필터 <small>최대 2속성 · 총합 10</small></div>
      <label class="sw-row" title="켜면 고른 속성값 '이상'인 펫이 모두 나와요 (예: 수7 → 수7 이상)"><input type="checkbox" id="attrMode"><span class="sw-track"><span class="sw-thumb"></span></span><span class="sw-text">선택값 이상 검색</span></label>
      <div class="asl" id="attrSliders"></div>
      <div class="f-title">정렬</div>
      <select id="sortSel" class="f-input" aria-label="정렬">
        <option value="default">기본정렬</option>
        <option value="atk">공격 성장률 높은순</option>
        <option value="def">방어 성장률 높은순</option>
        <option value="dex">순발 성장률 높은순</option>
        <option value="hp">내구 성장률 높은순</option>
        <option value="total">총성장 높은순</option>
        <option value="name">이름순</option>
      </select>
      <button type="button" id="transBtn" class="f-btn">♻️ 1환생 수치로 보기</button>
      <div class="f-title">보기 방식</div>
      <div class="f-seg" id="viewSeg"></div>
      <div class="f-title">분류</div>
      <div class="chips" id="catChips"></div>
    </aside>

    <section class="dex-main">
      <div class="stats-row">
        <span class="pill"><b id="statTotal">-</b>전체 펫</span>
        <span class="pill"><b id="statShown">-</b>표시중</span>
        <span class="pill"><b id="statMount">-</b>탑승가능</span>
      </div>
      <div id="grid"></div>
      <div class="empty" id="empty" hidden>검색 결과가 없어요.</div>
      <button class="btn ghost" id="loadmore" type="button" hidden>더 보기</button>
    </section>
  </div>
</main>
<p class="foot">쟈쟈서버 편의기능 made by 야채부락리 애호박</p>

<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="mclose" id="mClose" type="button" aria-label="닫기">✕</button>
    <div id="mBody"></div>
  </div>
</div>

  const B = rankInfoB(num(r.h0)+num(r.a0)+num(r.d0)+num(r.s0));
  const lv = num(r.lvup);
  const ph=num(r.h0)+lv+num(t.h), pa=num(r.a0)+lv+num(t.a), pd=num(r.d0)+lv+num(t.d), ps=num(r.s0)+lv+num(t.s);
  const growth = disp(ph*B/10000, pa*B/10000, pd*B/10000, ps*B/10000);
  return { growth, totalGrowth: growth.a+growth.d+growth.s };
}
function statsOf(r){
  const base = r._st || (r._st = calcStats(r));
  if(!S.trans) return base;
  const tr = calcTrans(r);
  return tr ? { init: base.init, growth: tr.growth, totalGrowth: tr.totalGrowth, trans: true } : base;
}
const gfmt = (st, v) => st.trans ? r3(v) : cut3(v);

function howType(s){
  s = String(s || "");
  if(/골드볼라/.test(s)) return "골드볼라";
  if(/복권/.test(s)) return "복권페트";
  if(/히든 획득|히든/.test(s)) return "히든페트";
  if(/불꽃|공간|오형제|미선|황씨|퀘스트|수집|보상|이벤트|선물|퀴즈도장|타니토스|석상/.test(s)) return "퀘스트페트";
  if(/레이드|주간|일일|페트상자|페트병|전리품|조합/.test(s)) return "레이드페트";
  if(/비밀|포획|통로|난파|전지역|사이너스|하이하모|쟈루|가우린|가이아|원주민|포루|포우렌|에레보스|동굴|광산|층|전역|마을|해저|길|쿠오|쿠르|라토토|아스마르|칠흑|유리|성인식|폐허|숲의|속임수|몽환|고야산|채석장|마리너스|카루타나/.test(s)) return "필드페트";
  if(/코인페트/.test(s)) return "코인페트";
  return "기타";
}
const isMoneyPet = r => { const v = String(r.rarity || "").trim(); return v === "1" || v === "2"; };
function mountOk(v){ v = String(v == null ? "" : v).trim(); if(v === "" || v === "0" || /불가/.test(v)) return false; return v === "1" || v === "가능" || /탑승가능/.test(v); }
const petIdNumber = r => { const m = String(r.id || r.imageCode || "").trim().match(/\d+/); return m ? parseInt(m[0], 10) : 0; };
const isOldPet = r => { const n = petIdNumber(r); return n >= 1 && n <= 334; };
function rarityText(v){ v = String(v || "").trim(); if(v === "0") return "일반등급"; if(v === "1") return "2등급(돈펫)"; if(v === "2") return "1등급(돈펫)"; return v || "-"; }
const rarityShort = v => { v = String(v || "").trim(); return v === "1" ? "2등급" : v === "2" ? "1등급" : ""; };

/* ===== 펫 스킨 (pet_skin.csv) ===== */
let SKIN_ROWS = [];
function parseCsvLine(line){
  const out = []; let cur = "", q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line.charAt(i);
    if(ch === '"'){ if(q && line.charAt(i+1) === '"'){ cur += '"'; i++; } else q = !q; }
    else if(ch === "," && !q){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur); return out;
}
const skinCode = v => { v = String(v == null ? "" : v).trim(); return (!v || v === "0" || v === "-" || v.toLowerCase() === "null") ? "" : v; };
function parsePetSkinCsv(text){
  const rows = [], labels = ["기본스킨","스킨1","스킨2","스킨3","스킨4"];
  String(text || "").replace(/^﻿/, "").split(/\r?\n/).forEach(line => {
    line = line.trim(); if(!line) return;
    const cols = parseCsvLine(line), petCode = skinCode(cols[0]);
    if(!petCode || petCode.toUpperCase() === "PETCODE") return;
    for(let k = 0; k < 5; k++){
      const imageCode = skinCode(cols[1+k]); if(!imageCode) continue;
      rows.push({ petCode, imageCode, skinName:labels[k], ride:String(cols[6+k] || "0").trim() === "1" ? "탑승 가능" : "탑승 불가", sort:k });
    }
  });
  return rows;
}
async function loadSkinData(){

    if(!res.ok) throw new Error("404");

}

/* ===== 필터와 정렬 ===== */
function matches(r){
  if(S.q){
    const q = S.q, exp = JM.expandClusters(q);
    if(!(r._name.includes(q) || r._cho.includes(exp) || String(r.how || "").includes(q))) return false;
  }
  if(S.attr !== "all" && !(num(r[S.attr]) > 0)) return false;
  const c = S.cat;
  if(c === "돈펫"){ if(!isMoneyPet(r)) return false; }
  else if(c === "구펫"){ if(!isOldPet(r)) return false; }
  else if(c === "신펫"){ if(isOldPet(r)) return false; }
  else if(c === "탑승가능"){ if(!mountOk(r.mount)) return false; }
  else if(c === "즐겨찾기"){ if(!FAV.has(r.id)) return false; }
  else if(c !== "ALL" && howType(r.how) !== c) return false;
  for(const k of ATTR_KEYS){
    const v = S.attrVal[k]; if(!v) continue;
    const x = attrPoint(r[k]);
    if(S.atLeast ? x < v : x !== v) return false;
  }
  return true;
}
function sorted(arr){
  const s = S.sort;
  if(s === "default") return arr;
  const a = [...arr];
  if(s === "name") return a.sort((x, y) => x._name.localeCompare(y._name, "ko"));
  if(s === "total") return a.sort((x, y) => statsOf(y).totalGrowth - statsOf(x).totalGrowth);
  const key = s === "atk" ? "a" : s === "def" ? "d" : s === "dex" ? "s" : "h";
  return a.sort((x, y) => statsOf(y).growth[key] - statsOf(x).growth[key]);
}

/* ===== 속성값 슬라이더 (최대 2속성, 합계 10 자동조정) ===== */
function sliderUI(){
  const active = ATTR_KEYS.filter(a => S.attrVal[a] > 0);
  ATTR_KEYS.forEach(k => {
    const v = S.attrVal[k];
    $("asl-v-" + k).textContent = v;
    $("asl-v-" + k).classList.toggle("on", v > 0);
    $("asl-f-" + k).style.width = (v*10) + "%";
    $("asl-i-" + k).classList.toggle("off", active.length >= 2 && !active.includes(k));
  });
  $("asl-total").textContent = ATTR_KEYS.reduce((s, a) => s + S.attrVal[a], 0);
}
function setAttrVal(k, nv){
  nv = Math.max(0, Math.min(10, Math.round(nv)));
  const active = ATTR_KEYS.filter(a => S.attrVal[a] > 0);
  if(S.attrVal[k] === 0 && nv > 0 && active.length >= 2) return;
  const others = ATTR_KEYS.filter(a => a !== k);
  let over = nv + others.reduce((s, a) => s + S.attrVal[a], 0) - 10;
  for(let i = others.length - 1; i >= 0 && over > 0; i--){
    const a = others[i], cut = Math.min(S.attrVal[a], over);
    S.attrVal[a] -= cut; over -= cut;
  }
  if(S.attrVal[k] === nv){ sliderUI(); return; }
  S.attrVal[k] = nv; sliderUI();
  resetShown();
}
function buildSliders(){
  $("attrSliders").innerHTML = ATTRS.map(([k, l, c]) => `
    <div class="asl-item" id="asl-i-${k}"><div class="asl-h"><span style="color:${c}">${l}속성</span><b id="asl-v-${k}">0</b></div>
    <div class="asl-track" id="asl-t-${k}"><div class="asl-fill" id="asl-f-${k}" style="width:0;background:${c}"></div>${Array(9).fill(0).map((_, i) => `<div class="asl-div" style="left:${(i+1)*10}%"></div>`).join("")}</div></div>`).join("")
    + `<div class="asl-foot"><span>합계 <b id="asl-total">0</b> / 10</span><button type="button" id="aslReset">필터 초기화</button></div>`;
  ATTR_KEYS.forEach(k => {
    const t = $("asl-t-" + k);
    const val = e => { const r = t.getBoundingClientRect(); return (e.clientX - r.left) / r.width * 10; };
    let drag = false;
    t.addEventListener("pointerdown", e => { drag = true; try{ t.setPointerCapture(e.pointerId); }catch(_e){} setAttrVal(k, val(e)); });
    t.addEventListener("pointermove", e => { if(drag) setAttrVal(k, val(e)); });
    t.addEventListener("pointerup", () => { drag = false; });
    t.addEventListener("pointercancel", () => { drag = false; });
  });
  $("aslReset").addEventListener("click", () => { ATTR_KEYS.forEach(k => { S.attrVal[k] = 0; }); sliderUI(); resetShown(); });
}

}
function toggleFav(id){
  const on = FAV.toggle(id);
  if(S.cat === "즐겨찾기") render();
  else document.querySelectorAll(`.heart[data-fav="${CSS.escape(String(id))}"]`).forEach(h => { h.classList.toggle("on", on); h.textContent = on ? "♥" : "♡"; h.setAttribute("aria-pressed", String(on)); });
}

/* ===== 연결 ===== */
function buildControls(){
  $("attrSeg").innerHTML = [["all", "전체"], ...ATTRS.map(a => [a[0], a[1]])].map(([v, l]) => `<button type="button" data-v="${v}" class="${v === "all" ? "on" : ""}">${l}</button>`).join("");
  $("attrSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    S.attr = b.dataset.v;
    $("attrSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    resetShown();
  });
  $("viewSeg").innerHTML = '<button type="button" data-v="card" class="on">카드형</button><button type="button" data-v="text">표로 보기</button>';
  $("viewSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    S.view = b.dataset.v;
    $("viewSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  $("catChips").innerHTML = CATS.map(([v, l]) => `<button type="button" class="chip${v === "ALL" ? " on" : ""}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  $("catChips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    S.cat = b.dataset.v;
    $("catChips").querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    resetShown();
  });
  let qt = null;
  $("search").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); resetShown(); }, 150); });
  $("sortSel").addEventListener("change", e => { S.sort = e.target.value; resetShown(); });
  $("attrMode").addEventListener("change", e => { S.atLeast = e.target.checked; resetShown(); });
  $("transBtn").addEventListener("click", e => {
    S.trans = !S.trans;
    e.currentTarget.classList.toggle("on", S.trans);
    e.currentTarget.textContent = S.trans ? "♻️ 1환생 수치로 보는 중 (끄기)" : "♻️ 1환생 수치로 보기";
    render();
  });
  $("loadmore").addEventListener("click", () => { S.shown += PAGE; render(); });
  $("filterToggle").addEventListener("click", () => {
    const open = $("filters").classList.toggle("open");
    $("filterToggle").textContent = open ? "검색·필터 닫기" : "검색·필터 열기";
    $("filterToggle").setAttribute("aria-expanded", String(open));
  });
  $("grid").addEventListener("click", e => {
    const h = e.target.closest(".heart");
    if(h){ e.stopPropagation(); toggleFav(h.dataset.fav); return; }
    const c = e.target.closest("[data-id]"); if(c) openModal(c.dataset.id);
  });
  $("grid").addEventListener("keydown", e => {
    if((e.key === "Enter" || e.key === " ") && e.target.classList.contains("pcard")){ e.preventDefault(); openModal(e.target.dataset.id); }
  });
  $("mClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
  buildSliders();
}

/* ===== 데이터 로딩 ===== */
function setStatus(msg){ const el = $("loadStatusSb"); if(el) el.textContent = msg; }
async function fetchJson(url){
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + "ts=" + Date.now(), { cache:"no-store" });
  if(!res.ok) throw new Error("http " + res.status);
  const data = await res.json();
  const rows = data.rows || data;
  if(!Array.isArray(rows) || !rows.length) throw new Error("empty rows");
  return rows;
}
function applyRows(rows){ PETS = rows.filter(r => !notReleased(r)); indexPets(); render(); }
function openFromHash(){ const h = decodeURIComponent((location.hash || "").slice(1)); if(h && byId.has(h)) openModal(h, true); }
(async function init(){
  buildControls();
  indexPets(); render();
  setStatus("데이터 불러오는 중...");
  let ok = false;
  try{ applyRows(await fetchJson("./pet_data.json")); setStatus(`${PETS.length}종 · 레포 동기화본`); ok = true; }catch(e){}
  if(!ok){ try{ applyRows(await fetchJson(API_URL)); setStatus(`${PETS.length}종 · 실시간 직접연동`); ok = true; }catch(e){} }
  if(!ok) setStatus(`${PETS.length}종 · 내장 샘플`);
  await loadSkinData();
  openFromHash();
  loadTrans();
})();
})();
</script>
