name: Update Pet Ranking

on:
  schedule:
    - cron: '30 */6 * * *'   # 6시간마다 (pet_data 갱신 30분 뒤) 자동 실행
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

# 동시에 여러 개 돌면 push 경쟁 발생 → 대기열에 넣어 순서대로 실행
concurrency:
  group: update-pet-rank
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch pet ranking data from sa000001.com
        run: |
          python pet_rank_api.py
          echo "펫 랭킹 데이터 크기:"
          wc -c pet_ranking_data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pet_ranking_data.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 스킵"
            exit 0
          fi
          git commit -m "펫 랭킹 자동 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패 (시도 $i/5) - 최신 내역 받아서 재시도합니다"
            git fetch origin main
            git rebase origin/main || { echo "rebase 충돌 - 수동 확인 필요"; exit 1; }
            sleep $((i * 3))
          done
          echo "5번 재시도했지만 push 실패"
          exit 1
