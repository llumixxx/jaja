<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쟈쟈서버 아이템 도감</title>
<meta name="description" content="쟈쟈서버 무기 · 방어구 · 장신구 옵션과 획득 경로를 한눈에 보는 도감">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jaja-mate.css">
<style>
/* 아이템 카드 */
.icard .pc-img{height:96px}
.icard .pc-img img{width:auto;height:auto;max-width:72px;max-height:72px;transform:scale(1.25)}
.ic-stats{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 2px;min-height:26px}
.ist{font-size:12px;font-weight:800;border-radius:9px;padding:2px 8px;background:var(--tint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ist i{font-style:normal;margin-right:4px;font-weight:700;color:var(--ink2)}
.ist.atk i{color:var(--atk)} .ist.def i{color:var(--def)} .ist.agi i{color:var(--spd)} .ist.hp i{color:var(--hp)}
.ist.none{background:var(--seg);color:var(--ink3);font-weight:700}
.ist .neg,.it-neg{color:var(--dn)}
.ic-desc{font-size:12px;color:var(--ink3);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.ic-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ic-meta span{font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--seg);color:var(--ink2)}
.ic-meta .set{background:var(--warn-bg);color:var(--warn)}
.ic-meta .magic{background:var(--up-bg);color:var(--up)}
.icard .pc-foot{padding-top:10px}
.cbadge{font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 9px;color:#fff;white-space:nowrap}
.ic-total{display:inline-flex;align-items:baseline;gap:5px}
.ic-total i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink3)}
.ic-total b{font-size:17px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tpos{color:var(--ok)} .tneg{color:var(--dn)} .tzero{color:var(--ink3)}
.subchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding:10px;border-radius:14px;background:var(--seg)}
.subchips .chip{padding:5px 11px;font-size:12.5px;background:var(--soft-w)}
.subchips .chip.on{background:var(--cc,var(--acc-strong));color:#fff;box-shadow:none}
/* 상세 */
.m-grid.five{grid-template-columns:repeat(4,1fr)}
.m-box .pos{color:var(--ink)} .m-box .neg{color:var(--dn)}
.m-desc{font-size:14px;color:var(--ink2);line-height:1.7;background:var(--tint);border-radius:14px;padding:12px 14px}
.m-total .tv{font-weight:900;font-size:19px;font-variant-numeric:tabular-nums}
.m-img.item img{width:auto;height:auto;max-width:80px;max-height:80px;transform:scale(1.3)}
/* 표 */
.dex-table td.r,.dex-table th.r{text-align:right}
.dex-table .sp{background:rgba(155,111,214,.06)}
/* 3D 덱 */
.deck{position:relative;height:620px;perspective:1900px;display:flex}
.deck-stage{position:relative;width:100%;height:100%;transform-style:preserve-3d;touch-action:pan-y}
.deck-card{position:absolute;left:50%;top:50%;width:380px;height:560px;margin-left:-190px;margin-top:-280px;transition:transform .45s var(--ease),opacity .45s}
.dcard{width:100%;height:100%;background:var(--solid);border:1px solid var(--line2);border-radius:26px;box-shadow:var(--shadow-c);padding:22px 20px;overflow-y:auto;-webkit-user-select:none;user-select:none}
.deck-card.is-center .dcard{box-shadow:var(--shadow-h)}
.deck-card:not(.is-center){cursor:pointer}
.deck-card:not(.is-center) .dcard{filter:saturate(.9)}
.dcard .m-name{font-size:21px}
.dcard .m-img{width:96px;height:96px}
.dcard .m-top{padding-right:0}
.deck-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:200;width:46px;height:46px;border-radius:50%;border:0;background:var(--solid);color:var(--acc-strong);font-size:26px;line-height:1;box-shadow:var(--shadow-c);transition:transform .2s var(--ease)}
.deck-nav:hover{transform:translateY(-50%) scale(1.1)}
.deck-nav.prev{left:8px} .deck-nav.next{right:8px}
.deck-count{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;font-size:13px;color:var(--ink2);background:var(--soft-w);border-radius:999px;padding:4px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.deck-count b{color:var(--hot)}
.deck-hint{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);z-index:200;font-size:11.5px;color:var(--ink3);white-space:nowrap}
@media (max-width:640px){
  .deck{height:580px;perspective:1300px}
  .deck-card{width:300px;height:520px;margin-left:-150px;margin-top:-260px}
  .deck-hint{display:none}
}
</style>
<script src="jaja-mate.js"></script>
</head>
<body>

<header class="top"><div class="top-in">
  <button class="toggle-btn" id="toggleBtn" type="button" aria-label="메뉴 열기">☰</button>
  <a class="brand" href="index.html">SA 쟈쟈<small>JAJA SERVER TOOLS</small></a>
  <span class="top-page">🗡️ 아이템 도감</span>
  <button class="top-dark" id="darkBtn" type="button" aria-label="다크모드"><span class="moon">🌙</span><span class="sun">☀️</span></button>
</div></header>

<div class="sb-backdrop" id="sbBackdrop"></div>
<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo"><span class="sb-logo-dot"></span>SA 쟈쟈</div>
    <div class="sb-sub">JAJA SERVER TOOLS</div>
  </div>
  <div class="sb-nav" id="sbNav" data-expanded="true"></div>
  <div class="sb-filler">
    <div class="sb-mascot">🗡️</div>
    <div class="sb-filler-title">카드를 누르면<br>상세 옵션이 나와요</div>
    <div class="sb-filler-sub">덱 보기로 넘겨보는 것도 돼요</div>
  </div>
  <div class="sb-footer"><span class="sb-footer-txt" id="loadStatus">로딩중...</span></div>
</div>

<main class="shell">
  <div class="page-head">
    <h1 class="page-title">아이템 도감</h1>
    <p class="page-sub">무기 · 방어구 · 장신구 옵션과 획득 경로를 한눈에 보여줘요</p>
  </div>
  <button class="btn ghost filter-toggle" id="filterToggle" type="button" aria-expanded="false">검색·필터 열기</button>
  <div class="dex-layout">
    <aside class="filters box" id="filters">
      <div class="f-title">검색</div>
      <input id="search" class="f-input" type="search" placeholder="이름 / 획득처 / 설명 (초성 가능)" autocomplete="off" aria-label="아이템 검색">
      <div class="f-title">분류</div>
      <div class="chips" id="catFilter"></div>
      <div class="subchips" id="subFilter" hidden></div>
      <div class="f-title">정렬 <small>수치가 큰 순서</small></div>
      <select id="sortSel" class="f-input" aria-label="정렬">
        <option value="default">기본정렬</option>
        <option value="total">합계 높은순 (공+방+순+내÷3)</option>
        <option value="atk">공격 높은순</option>
        <option value="def">방어 높은순</option>
        <option value="dex">순발 높은순</option>
        <option value="hp">내구 높은순</option>
        <option value="crit">크리 높은순</option>
        <option value="eva">회피 높은순</option>
        <option value="hit">명중 높은순</option>
        <option value="name">이름순</option>
      </select>
      <div class="f-title">주술</div>
      <select id="magicSel" class="f-input" aria-label="주술"></select>
      <div class="f-title">보기 방식</div>
      <div class="f-seg" id="viewSeg">
        <button type="button" data-v="card" class="on">카드형</button>
        <button type="button" data-v="text">표로 보기</button>
        <button type="button" data-v="deck">덱</button>
      </div>
    </aside>

    <section class="dex-main">
      <div class="stats-row">
        <span class="pill"><b id="statTotal">-</b>전체 아이템</span>
        <span class="pill"><b id="statShown">-</b>표시중</span>
        <span class="pill"><b id="statCat">전체</b>분류</span>
      </div>
      <div id="grid"></div>
      <div id="deck" class="deck" hidden>
        <button class="deck-nav prev" id="deckPrev" type="button" aria-label="이전">‹</button>
        <div class="deck-stage" id="deckStage"></div>
        <button class="deck-nav next" id="deckNext" type="button" aria-label="다음">›</button>
        <div class="deck-count" id="deckCount"></div>
        <div class="deck-hint">드래그 · 화살표 · 좌우 카드 클릭으로 넘기기</div>
      </div>
      <div class="empty" id="empty" hidden>검색 결과가 없어요.</div>
      <button class="btn ghost" id="loadmore" type="button" hidden>더 보기</button>
    </section>
  </div>
</main>
<p class="foot">쟈쟈서버 편의기능 made by 야채부락리 애호박</p>

<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="mclose" id="mClose" type="button" aria-label="닫기">✕</button>
    <div id="mBody"></div>
  </div>
</div>

function itemSubtype(it){
  var p=it.part, n=it.name;
  if(it.cat==='무기'){
    if(p===0) return '손톱'; if(p===1) return '도끼'; if(p===2) return '곤봉';
    if(p===3) return '창'; if(p===4) return '활'; if(p===17) return '부메랑';
    return '기타무기';
  }
  if(it.cat==='방어구'){ if(p===6) return '투구'; if(p===7) return '갑옷'; return '기타방어구'; }
  if(it.cat==='장신구'){
    if(n.indexOf('목걸이')>=0||n.indexOf('팬던트')>=0||n.indexOf('펜던트')>=0) return '목걸이';
    if(n.indexOf('반지')>=0) return '반지';
    if(n.indexOf('귀걸이')>=0) return '귀걸이';
    if(n.indexOf('팔찌')>=0) return '팔찌';
    if(n.indexOf('거울')>=0) return '거울';
    return '기타장신구';
  }
  return '';
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trim(s){ return String(s==null?'':s).replace(/^\s+|\s+$/g,''); }
function norm(s){ s=String(s==null?'':s).toLowerCase(); s=s.replace(/\s+/g,''); s=s.replace(/[^\w가-힣]/g,''); return s; }
function isEmptyVal(v){ v=trim(v); return v===''||v==='-'||v==='0'||v==='+0'||v==='-0'; }

function statRange(min,max){
  var a=trim(min), b=trim(max);
  var am=a.match(/-?\d+/), bm=b.match(/-?\d+/);
  a = am?am[0]:'-'; b = bm?bm[0]:'-';
  var ae=isEmptyVal(a), be=isEmptyVal(b);
  if(ae&&be) return '-';
  if(ae&&!be) return b.replace(/^\+/,'');
  if(be&&!ae) return a.replace(/^\+/,'');
  a=a.replace(/^\+/,''); b=b.replace(/^\+/,'');
  if(a===b) return a;
  return a+'~'+b;
}
function statNum(v){ var m=String(v).match(/-?\d+/); return m?parseInt(m[0],10):0; }
function rangeNum(min,max){ if(!isEmptyVal(max)) return statNum(max); return statNum(min); }
function valClass(txt){ if(txt==='-') return 'zero'; return String(txt).charAt(0)==='-'?'neg':'pos'; }

/* 아이템의 표시 가능한 스탯 목록 [label, rangeText] (값 있는 것만) */
var STAT_DEFS = [
  ['공','minAtk','maxAtk'],['방','minDef','maxDef'],['순','minDex','maxDex'],['내','minHP','maxHP'],
  ['크리','minCrit','maxCrit'],['회피','minEva','maxEva'],['명중','hit','hit'],['매력','minCharm','maxCharm']
];
function itemStats(it){
  var out=[];
  for(var i=0;i<STAT_DEFS.length;i++){
    var d=STAT_DEFS[i];
    var r=statRange(it[d[1]], it[d[2]]);
    if(r!=='-') out.push([d[0], r]);
  }
  return out;
}
function sortValue(it,key){
  if(key==='total') return itemTotal(it);
  var m={atk:['minAtk','maxAtk'],def:['minDef','maxDef'],dex:['minDex','maxDex'],hp:['minHP','maxHP'],
    crit:['minCrit','maxCrit'],eva:['minEva','maxEva'],hit:['hit','hit'],charm:['minCharm','maxCharm']};
  var d=m[key]; if(!d) return 0; return rangeNum(it[d[0]], it[d[1]]);
}

/* 합계 스탯: +는 최고치, -는 최소페널티(둘 다 max값) · 내구력은 3당 1로 환산(÷3) */
function itemTotal(it){
  return rangeNum(it.minAtk,it.maxAtk)+rangeNum(it.minDef,it.maxDef)+rangeNum(it.minDex,it.maxDex)+rangeNum(it.minHP,it.maxHP)/3;
}
function hasBaseStat(it){
  return statRange(it.minAtk,it.maxAtk)!=='-'||statRange(it.minDef,it.maxDef)!=='-'||
         statRange(it.minDex,it.maxDex)!=='-'||statRange(it.minHP,it.maxHP)!=='-';
}
function fmtTotal(v){
  var r=Math.round(v*100)/100;
  var s=String(r);
  return (r>0?'+':'')+s;
}
function totalClass(v){ return v>0?'pos':(v<0?'neg':'zero'); }

function iconUrl(it){
  var key=trim(it.gfx); if(key===''||key==='0') key=trim(it.id); if(key==='') return ICON_DEFAULT;
  return ICON_BASE+key+'.png';
}
function imgTag(it){
  return '<img src="'+esc(iconUrl(it))+'" loading="lazy" alt="" onerror="this.onerror=null;this.src=\''+ICON_DEFAULT+'\'">';
}

function hasMagic(it){ return it.magicName && it.magicName!=='주술없음' && !isEmptyVal(it.stamina); }


/* ===== 쟈쟈 메이트 디자인 화면 ===== */
var FAVI = JM.favStore("jaja-item-favs");
var STAT_CLS = { '공':'atk', '방':'def', '순':'agi', '내':'hp' };
function catColor(c){ return CAT_COLOR[c] || CAT_COLOR['기타']; }
function itemSearchMatch(it, q){
  if(!q) return true;
  return JM.textMatch(it.name, q) || norm(it.route).indexOf(norm(q)) >= 0 || norm(it.desc).indexOf(norm(q)) >= 0;
}

/* ===== 카드 ===== */
function cardHTML(it, idx){
  var stats = itemStats(it), sub = itemSubtype(it), fav = FAVI.has(it.id);
  var statHtml = stats.length
    ? stats.map(function(s){ return '<span class="ist ' + (STAT_CLS[s[0]] || '') + '"><i>' + esc(s[0]) + '</i><span class="' + valClass(s[1]) + '">' + esc(s[1]) + '</span></span>'; }).join('')
    : '<span class="ist none">능력치 없음</span>';
  var meta = [];

  if(it.setEff) meta.push('<span class="set">✦ ' + esc(it.setEff) + '</span>');
  if(hasMagic(it)) meta.push('<span class="magic">🔮 ' + esc(it.magicName) + '</span>');
  var d = trim(it.desc);
  var desc = (d && d !== '미확인') ? '<div class="ic-desc">' + esc(d) + '</div>' : '';
  var total = '';
  if(hasBaseStat(it)){ var tv = itemTotal(it); total = '<span class="ic-total"><i>합계</i><b class="t' + totalClass(tv) + '">' + esc(fmtTotal(tv)) + '</b></span>'; }
  return '<div class="pcard icard" data-idx="' + idx + '" tabindex="0" role="button" aria-label="' + esc(it.name) + ' 자세히 보기">' +
    '<button type="button" class="heart' + (fav ? ' on' : '') + '" data-fav="' + esc(it.id) + '" aria-pressed="' + fav + '" aria-label="즐겨찾기">' + (fav ? '♥' : '♡') + '</button>' +
    '<div class="pc-img">' + imgTag(it) + '</div>' +
    '<div class="pc-name" title="' + esc(it.name) + '">' + esc(it.name) + '</div>' +
    '<div class="pc-how" title="' + esc(it.route || '미등록') + '">' + esc(it.route || '미등록') + '</div>' +
    '<div class="ic-stats">' + statHtml + '</div>' +
    (meta.length ? '<div class="ic-meta">' + meta.join('') + '</div>' : '') +
    desc +
    '<div class="pc-foot"><span class="cbadge" style="background:' + catColor(it.cat) + '">' + esc(it.cat + (sub ? ' · ' + sub : '')) + '</span>' + total + '</div>' +
  '</div>';
}

/* ===== 표 ===== */
function tableHTML(list){
  function cell(min, max, extra){ var r = statRange(min, max); return '<td class="r' + (extra || '') + '"><span class="' + (valClass(r) === 'neg' ? 'it-neg' : '') + '">' + esc(r) + '</span></td>'; }
  return '<div class="dex-wrap"><table class="dex-table"><thead><tr><th>아이템</th><th>분류</th><th class="r">공</th><th class="r">방</th><th class="r">순</th><th class="r">내</th><th class="r">합계</th><th class="r sp">크리</th><th class="r sp">명중</th><th class="r sp">회피</th><th>주술</th></tr></thead><tbody>' +

/* ===== 필터/정렬 ===== */
function applyFilter(){
  var arr = ITEMS.slice();
  if(CAT === '♥'){ arr = arr.filter(function(i){ return FAVI.has(i.id); }); }
  else if(CAT !== '전체') arr = arr.filter(function(i){ return i.cat === CAT; });
  if(SUBCATS[CAT] && SUBCAT !== '전체') arr = arr.filter(function(i){ return itemSubtype(i) === SUBCAT; });
  if(MAGIC !== '전체'){
    if(MAGIC === '__has__') arr = arr.filter(function(i){ return hasMagic(i); });
    else arr = arr.filter(function(i){ return i.magicName === MAGIC; });
  }
  var q = trim(QUERY);
  if(q) arr = arr.filter(function(i){ return itemSearchMatch(i, q); });
  if(SORT === 'name') arr.sort(function(a, b){ return a.name.localeCompare(b.name, 'ko'); });
  else if(SORT !== 'default') arr.sort(function(a, b){ var av = sortValue(a, SORT), bv = sortValue(b, SORT); if(bv !== av) return bv - av; return (a.o || 0) - (b.o || 0); });
  else arr.sort(function(a, b){ return (a.o || 0) - (b.o || 0); });
  return arr;
}
function buildCatChips(){
  var counts = { '전체':ITEMS.length };
  ITEMS.forEach(function(i){ counts[i.cat] = (counts[i.cat] || 0) + 1; });
  var html = CAT_ORDER.filter(function(k){ return k === '전체' || counts[k]; }).map(function(k){
    return '<button type="button" class="chip' + (CAT === k ? ' on' : '') + '" data-v="' + esc(k) + '">' + esc(k) + '<span class="cnt">' + (counts[k] || 0) + '</span></button>';
  }).join('');
  html += '<button type="button" class="chip' + (CAT === '♥' ? ' on' : '') + '" data-v="♥">♥ 즐겨찾기</button>';
  byId('catFilter').innerHTML = html;
}
function buildSubChips(){
  var box = byId('subFilter'), subs = SUBCATS[CAT];
  if(!subs){ box.innerHTML = ''; box.hidden = true; return; }
  var counts = {}, total = 0;
  ITEMS.forEach(function(i){ if(i.cat === CAT){ var s = itemSubtype(i); counts[s] = (counts[s] || 0) + 1; total++; } });
  box.style.setProperty('--cc', catColor(CAT));
  box.innerHTML = '<button type="button" class="chip' + (SUBCAT === '전체' ? ' on' : '') + '" data-v="전체">전체<span class="cnt">' + total + '</span></button>' +
    subs.filter(function(k){ return counts[k]; }).map(function(k){
      return '<button type="button" class="chip' + (SUBCAT === k ? ' on' : '') + '" data-v="' + esc(k) + '">' + (SUBICON[k] || '') + ' ' + esc(k) + '<span class="cnt">' + counts[k] + '</span></button>';
    }).join('');
  box.hidden = false;
}
function buildMagicOptions(){
  var counts = {}, hasCount = 0;
  ITEMS.forEach(function(i){ if(hasMagic(i)){ counts[i.magicName] = (counts[i.magicName] || 0) + 1; hasCount++; } });
  function base(s){ return s.replace(/\s*Lv\d+\s*$/, ''); }
  function lv(s){ var m = s.match(/Lv(\d+)/); return m ? parseInt(m[1], 10) : 0; }
  var names = Object.keys(counts).sort(function(a, b){ var ba = base(a), bb = base(b); return ba !== bb ? ba.localeCompare(bb, 'ko') : lv(a) - lv(b); });
  var html = '<option value="전체">전체 아이템</option><option value="__has__">주술 있는 것만 (' + hasCount + ')</option>' +
    names.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + ' (' + counts[n] + ')</option>'; }).join('');
  var sel = byId('magicSel'); sel.innerHTML = html; sel.value = MAGIC;
  if(sel.value !== MAGIC){ MAGIC = '전체'; sel.value = '전체'; }
}

function render(){
  var arr = applyFilter();
  byId('statTotal').textContent = ITEMS.length;
  byId('statShown').textContent = arr.length;
  byId('statCat').textContent = CAT === '♥' ? '즐겨찾기' : (SUBCATS[CAT] && SUBCAT !== '전체' ? SUBCAT : CAT);
  var grid = byId('grid'), empty = byId('empty'), more = byId('loadmore'), deck = byId('deck');
  empty.hidden = arr.length > 0;
  if(!arr.length){ grid.innerHTML = ''; grid.hidden = true; deck.hidden = true; more.hidden = true; return; }
  if(VIEW === 'deck'){
    grid.hidden = true; more.hidden = true; deck.hidden = false;
    renderDeck(arr); return;
  }
  deck.hidden = true; grid.hidden = false;
  grid.classList.toggle('text-view', VIEW === 'text');
  if(VIEW === 'text'){ grid.innerHTML = tableHTML(arr); more.hidden = true; }
  else {
    grid.innerHTML = arr.slice(0, SHOWN).map(function(it){ return cardHTML(it, ITEMS.indexOf(it)); }).join('');
    more.hidden = arr.length <= SHOWN;
    more.textContent = '더 보기 (' + Math.min(PAGE_STEP, arr.length - SHOWN) + '개)';
  }
}

/* ===== 3D 덱 ===== */
var DECK_I = 0, deckList = [], deckMoved = false, deckSig = '';
function renderDeck(list){
  var sig = list.length + '|' + (list.length ? list[0].id : '') + '|' + (list.length ? list[list.length - 1].id : '');
  if(sig !== deckSig){ DECK_I = 0; deckSig = sig; }
  deckList = list;
  if(DECK_I >= list.length || DECK_I < 0) DECK_I = 0;
  byId('deckStage').innerHTML = list.map(function(it, i){ return '<div class="deck-card" data-i="' + i + '"><div class="dcard">' + detailHTML(it, true) + '</div></div>'; }).join('');
  layoutDeck();
}
function layoutDeck(){
  var stage = byId('deckStage'); if(!stage) return;
  var cards = stage.children, W = stage.clientWidth || 900;
  var spread = Math.min(220, Math.max(120, W*0.23));
  for(var i = 0; i < cards.length; i++){
    var el = cards[i], d = i - DECK_I, ad = Math.abs(d);
    if(ad > 4){ el.style.display = 'none'; continue; }
    el.style.display = '';
    var tx = d*spread, ry = Math.max(-44, Math.min(44, -d*20)), tz = -ad*170, sc = Math.max(0.66, 1 - ad*0.11), op = ad >= 4 ? 0 : (1 - ad*0.24);
    el.style.transform = 'translateX(' + tx + 'px) translateZ(' + tz + 'px) rotateY(' + ry + 'deg) scale(' + sc + ')';
    el.style.opacity = op; el.style.zIndex = String(100 - ad);
    el.classList.toggle('is-center', d === 0);
  }
  byId('deckCount').innerHTML = deckList.length ? ('<b>' + (DECK_I + 1) + '</b> / ' + deckList.length) : '';
}
function deckGo(n){ if(!deckList.length) return; DECK_I = Math.max(0, Math.min(deckList.length - 1, n)); layoutDeck(); }

/* ===== 상세 (팝업 · 덱 공용) ===== */
function detailHTML(it, inDeck){
  var color = catColor(it.cat), sub = itemSubtype(it), fav = FAVI.has(it.id);
  var tags = '<span class="cbadge" style="background:' + color + '">' + esc(it.cat) + '</span>';
  if(sub) tags += '<span class="tag blue">' + (SUBICON[sub] || '') + ' ' + esc(sub) + '</span>';
  if(it.cat === '무기'){ var h = statRange(it.minHit, it.maxHit); if(h !== '-') tags += '<span class="tag off">공격횟수 ' + esc(h) + '타</span>'; }
  if(it.setEff) tags += '<span class="tag">' + esc(it.setEff) + '</span>';
  var body = '';
  var stats = itemStats(it);
  if(stats.length){
    body += '<div class="m-sec"><h3>상세 옵션</h3><div class="m-grid five">' + stats.map(function(s){
      var cls = { '공':'a', '방':'d', '순':'s', '내':'h' }[s[0]] || '';
      return '<div class="m-box ' + cls + '"><span>' + esc(s[0]) + '</span><b class="' + valClass(s[1]) + '">' + esc(s[1]) + '</b></div>';
    }).join('') + '</div>';
    if(hasBaseStat(it)){ var tv = itemTotal(it); body += '<div class="m-total"><span>공방순내 합계 (내÷3)</span><span class="tv t' + totalClass(tv) + '">' + esc(fmtTotal(tv)) + '</span></div>'; }
    body += '</div>';
  }
  body += '<div class="m-sec"><h3>획득 경로</h3><div style="font-size:14px;color:var(--ink2)">' + esc(it.route || '미등록') + '</div></div>';
  if(hasMagic(it)) body += '<div class="m-sec"><h3>주술</h3><div class="m-grid" style="grid-template-columns:2fr 1fr"><div class="m-box"><span>주술</span><b style="font-size:16px;color:var(--up)">' + esc(it.magicName) + '</b></div><div class="m-box"><span>기력소모</span><b style="font-size:16px">' + esc(it.stamina) + '</b></div></div></div>';
  var d = trim(it.desc);
  if(d && d !== '미확인') body += '<div class="m-sec"><h3>설명</h3><div class="m-desc">' + esc(d).replace(/\n/g, '<br>') + '</div></div>';
  if(!inDeck) body += '<div class="m-actions"><button type="button" class="btn ghost" id="mFav" aria-pressed="' + fav + '">' + (fav ? '♥ 즐겨찾기 해제' : '♡ 즐겨찾기') + '</button></div>';
  return '<div class="m-top"><div class="m-img item">' + imgTag(it) + '</div><div><div class="m-name"' + (inDeck ? '' : ' id="mName"') + '>' + esc(it.name) + '</div><div class="tags" style="margin-top:8px">' + tags + '</div></div></div>' + body;
}

/* ===== 팝업 ===== */
var lastFocus = null;
function openModal(it){
  lastFocus = document.activeElement;
  byId('mBody').innerHTML = detailHTML(it, false);
  byId('modal').hidden = false;
  byId('modal').querySelector('.mcard').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  byId('mClose').focus();
  byId('mFav').onclick = function(){ toggleFav(it.id); openModal(it); };
}
function closeModal(){
  if(byId('modal').hidden) return;
  byId('modal').hidden = true;
  document.body.style.overflow = '';
  if(lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){}
}
function toggleFav(id){
  var on = FAVI.toggle(id);
  if(CAT === '♥') render();
  else document.querySelectorAll('.heart[data-fav="' + CSS.escape(String(id)) + '"]').forEach(function(h){ h.classList.toggle('on', on); h.textContent = on ? '♥' : '♡'; h.setAttribute('aria-pressed', String(on)); });
}

/* ===== 이벤트 ===== */
function bindEvents(){
  var qt = null;
  byId('search').addEventListener('input', function(){ var v = this.value; clearTimeout(qt); qt = setTimeout(function(){ QUERY = v; SHOWN = PAGE_STEP; render(); }, 150); });
  byId('sortSel').addEventListener('change', function(){ SORT = this.value; SHOWN = PAGE_STEP; render(); });
  byId('magicSel').addEventListener('change', function(){ MAGIC = this.value; SHOWN = PAGE_STEP; render(); });
  byId('catFilter').addEventListener('click', function(e){
    var chip = e.target.closest('.chip'); if(!chip) return;
    CAT = chip.getAttribute('data-v'); SUBCAT = '전체'; SHOWN = PAGE_STEP;
    buildCatChips(); buildSubChips(); render();
  });
  byId('subFilter').addEventListener('click', function(e){
    var chip = e.target.closest('.chip'); if(!chip) return;
    SUBCAT = chip.getAttribute('data-v'); SHOWN = PAGE_STEP;
    buildSubChips(); render();
  });
  byId('viewSeg').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    VIEW = btn.getAttribute('data-v');
    this.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b === btn); });
    render();
  });
  byId('loadmore').addEventListener('click', function(){ SHOWN += PAGE_STEP; render(); });
  byId('filterToggle').addEventListener('click', function(){
    var open = byId('filters').classList.toggle('open');
    this.textContent = open ? '검색·필터 닫기' : '검색·필터 열기';
    this.setAttribute('aria-expanded', String(open));
  });
  byId('grid').addEventListener('click', function(e){
    var h = e.target.closest('.heart');
    if(h){ e.stopPropagation(); toggleFav(h.getAttribute('data-fav')); return; }
    var el = e.target.closest('[data-idx]'); if(!el) return;
    var it = ITEMS[parseInt(el.getAttribute('data-idx'), 10)]; if(it) openModal(it);
  });
  byId('grid').addEventListener('keydown', function(e){
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('pcard')){ e.preventDefault(); var it = ITEMS[parseInt(e.target.getAttribute('data-idx'), 10)]; if(it) openModal(it); }
  });
  byId('deckPrev').addEventListener('click', function(){ deckGo(DECK_I - 1); });
  byId('deckNext').addEventListener('click', function(){ deckGo(DECK_I + 1); });
  byId('deckStage').addEventListener('click', function(e){
    if(deckMoved){ deckMoved = false; return; }
    var card = e.target.closest('.deck-card'); if(!card) return;
    var i = parseInt(card.getAttribute('data-i'), 10);
    if(i !== DECK_I) deckGo(i);
  });
  (function(){
    var stage = byId('deckStage'), active = false, startX = 0, startI = 0;
    stage.addEventListener('pointerdown', function(e){ active = true; startX = e.clientX; startI = DECK_I; deckMoved = false; });
    window.addEventListener('pointermove', function(e){
      if(!active) return;
      var dx = e.clientX - startX;
      if(Math.abs(dx) > 6) deckMoved = true;
      var ni = Math.max(0, Math.min(deckList.length - 1, startI + Math.round(-dx/70)));
      if(ni !== DECK_I){ DECK_I = ni; layoutDeck(); }
    });
    window.addEventListener('pointerup', function(){ active = false; });
    window.addEventListener('pointercancel', function(){ active = false; });
  })();
  window.addEventListener('resize', function(){ if(VIEW === 'deck') layoutDeck(); });
  byId('mClose').addEventListener('click', closeModal);
  byId('modal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeModal(); return; }
    if(VIEW === 'deck' && byId('modal').hidden && !/INPUT|SELECT/.test(document.activeElement.tagName)){
      if(e.key === 'ArrowLeft'){ deckGo(DECK_I - 1); e.preventDefault(); }
      else if(e.key === 'ArrowRight'){ deckGo(DECK_I + 1); e.preventDefault(); }
    }
  });
}

/* ===== 라이브 데이터 로딩(서버 최신 itemset6.txt 파싱) ===== */
var IDX={name:0,sys:1,desc:2,setStat:3,setCmd1:11,setCmd2:12,id:16,gfx:17,type:19,setCode:34,
  minHit:35,maxHit:36,minAtk:37,maxAtk:38,minDef:39,maxDef:40,minDex:41,maxDex:42,minHP:43,maxHP:44,
  minCharm:49,maxCharm:50,minEva:51,maxEva:52,magic:55,stamina:57,hit:61,minCrit:75,maxCrit:76};
function intOnly(x){ var s=trim(x); if(!s) return '-'; var m=s.match(/-?\d+/); return m?m[0]:'-'; }
function numOf(x){ var v=Number(trim(x)); return isFinite(v)?v:0; }
function partToBase(p){ p=parseInt(p,10);
  if([0,1,2,3,4,17,18,19].indexOf(p)>=0) return '무기';
  if([6,7].indexOf(p)>=0) return '방어구';
  if([8,9,10,11,13,14,15].indexOf(p)>=0) return '장신구';
  if([20].indexOf(p)>=0) return '소모';
  if([24,25,26,27].indexOf(p)>=0) return '토템';
  return '기타';
}
function detectCat(name,route,desc,part){
  var all=norm(name+' '+route+' '+desc); var base=partToBase(part);
  if(all.indexOf('초보자')>=0) return '초보자';
  if(all.indexOf('페트병')>=0||all.indexOf('펫병')>=0) return '페트병';
  if(all.indexOf('변신')>=0||all.indexOf('캐릭터')>=0) return '캐릭터';
  if(all.indexOf('요리')>=0||all.indexOf('고기')>=0||all.indexOf('스프')>=0) return '요리';
  if(all.indexOf('이벤트')>=0) return '이벤트';
  if(all.indexOf('보조')>=0) return '보조';
  return base;
}
function parseMagic(text){
  var map={}, lines=String(text||'').split(/\r?\n/);
  for(var i=0;i<lines.length;i++){ var line=trim(lines[i]); if(!line||line.charAt(0)==='#'||line.indexOf('//')===0) continue;
    var a=line.split(','); var nm=trim(a[0]), code=trim(a[4]); if(nm&&code) map[code]=nm; }
  return map;
}
function parseSetEffect(a){
  var c1=trim(a[IDX.setCmd1]), c2=trim(a[IDX.setCmd2]);
  if(c1!=='ITEM_suitEquip'&&c2!=='ITEM_ResuitEquip') return '';
  if(isEmptyVal(intOnly(a[IDX.setCode]))) return '';
  var m=trim(a[IDX.setStat]).match(/^([A-Z_]+)\s*:\s*(-?\d+)/i); if(!m) return '';
  var map={MSTR:'공',MTGH:'방',MDEX:'순',MVITAL:'내'};
  var label=map[(m[1]||'').toUpperCase()]; if(!label) return '';
  var v=Number(m[2]); if(!isFinite(v)||v===0) return '';
  return '세트효과 '+label+(v>0?'+':'')+v;
}
function parseItem(line, magicMap, order){
  var a=String(line||'').split(',');
  var name=trim(a[IDX.name]), id=trim(a[IDX.id]);
  if(!name||!id) return null;
  var route=trim(a[IDX.sys]), desc=trim(a[IDX.desc]), part=numOf(a[IDX.type]);
  var magicCode=intOnly(a[IDX.magic]), stamina=intOnly(a[IDX.stamina]), magicName='주술없음';
  if(magicCode!=='-'&&magicMap[magicCode]) magicName=magicMap[magicCode];
  return {o:order,name:name,id:id,gfx:trim(a[IDX.gfx]),route:route,desc:desc,part:part,
    cat:detectCat(name,route,desc,part),setEff:parseSetEffect(a),
    minHit:intOnly(a[IDX.minHit]),maxHit:intOnly(a[IDX.maxHit]),
    minAtk:intOnly(a[IDX.minAtk]),maxAtk:intOnly(a[IDX.maxAtk]),
    minDef:intOnly(a[IDX.minDef]),maxDef:intOnly(a[IDX.maxDef]),
    minDex:intOnly(a[IDX.minDex]),maxDex:intOnly(a[IDX.maxDex]),
    minHP:intOnly(a[IDX.minHP]),maxHP:intOnly(a[IDX.maxHP]),
    minCrit:intOnly(a[IDX.minCrit]),maxCrit:intOnly(a[IDX.maxCrit]),
    minEva:intOnly(a[IDX.minEva]),maxEva:intOnly(a[IDX.maxEva]),
    hit:intOnly(a[IDX.hit]),minCharm:intOnly(a[IDX.minCharm]),maxCharm:intOnly(a[IDX.maxCharm]),
    magicName:magicName,stamina:stamina};
}
async function fetchTextSmart(url){
  var res=await fetch(url,{cache:'no-store'}); if(!res.ok) return '';
  var buf=await res.arrayBuffer();
  var encs=['utf-8','euc-kr','windows-949']; var best='',bestScore=-1e9;
  for(var i=0;i<encs.length;i++){ try{
    var txt=new TextDecoder(encs[i],{fatal:false}).decode(buf);
    var broken=(txt.match(/\uFFFD/g)||[]).length, kor=(txt.match(/[가-힣]/g)||[]).length;
    var sc=kor*2-broken*80; if(sc>bestScore){ bestScore=sc; best=txt; }
  }catch(e){} }
  return best;
}
async function loadFrom(dataUrl, magicUrl, label){
  try{
    var magicText=await fetchTextSmart(magicUrl);
    var magicMap=parseMagic(magicText);
    var itemText=await fetchTextSmart(dataUrl);
    if(!itemText) throw new Error('no data');
    var lines=itemText.split(/\r?\n/), parsed=[];
    for(var i=0;i<lines.length;i++){ var line=trim(lines[i]); if(!line||line.charAt(0)==='#'||line.indexOf('//')===0) continue;
      var it=parseItem(line, magicMap, parsed.length); if(it) parsed.push(it); }
    if(parsed.length){
      ITEMS=parsed;
      buildCatChips(); buildSubChips(); buildMagicOptions(); render();
      byId('loadStatus').textContent=label+' '+ITEMS.length+'개 ✓';
      return true;
    }
  }catch(e){}
  return false;
}
async function loadLive(){
  var gotLocal = await loadFrom(LOCAL_DATA_FILE, LOCAL_MAGIC_FILE, '아이템');
  if(!gotLocal) byId('loadStatus').textContent='아이템 '+ITEMS.length+'개(구버전)';
  /* sa000001.com이 나중에 CORS를 열어주면 이 시도가 성공해서 자동으로 더 최신 데이터로 덮어씀.
     지금은 대부분 실패하겠지만 실패해도 조용히 무시됨(이미 로컬 데이터가 떠 있음) */
  loadFrom(DATA_FILE, MAGIC_FILE, '서버 최신');
}


/* ===== 시작 ===== */
bindEvents();
buildCatChips();
buildSubChips();
buildMagicOptions();
render();
byId('loadStatus').textContent = '아이템 ' + ITEMS.length + '개';
loadLive();
</script>
