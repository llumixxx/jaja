<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쟈쟈서버 펫 이상형 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2f7fd; --bg2:#e8f2fc; --white:#ffffff;
  --s1:#f0f7fd; --s2:#e3f0fb;
  --border:#dbe9f7; --border2:#bcd8f2;
  --a1:#2f7fd6; --a2:#22b6c9; --a3:#5aa8ea; --a4:#f5a623; --a5:#6fd0a0;
  --t1:#12253f; --t2:#4c6a8c; --t3:#8ea6c2; --t4:#c7dcf0;
  --ok:#3d9e6e; --err:#e05a5a;
  --shadow:0 4px 24px rgba(47,127,214,0.12);
  --shadow2:0 8px 32px rgba(47,127,214,0.18);
}
[data-theme="dark"] {
  --bg:#0a1420; --bg2:#0f1e30; --white:#132335;
  --s1:#16283c; --s2:#1c3149;
  --border:#233c56; --border2:#2c4a68;
  --t1:#e6f0fb; --t2:#a9c2dc; --t3:#7391b0; --t4:#4a637d;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 32px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  background-image:
    radial-gradient(circle 600px at 10% 10%, rgba(47,127,214,0.08) 0%, transparent 100%),
    radial-gradient(circle 700px at 90% 30%, rgba(34,182,201,0.07) 0%, transparent 100%),
    radial-gradient(circle 500px at 50% 90%, rgba(111,208,192,0.08) 0%, transparent 100%);
}

/* ===== 사이드바 (공통 셸, quiz.html/statcalc.html과 동일) ===== */
.sidebar{width:300px;height:100vh;background:var(--white);border-right:1.5px solid var(--border);
  display:flex;flex-direction:column;position:fixed;left:-300px;top:0;z-index:200;
  transition:left .32s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 24px rgba(47,127,214,0.08);}
.sidebar.open{left:0;}
.sb-head{padding:20px 16px 14px;border-bottom:1.5px solid var(--border);}
.sb-logo{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-weight:900;
  font-size:16px;color:var(--a1);margin-bottom:4px;}
.sb-logo-dot{width:8px;height:8px;background:var(--a2);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(2)}}
.sb-sub{font-size:10.5px;color:var(--t3);font-family:'Nunito',sans-serif;font-weight:700;letter-spacing:.5px;}
.sb-nav{padding:10px 16px;border-bottom:1.5px solid var(--border);}
.sb-nav-toggle{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:13px;
  font-size:13px;font-weight:800;color:var(--t2);background:var(--s1);border:1.5px solid var(--border);
  cursor:pointer;font-family:inherit;transition:border-color .15s;}
.sb-nav-toggle:hover{border-color:var(--a1);}
.sb-nav-toggle-label{flex:1;text-align:left;}
.sb-nav-toggle-chevron{color:var(--t3);font-size:11px;transition:transform .25s;}
.sb-nav-toggle.open .sb-nav-toggle-chevron{transform:rotate(180deg);}
.sb-nav-list{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;gap:5px;}
.sb-nav-list.open{max-height:400px;margin-top:6px;}
.sb-nav-list a{display:flex;align-items:center;gap:9px;text-decoration:none;padding:9px 12px;border-radius:12px;
  font-size:12.5px;font-weight:800;color:var(--t2);background:var(--white);border:1.5px solid var(--border);
  transition:border-color .15s,color .15s;}
.sb-nav-list a:hover{border-color:var(--a1);color:var(--a1);}
.sb-nav-list a.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;}
.sb-body{padding:14px 16px 16px;flex:1;overflow-y:auto;min-height:0;font-size:12.5px;color:var(--t2);line-height:1.7;}
.sb-body::-webkit-scrollbar{width:4px;} .sb-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.sb-info-box{background:var(--s1);border:1.5px solid var(--border);border-radius:14px;padding:14px;}
.sb-info-box b{color:var(--t1);}
.sb-footer{padding:12px 16px;border-top:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.sb-footer-txt{font-size:10.5px;color:var(--t3);}
.toggle-btn{position:fixed;top:16px;left:16px;z-index:300;width:42px;height:42px;background:var(--white);
  border:1.5px solid var(--border);border-radius:12px;color:var(--a1);font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .18s;box-shadow:var(--shadow);}
.toggle-btn:hover{border-color:var(--a1);box-shadow:var(--shadow2);transform:scale(1.05);}
.toggle-btn.sb-open{left:314px;}
@media(max-width:820px){ .toggle-btn.sb-open{left:auto;right:16px;} .main.shifted{margin-left:0;} }
.sb-backdrop{position:fixed;inset:0;background:rgba(12,25,42,0.4);backdrop-filter:blur(2px);
  z-index:190;opacity:0;pointer-events:none;transition:opacity .25s ease;display:none;}
.sb-backdrop.open{opacity:1;pointer-events:auto;}
@media(max-width:820px){ .sb-backdrop{display:block;} }
.dark-toggle{width:36px;height:36px;border-radius:50%;border:2px solid var(--border2);background:var(--white);
  cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;transition:all .3s;}
.dark-toggle:hover{transform:scale(1.1) rotate(-8deg);border-color:var(--a1);}
[data-theme="dark"] .toggle-moon{display:inline;} [data-theme="dark"] .toggle-sun{display:none !important;}
[data-theme="light"] .toggle-moon{display:none !important;} [data-theme="light"] .toggle-sun{display:inline;}
.main{flex:1;min-height:100vh;transition:margin-left .32s cubic-bezier(.4,0,.2,1);}
.main.shifted{margin-left:300px;}
.main-inner{max-width:760px;margin:0 auto;padding:70px 20px 80px;}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── header ── */
.page-head { text-align: center; padding: 6px 0 22px; position:relative; }
.wind-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg,var(--s2),#e0f7fa);
  border: 1.5px solid var(--border2);
  border-radius: 20px;
  padding: 6px 14px; font-size: 11px; font-weight: 800;
  font-family: 'Nunito', sans-serif;
  color: var(--t2); letter-spacing: 1px; margin-bottom: 12px;
  box-shadow: 0 4px 12px rgba(47,127,214,.12);
}
.wind-badge-dot { width: 7px; height: 7px; background: var(--a2); border-radius: 50%; animation: pulse 2s infinite; }
.page-title {
  font-family: 'Nunito', sans-serif;
  font-size: 32px; font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--a1) 0%, var(--a2) 60%, var(--a5) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.15; margin-bottom: 6px;
}
.page-sub { font-size: 12px; color: var(--t3); font-family: 'Nunito', sans-serif; font-weight: 700; letter-spacing: 1px; }

/* ── 설정 화면 ── */
.config-box{background:var(--white);border:1.5px solid var(--border);border-radius:22px;padding:1.4rem;
  margin-bottom:1rem;box-shadow:var(--shadow);}
.config-title{font-size:13px;font-weight:800;color:var(--t2);letter-spacing:.5px;margin-bottom:.9rem;}
.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media(max-width:440px){.size-grid{grid-template-columns:repeat(3,1fr);}}
.size-btn{padding:12px 4px;border-radius:14px;border:1.5px solid var(--border);background:var(--s1);
  cursor:pointer;text-align:center;transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.size-btn:hover{border-color:var(--a1);background:var(--s2);}
.size-btn.active{border:2px solid var(--a1);background:var(--s2);}
.size-num{font-size:18px;font-weight:800;color:var(--t1);display:block;margin-bottom:1px;}
.size-label{font-size:10px;color:var(--t3);display:block;}
.start-btn{width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));
  color:#fff;border:none;font-size:15px;font-weight:800;font-family:'Noto Sans KR',sans-serif;cursor:pointer;
  transition:opacity .15s;box-shadow:var(--shadow);}
.start-btn:hover{opacity:.88;}

/* ── 진행 배지 / 프로그레스 ── */
.badges{display:flex;gap:7px;justify-content:center;margin-bottom:.9rem;flex-wrap:wrap;}
.badge{font-size:12px;padding:3px 11px;border-radius:8px;background:var(--s1);color:var(--t3);border:.5px solid var(--border);}
.badge.round{background:var(--s2);color:var(--a1);font-weight:800;border-color:var(--border2);}
.progress-wrap{height:6px;background:var(--s2);border-radius:3px;margin-bottom:1.2rem;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:3px;transition:width .4s;}

/* ── VS 아레나 ── */
.home-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:1.5px solid var(--border2);
  border-radius:10px;padding:6px 12px;font-size:12px;font-weight:800;color:var(--a1);cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;}
.home-btn:hover{background:var(--s1);}
.arena{display:flex;align-items:stretch;gap:12px;margin-bottom:1.2rem;}
.card{flex:1;background:var(--white);border:1.5px solid var(--border);border-radius:18px;
  padding:1rem .9rem .9rem;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:var(--shadow);}
.card:hover{border-color:var(--a1);transform:translateY(-3px);box-shadow:var(--shadow2);}
.card:active{transform:scale(.97);}
.pet-img-wrap{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:var(--s1);
  border-radius:12px;overflow:hidden;flex-shrink:0;}
.pet-img-wrap img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated;}
.pet-name{font-size:16px;font-weight:800;color:var(--t1);text-align:center;line-height:1.2;}
.pet-grade{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;}
.grade-일반{background:var(--s1);color:var(--t3);}
.grade-1등급{background:#fff8e1;color:#c9820f;}
.grade-2등급{background:#fce7f3;color:#c23f83;}
[data-theme="dark"] .grade-1등급{background:#3a2f10;color:#f5c451;}
[data-theme="dark"] .grade-2등급{background:#3a1a2a;color:#f087c0;}
.attrs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.attr-badge{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;}
.attr-지{background:#e8f5e9;color:#2e7d32;}
.attr-수{background:#e3f2fd;color:#1565c0;}
.attr-화{background:#fce4ec;color:#c62828;}
.attr-풍{background:#e8eaf6;color:#283593;}
[data-theme="dark"] .attr-지{background:#183c1e;color:#7fd68d;}
[data-theme="dark"] .attr-수{background:#122c46;color:#7cb8f0;}
[data-theme="dark"] .attr-화{background:#3a1620;color:#f08a94;}
[data-theme="dark"] .attr-풍{background:#1c2050;color:#9aa4f2;}
.mount-badge{font-size:11px;padding:2px 9px;border-radius:6px;font-weight:700;}
.mount-yes{background:#e8f5e9;color:#2e7d32;}
.mount-no{background:var(--s1);color:var(--t4);border:.5px solid var(--border);}
[data-theme="dark"] .mount-yes{background:#183c1e;color:#7fd68d;}
.obtain-row{width:100%;font-size:10.5px;color:var(--t3);text-align:center;line-height:1.4;background:var(--s1);
  border-radius:8px;padding:4px 7px;}
.stats-section{width:100%;font-size:11px;}
.stats-title{color:var(--t4);font-size:10px;letter-spacing:.5px;margin-bottom:4px;text-align:center;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:.5px solid var(--s1);}
.stat-label{color:var(--t3);font-size:10px;}
.stat-val{color:var(--a1);font-weight:800;font-size:11px;}
.pick-btn{display:block;width:100%;margin-top:auto;padding:9px;border-radius:12px;font-size:13px;font-weight:800;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:var(--s1);border:1.5px solid var(--border2);
  color:var(--a1);transition:all .15s;}
.pick-btn:hover{background:var(--a1);color:#fff;border-color:var(--a1);}
.vs-sep{display:flex;align-items:center;justify-content:center;width:34px;flex-shrink:0;}
.vs-text{font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;color:var(--border2);}

/* ── 결과 화면 ── */
.result-wrap{text-align:center;padding:.5rem;}
.trophy{font-size:50px;display:block;margin-bottom:.4rem;}
.champ-img-wrap{width:120px;height:120px;display:flex;align-items:center;justify-content:center;background:var(--s1);
  border-radius:20px;margin:0 auto .6rem;overflow:hidden;}
.champ-img-wrap img{width:110px;height:110px;object-fit:contain;image-rendering:pixelated;}
.champ-name{font-size:26px;font-weight:800;color:var(--t1);margin-bottom:3px;}
.champ-sub{font-size:12px;color:var(--a1);font-weight:700;margin-bottom:1.2rem;}
.result-list{background:var(--white);border:1.5px solid var(--border);border-radius:18px;padding:.4rem .9rem;
  margin-bottom:1.4rem;box-shadow:var(--shadow);}
.result-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--s1);font-size:13px;}
.result-item:last-child{border-bottom:none;}
.result-rank{font-weight:800;width:26px;font-size:17px;}
.result-img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;background:var(--s1);border-radius:8px;padding:2px;}
.result-name{color:var(--t1);font-weight:600;flex:1;text-align:left;}
.result-grade{font-size:10px;color:var(--t3);}
.restart-btn{padding:10px 28px;border-radius:12px;background:var(--s1);border:1.5px solid var(--border2);
  font-size:13px;font-weight:800;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:var(--a1);transition:all .15s;}
.restart-btn:hover{background:var(--a1);color:#fff;border-color:var(--a1);}

/* ── 라운드 시작 배너 ── */
@keyframes toastIn { 0%{opacity:0;transform:translateY(-20px) scale(.95);} 100%{opacity:1;transform:translateY(0) scale(1);} }
@keyframes toastOut { 0%{opacity:1;transform:translateY(0) scale(1);} 100%{opacity:0;transform:translateY(-16px) scale(.95);} }
.round-overlay{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;}
.round-banner{background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:40px;padding:10px 28px;
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(47,127,214,.4);
  animation:toastIn .28s cubic-bezier(.34,1.56,.64,1) forwards;white-space:nowrap;}
.round-banner.out{animation:toastOut .22s ease-in forwards;}
.round-banner-main{font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;color:#fff;}
.round-banner-sub{font-size:11px;color:rgba(255,255,255,.8);}

@media(max-width:520px){ .page-title{font-size:26px;} .main-inner{padding:16px 14px 60px;} }
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<button class="toggle-btn" id="toggleBtn">☰</button>
<div class="sb-backdrop" id="sbBackdrop"></div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo"><span class="sb-logo-dot"></span>SA 쟈쟈</div>
    <div class="sb-sub">JAJA SERVER TOOLS</div>
  </div>
  <div class="sb-nav" id="sbNav"></div>
  <div class="sb-body">
    <div class="sb-info-box">
      🐾 <b>펫 이상형 월드컵</b><br><br>
      쟈쟈서버 펫들로 나만의 최애를 뽑아보세요.<br><br>
      참가 규모를 고르고 한 마리씩 골라나가면 우승 펫이 정해져요. 다른 사람들이 뭘 골랐는지 통계도 볼 수 있어요.
    </div>
  </div>
  <div class="sb-footer">
    <span class="sb-footer-txt" id="sbFooterCount">로딩 중...</span>
    <button class="dark-toggle" onclick="toggleDark()"><span class="toggle-moon">🌙</span><span class="toggle-sun">☀️</span></button>
  </div>
</div>

<div class="main" id="main">
<div class="main-inner">

  <div class="page-head">
    <div class="wind-badge"><span class="wind-badge-dot"></span><span>SA JAJA · PET WORLDCUP</span></div>
    <h1 class="page-title">🐾 펫 이상형 월드컵</h1>
    <div class="page-sub">쟈쟈서버 펫 중 나만의 최애를 뽑아보세요</div>
  </div>

  <div id="app"></div>

</div>
</div>

<script src="nav.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   사이드바 (push 방식) / 다크모드 — 쟈쟈 공통 셸
   ═══════════════════════════════════════════════════════════ */
const sidebar = document.getElementById("sidebar");
const toggleBtn = document.getElementById("toggleBtn");
const mainEl = document.getElementById("main");
const sbBackdrop = document.getElementById("sbBackdrop");
function setSidebar(open){
  sidebar.classList.toggle("open", open);
  toggleBtn.classList.toggle("sb-open", open);
  mainEl.classList.toggle("shifted", open);
  sbBackdrop.classList.toggle("open", open);
  toggleBtn.textContent = open ? "✕" : "☰";
  try{ localStorage.setItem('sa2-sb', open ? '1' : '0'); }catch(e){}
}
toggleBtn.addEventListener("click", ()=> setSidebar(!sidebar.classList.contains("open")));
sbBackdrop.addEventListener("click", ()=> setSidebar(false));
try{
  const sbSaved = localStorage.getItem('sa2-sb');
  setSidebar(sbSaved === null ? window.innerWidth > 820 : sbSaved === '1');
}catch(e){ setSidebar(window.innerWidth > 820); }
function toggleDark(){
  const h=document.documentElement;
  const n=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme', n);
  try{ localStorage.setItem('sa2-theme', n); }catch(e){}
}
try{ const saved=localStorage.getItem('sa2-theme'); if(saved) document.documentElement.setAttribute('data-theme', saved); }catch(e){}

/* ═══════════════════════════════════════════════════════════
   쟈쟈 능력치 공식 (statcalc.html / simulator.html과 동일)
   ═══════════════════════════════════════════════════════════ */
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function rankInfoB(sum){ if(sum>=100)return 475; if(sum>=95)return 495; if(sum>=90)return 515; if(sum>=85)return 535; if(sum>=80)return 555; return 575; }
function disp(h,a,d,s){ return { h:h*4+a+d+s, a:h*0.1+a+d*0.1+s*0.05, d:h*0.1+a*0.1+d+s*0.05, s:s }; }
function calcStats(r){
  const baseSum = num(r.h0)+num(r.a0)+num(r.d0)+num(r.s0);
  const B = rankInfoB(baseSum);
  const ph=num(r.h0)+num(r.lvup), pa=num(r.a0)+num(r.lvup), pd=num(r.d0)+num(r.lvup), ps=num(r.s0)+num(r.lvup);
  const init = disp(num(r.initPct)*ph/100, num(r.initPct)*pa/100, num(r.initPct)*pd/100, num(r.initPct)*ps/100);
  const growth = disp(ph*B/10000, pa*B/10000, pd*B/10000, ps*B/10000);
  return { init, growth };
}
function cut2(n){ n=Number(n); if(!isFinite(n)) return "-"; return (Math.floor(n*100)/100).toFixed(2).replace(/\.?0+$/, ""); }
function normalizedName(p){ return String(p.name||"").replace(/^\uFEFF/, ""); }
function rarityKey(v){ v=String(v||"").trim(); if(v==="1")return "2등급"; if(v==="2")return "1등급"; return "일반"; }

let ALL_PETS = [];

function buildPets(rows){
  const list = rows
    .filter(p => !String(p.how||"").replace(/\s+/g,"").includes("미출시"))
    .map(p => {
      const st = calcStats(p);
      return {
        n: normalizedName(p),
        i: p.imageCode,
        g: rarityKey(p.rarity),
        a: { 지:num(p.earth), 수:num(p.water), 화:num(p.fire), 풍:num(p.wind) },
        ic: { hp:cut2(st.init.h), atk:cut2(st.init.a), def:cut2(st.init.d), agi:cut2(st.init.s) },
        sg: { hp:cut2(st.growth.h), atk:cut2(st.growth.a), def:cut2(st.growth.d), agi:cut2(st.growth.s) },
        m: String(p.mount||"").trim() === "가능",
        o: p.how || "",
      };
    });
  /* 이름 중복 방지 (환생/이벤트로 이름이 같은 항목이 드물게 있음) — 먼저 나온 것만 유지 */
  const seen = {};
  return list.filter(p => { if (seen[p.n]) return false; seen[p.n] = true; return true; });
}
async function fetchJson(url){
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + "ts=" + Date.now(), {cache:"no-store"});
  if(!res.ok) throw new Error("http " + res.status);
  const data = await res.json();
  const rows = data.rows || data;
  if(!Array.isArray(rows) || rows.length === 0) throw new Error("empty rows");
  return rows;
}

let state = {screen:'config', size:16, round:[], pair:0, winners:[], results:[], done:0, roundNum:1, totalRounds:0, originalCount:0};
let history = [];

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function startGame(size){
  const petCount = size === 0 ? ALL_PETS.length : size * 2;
  const picked = shuffle(ALL_PETS).slice(0, petCount);
  const total = picked.length;
  const preWinners = [];
  if (total % 2 === 1) preWinners.push(picked.pop());
  state.size = total; state.round = picked; state.pair = 0;
  state.winners = preWinners; state.results = []; state.done = preWinners.length;
  state.roundNum = 1; state.screen = 'game'; state.originalCount = total;
  state.totalRounds = Math.ceil(Math.log2(total));
  showRoundBanner(state.roundNum, function(){ render(); });
}
function roundName(count){
  const matches = Math.floor(count/2);
  if (matches <= 1) return '🏆 결승';
  if (matches <= 2) return '준결승';
  if (matches <= 4) return '4강';
  if (matches <= 8) return '8강';
  if (matches <= 16) return '16강';
  if (matches <= 32) return '32강';
  if (matches <= 64) return '64강';
  return matches + '강';
}
function showRoundBanner(roundNum, cb){
  const petCount = Math.ceil(state.originalCount / Math.pow(2, roundNum-1));
  const name = roundName(petCount);
  const overlay = document.createElement('div');
  overlay.className = 'round-overlay';
  overlay.innerHTML = '<div class="round-banner" id="rb"><div class="round-banner-main">'+name+'</div>'+
    '<div class="round-banner-sub">'+petCount+'마리 참가</div></div>';
  document.body.appendChild(overlay);
  if (cb) cb();
  setTimeout(function(){
    const rb = document.getElementById('rb'); if (rb) rb.classList.add('out');
    setTimeout(function(){ if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 240);
  }, 900);
}
function choose(idx){
  history.push(JSON.parse(JSON.stringify(state)));
  const a = state.round[state.pair*2], b = state.round[state.pair*2+1];
  const win = idx===0 ? a : b;

  /* 통계 기록은 어디까지나 부가 기능 — 여기서 오류가 나도 게임 진행은 절대 막지 않음 */
  try{
    const now = new Date();
    const yr = now.getFullYear(), mo = String(now.getMonth()+1).padStart(2,'0');
    const d = new Date(Date.UTC(yr, now.getMonth(), now.getDate()));
    const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
    const wk = String(Math.ceil(((d - new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000+1)/7)).padStart(2,'0');
    const weekKey = yr+'-W'+wk, monthKey = yr+'-'+mo, petName = win.n;
    const bump = c => (c||0)+1;
    db.ref(STATS_ROOT+'/week/'+weekKey+'/'+petName).transaction(bump).catch(()=>{});
    db.ref(STATS_ROOT+'/month/'+monthKey+'/'+petName).transaction(bump).catch(()=>{});
    db.ref(STATS_ROOT+'/total/'+petName).transaction(bump).catch(()=>{});
  } catch(e){ /* 통계 실패는 조용히 무시 */ }

  state.winners.push(win);
  state.results.push({win, lose: idx===0?b:a});
  state.done++; state.pair++;
  if (state.pair*2 >= state.round.length){
    if (state.winners.length === 1){ state.screen = 'result'; render(); return; }
    const nextPets = shuffle(state.winners);
    const preW = [];
    if (nextPets.length % 2 === 1) preW.push(nextPets.pop());
    state.roundNum++; state.round = nextPets; state.pair = 0;
    state.winners = preW; state.done += preW.length;
    showRoundBanner(state.roundNum, function(){ render(); });
    return;
  }
  render();
}
function pct(){ const total = state.originalCount - 1; return total > 0 ? Math.round(state.done/total*100) : 0; }
function attrBadges(a){
  return Object.entries(a).filter(kv => kv[1] > 0)
    .map(kv => '<span class="attr-badge attr-'+kv[0]+'">'+kv[0]+' '+kv[1]+'</span>').join('');
}
function petImgTag(pet, cls, size){
  return '<img class="'+cls+'" src="'+IMG_BASE+pet.i+'.gif" alt="'+pet.n+'" '+
    'onerror="this.onerror=function(){this.onerror=null;this.style.opacity=\'0.3\';};this.src=\''+SAWORLD_IMG_BASE+pet.i+'.gif\';">';
}
function statsHtml(pet){
  const ic = pet.ic, sg = pet.sg;
  return '<div class="stats-section"><div class="stats-title">초기치 / 레벨당 성장</div><div class="stats-grid">'+
    '<div class="stat-row"><span class="stat-label">내구력</span><span class="stat-val">'+ic.hp+' / <span style="color:var(--a2)">'+sg.hp+'</span></span></div>'+
    '<div class="stat-row"><span class="stat-label">공격력</span><span class="stat-val">'+ic.atk+' / <span style="color:var(--a2)">'+sg.atk+'</span></span></div>'+
    '<div class="stat-row"><span class="stat-label">방어력</span><span class="stat-val">'+ic.def+' / <span style="color:var(--a2)">'+sg.def+'</span></span></div>'+
    '<div class="stat-row"><span class="stat-label">순발력</span><span class="stat-val">'+ic.agi+' / <span style="color:var(--a2)">'+sg.agi+'</span></span></div>'+
    '</div></div>';
}
function cardHtml(pet, idx){
  const mountBadge = pet.m ? '<span class="mount-badge mount-yes">🐴 탑승 가능</span>' : '<span class="mount-badge mount-no">탑승 불가</span>';
  const img = '<div class="pet-img-wrap">'+petImgTag(pet,'','')+'</div>';
  return '<div class="card" onclick="choose('+idx+')">'+img+
    '<div class="pet-name">'+pet.n+'</div>'+
    '<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center">'+
    '<span class="pet-grade grade-'+pet.g+'">'+pet.g+'</span>'+mountBadge+'</div>'+
    '<div class="attrs">'+attrBadges(pet.a)+'</div>'+statsHtml(pet)+
    '<div class="obtain-row">📍 '+pet.o+'</div>'+
    '<button class="pick-btn" onclick="event.stopPropagation();choose('+idx+')">선택 ✓</button></div>';
}

const app = document.getElementById('app');

function renderConfig(){
  const sizes = [8,16,32,64,0];
  const sizeBtns = sizes.map(n => {
    const label = n === 0 ? '전체' : n + '강';
    const sub = n === 0 ? ALL_PETS.length + '마리' : (n*2) + '마리';
    return '<button class="size-btn'+(state.size===n?' active':'')+'" onclick="selectSize('+n+')">'+
      '<span class="size-num">'+label+'</span><span class="size-label">'+sub+'</span></button>';
  }).join('');
  app.innerHTML =
    '<div class="config-box"><div class="config-title">참가 규모 선택</div>'+
    '<div class="size-grid">'+sizeBtns+'</div></div>'+
    '<button class="start-btn" onclick="startGame(state.size)">월드컵 시작! 🚀</button>';
}
function selectSize(n){ state.size = n; renderConfig(); }
function renderGame(){
  const a = state.round[state.pair*2], b = state.round[state.pair*2+1];
  const rn = roundName(Math.ceil(state.originalCount / Math.pow(2, state.roundNum-1)));
  const p = pct();
  app.innerHTML =
    '<div style="position:relative;text-align:center;margin-bottom:.8rem">'+
    '<button class="home-btn" onclick="restart()" title="처음부터 다시하기">🏠 처음으로</button></div>'+
    '<div class="badges"><span class="badge round">'+rn+'</span>'+
    '<span class="badge">'+(state.pair+1)+' / '+(state.round.length/2)+' 경기</span>'+
    '<span class="badge">진행 '+p+'%</span></div>'+
    '<div class="progress-wrap"><div class="progress-bar" style="width:'+p+'%"></div></div>'+
    '<div class="arena">'+cardHtml(a,0)+'<div class="vs-sep"><span class="vs-text">VS</span></div>'+cardHtml(b,1)+'</div>';
}
function renderResult(){
  const champ = state.results[state.results.length-1].win;
  const top4 = []; const seen = {};
  for (let i=state.results.length-1; i>=0 && top4.length<4; i--){
    const r = state.results[i];
    if (!seen[r.win.n]){ seen[r.win.n]=1; top4.push(r.win); }
    if (top4.length<4 && !seen[r.lose.n]){ seen[r.lose.n]=1; top4.push(r.lose); }
  }
  const medals = ['🥇','🥈','🥉','4위'];
  const list = top4.map((p,i) =>
    '<div class="result-item"><span class="result-rank">'+medals[i]+'</span>'+
    petImgTag(p,'result-img','')+
    '<span class="result-name">'+p.n+'</span><span class="result-grade">'+p.g+'</span></div>').join('');
  app.innerHTML =
    '<div class="result-wrap"><span class="trophy">🏆</span>'+
    '<div class="champ-img-wrap">'+petImgTag(champ,'','')+'</div>'+
    '<div class="champ-name">'+champ.n+'</div>'+
    '<div class="champ-sub">'+champ.g+' · '+(champ.m?'🐴 탑승 가능':'탑승 불가')+'</div>'+
    '<div class="result-list">'+list+'</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
    '<button class="restart-btn" onclick="restart()">🔄 다시 하기</button>'+
    '<button class="restart-btn" onclick="showStats()">📊 통계 보기</button></div></div>';
}
function restart(){
  history = [];
  state = {screen:'config', size:state.size, round:[], pair:0, winners:[], results:[], done:0, roundNum:1, totalRounds:0, originalCount:0};
  render();
}
function render(){
  if (state.screen === 'config') renderConfig();
  else if (state.screen === 'game') renderGame();
  else renderResult();
}
function showStats(){
  app.innerHTML = '<div class="config-box" style="text-align:center;color:var(--t3);font-size:13px">데이터 불러오는 중...</div>';
  const now = new Date();
  const yr = now.getFullYear(), mo = String(now.getMonth()+1).padStart(2,'0');
  const d = new Date(Date.UTC(yr, now.getMonth(), now.getDate()));
  const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const wk = String(Math.ceil(((d - new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000+1)/7)).padStart(2,'0');
  const weekKey = yr+'-W'+wk, monthKey = yr+'-'+mo;
  let loaded = 0;
  function tryRender(){ loaded++; if (loaded===3) renderStats('week'); }
  db.ref(STATS_ROOT+'/week/'+weekKey).once('value').then(s => { statsData.week = s.val()||{}; tryRender(); }).catch(()=>{ statsData.week={}; tryRender(); });
  db.ref(STATS_ROOT+'/month/'+monthKey).once('value').then(s => { statsData.month = s.val()||{}; tryRender(); }).catch(()=>{ statsData.month={}; tryRender(); });
  db.ref(STATS_ROOT+'/total').once('value').then(s => { statsData.total = s.val()||{}; tryRender(); }).catch(()=>{ statsData.total={}; tryRender(); });
}
function renderStats(tab){
  tab = tab || 'week';
  const tabLabels = { week:'이번 주', month:'이번 달', total:'전체' };
  const data = statsData[tab] || {};
  const entries = Object.entries(data);
  const petMap = {}; ALL_PETS.forEach(p => petMap[p.n] = p);
  const tabs = ['week','month','total'].map(t => {
    const isActive = t === tab;
    const style = (isActive
      ? 'background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent'
      : 'background:var(--s1);color:var(--a1);border-color:var(--border2)') +
      ';border:1.5px solid;border-radius:20px;padding:6px 16px;font-size:12px;font-weight:800;cursor:pointer';
    return '<button style="'+style+'" onclick="renderStats(\''+t+'\')">'+tabLabels[t]+'</button>';
  }).join('');
  let content;
  if (entries.length === 0){
    content = '<div style="text-align:center;padding:2rem;color:var(--t3);font-size:14px">아직 기록이 없어요 🐾</div>';
  } else {
    entries.sort((a,b) => b[1]-a[1]);
    const top = entries.slice(0,20);
    const maxVal = top[0][1];
    const total = entries.reduce((s,e) => s+e[1], 0);
    content = '<div style="font-size:11px;color:var(--t3);margin-bottom:8px">총 '+total+'번 선택됨</div>';
    content += top.map((e,i) => {
      const p = petMap[e[0]];
      const img = p ? '<img src="'+IMG_BASE+p.i+'.gif" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated;background:var(--s1);border-radius:6px;padding:2px;flex-shrink:0" onerror="this.src=\''+SAWORLD_IMG_BASE+p.i+'.gif\';this.onerror=function(){this.style.opacity=0.3}">' : '';
      const barW = Math.round(e[1]/maxVal*100);
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid var(--s1)">'+
        '<span style="font-size:13px;font-weight:800;width:20px;color:var(--a1)">'+(i+1)+'</span>'+img+
        '<span style="flex:1;font-size:13px;font-weight:600;color:var(--t1)">'+e[0]+'</span>'+
        '<div style="width:80px;height:6px;background:var(--s1);border-radius:3px;overflow:hidden">'+
        '<div style="width:'+barW+'%;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:3px"></div></div>'+
        '<span style="font-size:12px;font-weight:800;color:var(--a1);width:28px;text-align:right">'+e[1]+'</span></div>';
    }).join('');
  }
  app.innerHTML =
    '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:1rem">'+tabs+'</div>'+
    '<div class="config-box"><div class="config-title">'+tabLabels[tab]+' 많이 선택된 펫 TOP 20</div>'+content+'</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:1rem">'+
    '<button class="restart-btn" onclick="restart()">🔄 다시 하기</button></div>';
}

window.choose = choose;
window.selectSize = selectSize;
window.startGame = startGame;
window.restart = restart;
window.showStats = showStats;
window.renderStats = renderStats;

(async () => {
  await loadPets();
  render();
})();
</script>
</body>
</html>
