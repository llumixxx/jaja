<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쟈쟈서버 능력치 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2f7fd; --bg2:#e8f2fc; --white:#ffffff;
  --s1:#f0f7fd; --s2:#e3f0fb;
  --border:#dbe9f7; --border2:#bcd8f2;
  --a1:#2f7fd6; --a2:#22b6c9; --a3:#5aa8ea; --a4:#f5a623; --a5:#6fd0a0;
  --t1:#12253f; --t2:#4c6a8c; --t3:#8ea6c2; --t4:#c7dcf0;
  --ok:#3d9e6e; --err:#e05a5a; --pos:#2f7fd6; --neg:#e05a5a;
  --atk:#e0684a; --def:#2f7fd6; --dur:#3aab7d; --dex:#9b6fd6;
  --shadow:0 4px 24px rgba(47,127,214,0.12);
  --shadow2:0 8px 32px rgba(47,127,214,0.18);
}
[data-theme="dark"] {
  --bg:#0a1420; --bg2:#0f1e30; --white:#132335;
  --s1:#16283c; --s2:#1c3149;
  --border:#233c56; --border2:#2c4a68;
  --t1:#e6f0fb; --t2:#a9c2dc; --t3:#7391b0; --t4:#4a637d;
  --pos:#5aa8ea; --neg:#f08a8a;
  --atk:#f08a6e; --def:#5aa8ea; --dur:#7fdcb4; --dex:#b78fe8;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 32px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%, rgba(47,127,214,0.08) 0%, transparent 50%),
    radial-gradient(circle at 88% 90%, rgba(34,182,201,0.07) 0%, transparent 50%);}

/* ===== 사이드바 ===== */
.sidebar{width:300px;height:100vh;background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;left:-300px;top:0;z-index:200;
  transition:left .32s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 24px rgba(47,127,214,0.08);}
.sidebar.open{left:0;}
.sb-head{padding:20px 16px 15px;border-bottom:1px solid var(--border);}
.sb-logo{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-weight:900;
  font-size:16px;color:var(--a1);margin-bottom:4px;}
.sb-logo-dot{width:8px;height:8px;background:var(--a2);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(2)}}
.sb-sub{font-size:10.5px;color:var(--t3);font-family:'Nunito',sans-serif;font-weight:700;letter-spacing:.5px;}
.sb-nav{padding:11px 14px;border-bottom:1px solid var(--border);}
.sb-nav-toggle{width:100%;display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
  font-size:13px;font-weight:800;color:var(--t1);background:var(--s1);border:none;
  cursor:pointer;font-family:inherit;transition:background .18s;}
.sb-nav-toggle:hover{background:var(--s2);}
.sb-nav-toggle-label{flex:1;text-align:left;}
.sb-nav-toggle-chevron{color:var(--t3);font-size:11px;transition:transform .3s cubic-bezier(.4,0,.2,1);}
.sb-nav-toggle.open .sb-nav-toggle-chevron{transform:rotate(180deg);}
.sb-nav-list{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.33,1,.68,1);
  display:flex;flex-direction:column;gap:2px;perspective:700px;}
.sb-nav-list.open{max-height:600px;margin-top:5px;padding-top:2px;}
.sb-nav-list a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px 13px;border-radius:10px;
  font-size:12.5px;font-weight:700;color:var(--t2);background:transparent;border:none;
  opacity:0;transform:rotateX(-82deg);transform-origin:center top;
  transition:opacity .26s ease,transform .5s cubic-bezier(.34,1.32,.5,1),background .16s ease,color .16s ease;}
.sb-nav-list.open a{opacity:1;transform:rotateX(0);}
.sb-nav-list.open a:nth-child(1){transition-delay:.02s;}
.sb-nav-list.open a:nth-child(2){transition-delay:.07s;}
.sb-nav-list.open a:nth-child(3){transition-delay:.12s;}
.sb-nav-list.open a:nth-child(4){transition-delay:.17s;}
.sb-nav-list.open a:nth-child(5){transition-delay:.22s;}
.sb-nav-list.open a:nth-child(6){transition-delay:.27s;}
.sb-nav-list.open a:nth-child(7){transition-delay:.32s;}
.sb-nav-list.open a:nth-child(8){transition-delay:.37s;}
.sb-nav-list.open a:nth-child(9){transition-delay:.42s;}
.sb-nav-list.open a:nth-child(10){transition-delay:.47s;}
.sb-nav-list a:hover{background:var(--s1);color:var(--a1);}
.sb-nav-list a.on{background:rgba(47,127,214,.12);color:var(--a1);font-weight:800;}
[data-theme="dark"] .sb-nav-list a.on{background:rgba(90,168,234,.16);}
@media(prefers-reduced-motion:reduce){
  .sb-nav-list a{transition:background .16s ease,color .16s ease;transform:none;opacity:1;}
  .sb-nav-list.open a{transition-delay:0s;}
}
.sb-body{padding:16px;flex:1;overflow-y:auto;min-height:0;}
.sb-body::-webkit-scrollbar{width:4px;} .sb-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.f-group{margin-bottom:18px;}
.f-group:last-child{margin-bottom:0;}
.f-section{font-size:10px;letter-spacing:1.2px;color:var(--t3);text-transform:uppercase;margin:0 0 8px 2px;
  font-family:'Nunito',sans-serif;font-weight:800;}
.f-input,.f-select{width:100%;padding:10px 13px;background:var(--s1);border:1px solid var(--border);
  border-radius:11px;font-family:inherit;font-size:15px;color:var(--t1);outline:none;transition:border-color .15s,background .15s;}
.f-input::placeholder{color:var(--t3);}
.f-input:focus,.f-select:focus{border-color:var(--a1);background:var(--white);}
.f-chip-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.f-chip{background:var(--white);border:1px solid var(--border);color:var(--t2);padding:6px 11px;
  border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
.f-chip:hover{border-color:var(--a3);color:var(--a1);}
.f-chip.is-on{background:var(--a1);border-color:var(--a1);color:#fff;}
.f-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.f-seg3{grid-template-columns:1fr 1fr 1fr;}
.f-seg button{background:var(--white);border:1px solid var(--border);color:var(--t2);padding:9px 4px;
  border-radius:11px;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;transition:.15s;}
.f-seg button:hover{border-color:var(--a3);color:var(--a1);}
.f-seg button.active{background:var(--a1);color:#fff;border-color:var(--a1);}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.sb-footer-txt{font-size:10.5px;color:var(--t3);}
.dark-toggle{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--s1);
  cursor:pointer;font-size:14px;transition:.15s;}
.dark-toggle:hover{border-color:var(--a3);background:var(--white);}
[data-theme="dark"] .toggle-moon{display:inline;} [data-theme="dark"] .toggle-sun{display:none !important;}
[data-theme="light"] .toggle-moon{display:none !important;} [data-theme="light"] .toggle-sun{display:inline;}
.toggle-btn{position:fixed;top:16px;left:16px;z-index:300;width:42px;height:42px;background:var(--white);
  border:1.5px solid var(--border);border-radius:13px;cursor:pointer;font-size:17px;color:var(--t2);
  box-shadow:var(--shadow);transition:left .32s cubic-bezier(.4,0,.2,1),border-color .15s,transform .15s;}
.toggle-btn:hover{border-color:var(--a1);box-shadow:var(--shadow2);transform:scale(1.05);}
.toggle-btn.sb-open{left:314px;}
@media(max-width:820px){ .toggle-btn.sb-open{left:auto;right:16px;} .main.shifted{margin-left:0;} }
.sb-backdrop{position:fixed;inset:0;background:rgba(18,37,63,.35);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s;}
.sb-backdrop.show{opacity:1;pointer-events:auto;}

/* ===== 메인 ===== */
.main{flex:1;min-height:100vh;transition:margin-left .32s cubic-bezier(.4,0,.2,1);}
.main.shifted{margin-left:300px;}
.main-inner{max-width:1240px;margin:0 auto;padding:74px 26px 90px;}
.page-head{text-align:center;padding:8px 0 26px;}
.wind-badge{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--border2);
  border-radius:20px;padding:6px 15px;font-size:10.5px;font-weight:800;color:var(--a1);
  font-family:'Nunito',sans-serif;letter-spacing:.6px;margin-bottom:15px;box-shadow:0 2px 12px rgba(47,127,214,.08);}
.wind-badge-dot{width:6px;height:6px;background:var(--a2);border-radius:50%;animation:pulse 2s infinite;}
.page-title{font-size:40px;font-weight:900;letter-spacing:-1.4px;line-height:1.05;color:var(--a1);
  background:linear-gradient(115deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.page-sub{font-size:13px;color:var(--t3);margin-top:9px;font-weight:600;}
.stats-row{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;}
.stat-chip{display:inline-flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--t3);
  font-family:'Nunito',sans-serif;font-weight:700;background:var(--white);border:1px solid var(--border);
  padding:7px 14px;border-radius:12px;box-shadow:0 1px 4px rgba(47,127,214,.05);}
.stat-chip b{color:var(--a1);font-size:15px;font-weight:900;}
.stat-chip b.warn{color:var(--err);}

.panel{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:18px 19px;
  box-shadow:0 1px 3px rgba(47,127,214,.05);}
.panel + .panel{margin-top:16px;}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.p-title{font-size:14.5px;font-weight:900;color:var(--t1);letter-spacing:-.3px;}
.p-note{font-size:11px;color:var(--t3);font-weight:700;}
.mini-btn{background:var(--s1);border:1px solid var(--border);color:var(--t2);padding:6px 11px;border-radius:9px;
  font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
.mini-btn:hover{border-color:var(--a3);color:var(--a1);background:var(--white);}
.mini-btn.pri{background:var(--a1);border-color:var(--a1);color:#fff;}
.mini-btn.pri:hover{filter:brightness(1.07);color:#fff;}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
@media(max-width:940px){.calc-grid{grid-template-columns:1fr;}}

/* ===== 포인트 게이지 ===== */
.pool{margin-bottom:16px;}
.pool-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--s2);box-shadow:inset 0 1px 3px rgba(18,37,63,.1);}
.pool-bar i{display:block;height:100%;transition:width .2s cubic-bezier(.22,1,.36,1);}
.pool-legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;font-size:10.5px;font-weight:800;
  color:var(--t3);font-family:'Nunito',sans-serif;}
.pool-legend em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;}

.stat-row{padding:12px 0 14px;border-top:1px dashed var(--border);}
.stat-row:first-child{border-top:none;}
.sr-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.sr-name{font-size:14.5px;font-weight:900;min-width:52px;letter-spacing:-.3px;}
.sr-num{width:70px;text-align:right;padding:6px 9px;border-radius:10px;border:1px solid var(--border);
  background:var(--s1);color:var(--t1);font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;}
.sr-num:focus{outline:none;border-color:var(--a1);background:var(--white);}
.sr-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--white);
  color:var(--t2);font-weight:900;font-size:11px;cursor:pointer;font-family:'Nunito',sans-serif;transition:.15s;}
.sr-btn:hover{border-color:var(--a1);color:var(--a1);}
.sr-btn.max{width:auto;padding:0 9px;}
.gauge{position:relative;height:26px;border-radius:13px;background:var(--s2);cursor:pointer;
  overflow:hidden;touch-action:none;box-shadow:inset 0 2px 5px rgba(18,37,63,.09);}
.g-avail{position:absolute;left:0;top:0;bottom:0;background:var(--gc);opacity:.16;transition:width .2s;}
.g-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gc);transition:width .18s cubic-bezier(.22,1,.36,1);
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 9px,rgba(255,255,255,0) 9px 20px);
  background-size:200% 100%;animation:flow 1.6s linear infinite;box-shadow:0 0 12px var(--gc);}
@keyframes flow{from{background-position:0 0}to{background-position:-40px 0}}
@media(prefers-reduced-motion:reduce){.g-fill{animation:none;}}
.g-cap{position:absolute;top:0;bottom:0;width:2px;background:var(--gc);opacity:.55;}
.g-val{position:absolute;right:11px;top:0;bottom:0;display:flex;align-items:center;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:12.5px;color:var(--t2);}
.g-in{position:absolute;left:11px;top:0;bottom:0;display:flex;align-items:center;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:12.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);}
.sr-rule{font-size:11px;color:var(--t3);font-weight:600;margin-top:7px;}
.preset-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}

/* ===== 장비창 ===== */
.equip-win{background:linear-gradient(160deg,var(--s1),var(--white));border:1px solid var(--border2);
  border-radius:16px;padding:13px;}
.eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.slot{position:relative;background:var(--white);border:1.5px dashed var(--border2);border-radius:14px;
  padding:8px 6px 7px;min-height:96px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:.18s;box-shadow:inset 0 2px 8px rgba(47,127,214,.06);}
.slot:hover{border-color:var(--a3);transform:translateY(-2px);}
.slot.filled{border-style:solid;border-color:var(--rc,var(--a3));background:linear-gradient(170deg,var(--white),var(--s2));}
.slot.sel{box-shadow:0 0 0 2px var(--a1);}
.slot.drop{border-color:var(--a2);background:rgba(34,182,201,.14);transform:scale(1.04);}
.slot.dim{opacity:.4;}
.slot .s-label{font-size:9.5px;font-weight:800;color:var(--t3);font-family:'Nunito',sans-serif;letter-spacing:.4px;}
.slot .s-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;margin:3px 0 2px;}
.slot .s-icon img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
.slot .s-icon .ghost{font-size:20px;opacity:.24;filter:grayscale(1);}
.slot .s-name{font-size:10.5px;font-weight:800;color:var(--t1);text-align:center;line-height:1.25;
  word-break:break-all;max-height:26px;overflow:hidden;}
.slot .s-empty{font-size:10.5px;color:var(--t4);font-weight:700;margin-top:2px;}
.slot .s-rare{position:absolute;top:5px;left:6px;font-size:9px;font-weight:900;padding:2px 5px;border-radius:6px;
  color:#fff;background:var(--rc);font-family:'Noto Sans KR';}
.slot .s-off{position:absolute;top:4px;right:5px;width:18px;height:18px;border-radius:6px;border:none;
  background:var(--s2);color:var(--t3);font-size:11px;line-height:1;cursor:pointer;display:none;}
.slot.filled .s-off{display:block;}
.slot .s-off:hover{background:var(--err);color:#fff;}
.slot.soon{cursor:default;opacity:.5;}
.slot.soon:hover{transform:none;border-color:var(--border2);}
@keyframes equipPop{0%{transform:scale(.86)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.slot.pop{animation:equipPop .34s cubic-bezier(.22,1,.36,1);}
.eq-center{grid-row:span 3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:radial-gradient(circle at 50% 32%, var(--s2), var(--white) 72%);border:1px solid var(--border);
  border-radius:14px;padding:10px 8px;}
.eq-lv{font-family:'Nunito',sans-serif;font-weight:900;font-size:21px;color:var(--a1);line-height:1;}
.eq-reb{font-size:11px;font-weight:800;color:var(--t2);}
.eq-mini{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:5px;}
.eq-mini div{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--t2);
  font-family:'Nunito',sans-serif;}
.eq-mini b{color:var(--t1);}

/* ===== 옵션 편집 ===== */
.opt-name{font-size:15px;font-weight:900;}
.opt-sub{font-size:11px;color:var(--t3);font-weight:700;margin-top:2px;}
.rare-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;}
.rare-chip{border:1.5px solid var(--border);background:var(--white);color:var(--t2);border-radius:10px;
  padding:6px 10px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
.rare-chip:hover{border-color:var(--rc);color:var(--rc);}
.rare-chip.on{background:var(--rc);border-color:var(--rc);color:#fff;}
.rare-chip small{font-family:'Nunito',sans-serif;font-weight:700;opacity:.7;margin-left:4px;font-size:9.5px;}
.rare-gain{background:var(--s1);border-radius:11px;padding:9px 12px;margin-top:9px;font-size:11.5px;
  color:var(--t2);font-weight:700;line-height:1.7;}
.orow{padding:11px 0;border-top:1px dashed var(--border);}
.orow:first-of-type{border-top:none;}
.orow-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.orow-name{font-size:12.5px;font-weight:800;}
.orow-val{font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;}
.orow-val.neg{color:var(--neg);}
.orange{display:flex;align-items:center;gap:8px;margin-top:6px;}
.orange span{font-size:10px;color:var(--t3);font-weight:800;font-family:'Nunito',sans-serif;min-width:26px;text-align:center;}
.orange input[type=range]{flex:1;}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:18px;}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--s2);border-radius:99px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--a1);border:2px solid var(--white);margin-top:-5px;cursor:pointer;box-shadow:0 1px 5px rgba(47,127,214,.4);}
input[type=range]::-moz-range-track{height:6px;background:var(--s2);border-radius:99px;}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--a1);border:2px solid var(--white);cursor:pointer;}
.fixed-tag{font-size:10.5px;color:var(--t3);font-weight:700;margin-top:4px;}

/* ===== 결과 ===== */
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.res{border:1px solid var(--border);border-radius:14px;padding:13px 14px;background:var(--s1);position:relative;overflow:hidden;}
.res::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);}
.res .l{font-size:11px;font-weight:800;color:var(--t3);font-family:'Nunito',sans-serif;letter-spacing:.4px;}
.res .v{font-family:'Nunito',sans-serif;font-weight:900;font-size:30px;line-height:1.1;color:var(--c);letter-spacing:-1px;}
.res .d{font-size:11px;font-weight:800;color:var(--t3);font-family:'Nunito',sans-serif;height:15px;}
.res .d b.up{color:var(--ok);} .res .d b.dn{color:var(--err);}
.bars{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--s2);margin-top:8px;}
.bars i{display:block;height:100%;}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:10px;font-weight:700;color:var(--t3);font-family:'Nunito',sans-serif;}
.legend em{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;}
.extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:500;

  transition:.25s;pointer-events:none;box-shadow:var(--shadow2);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

}

  armor: {'고급':{def:3,shield:3,hp:1,eva:2},'희귀':{def:4,shield:4,hp:2,eva:3},'영웅':{def:5,shield:5,hp:3,eva:4},'전설':{def:8,shield:8,hp:4,eva:6},'신화':{def:14,shield:14,hp:6,eva:8}},
  totem: {'고급':{dmgUp:0.3,dmgDown:0.1,petSell:1},'희귀':{dmgUp:0.6,dmgDown:0.2,petSell:3},'영웅':{dmgUp:0.9,dmgDown:0.4,petSell:6},'전설':{dmgUp:1.5,dmgDown:0.6,petSell:10},'신화':{dmgUp:3.0,dmgDown:1.5,petSell:20}},
  acc:   {'고급':{dmgUp:0.3,dmgDown:0.1,grace:0.5},'희귀':{dmgUp:0.6,dmgDown:0.2,grace:1.0},'영웅':{dmgUp:0.9,dmgDown:0.4,grace:2.0},'전설':{dmgUp:1.5,dmgDown:0.6,grace:3.0},'신화':{dmgUp:3.0,dmgDown:1.5,grace:5.0}}

var WEAPON_PARTS=[0,1,2,3,4,17,18,19], ACC_PARTS=[8,9,10,11,12,13,14,15], TOTEM_PARTS=[24,25,26,27];

  var n=it.name;
  if(n.indexOf('목걸이')>=0||n.indexOf('팬던트')>=0||n.indexOf('펜던트')>=0||n.indexOf('쇠사슬')>=0) return '목걸이';

var ITEMS=[], ROLL='max', QUERY='', PART_F='전체', SORT='default', SHOWN=40, STEP=40, SELSLOT=null;
var S = {
  reb:0, lv:140, a:{vit:0,hel:0,str:0,spd:0}, base:{atk:0,def:0,hp:0,dex:0},
  eq:{},                       /* slotKey → {uid, r, o:{}} */
  soul:{on:false, grade:'영웅', lv:1000, st:{atk:0,def:0,dex:0}, sp:{hit:0,crit:0,eva:0}}
};

function byId(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trim(s){ return String(s==null?'':s).replace(/^\s+|\s+$/g,''); }
function num(v){ var n=parseInt(v,10); return isFinite(n)?n:0; }
function iconUrl(g){ return g?(ICON_BASE+g+'.png'):ICON_DEFAULT; }
function toast(t){ var e=byId('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('on');},1600); }
function findItem(uid){ for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].uid===uid) return ITEMS[i]; return null; }

/* 아이템 옵션 키 (편집 대상) */
var ITEM_OPTS=[['atk','Atk'],['def','Def'],['dex','Dex'],['hp','HP'],['crit','Crit'],['eva','Eva'],['charm','Charm']];
function optRange(it,key){ var mn=num(it['min'+key]), mx=num(it['max'+key]); return {min:Math.min(mn,mx), max:Math.max(mn,mx)}; }
function defaultOpts(it){
  var o={};
  for(var i=0;i<ITEM_OPTS.length;i++){
    var r=optRange(it,ITEM_OPTS[i][1]);
    o[ITEM_OPTS[i][0]] = ROLL==='min'?r.min : ROLL==='max'?r.max : Math.round((r.min+r.max)/2);
  }
  return o;
}
function eqOpts(slotKey){
  var e=S.eq[slotKey]; if(!e) return null;
  var it=findItem(e.uid); if(!it) return null;
  if(!e.o) e.o=defaultOpts(it);
  return e.o;
}
function rarityGain(slotKey){
  var e=S.eq[slotKey]; if(!e||!e.r||e.r==='없음') return {};
  var sd=slotDef(slotKey); if(!sd||!sd.rare) return {};
  return RARITY_TABLE[sd.rare][e.r]||{};
}

/* ===== 계산 ===== */
function totalPoints(){ return REB_BASE[S.reb]+(S.lv-1)*PER_LEVEL; }
function usedPoints(){ return S.a.vit+S.a.hel+S.a.str+S.a.spd; }
function leftPoints(){ return totalPoints()-usedPoints(); }
function equippedList(){
  var arr=[];
  for(var i=0;i<SLOTS.length;i++){
    var k=SLOTS[i].k, e=S.eq[k]; if(!e) continue;
    var it=findItem(e.uid); if(it) arr.push({slot:k, e:e, it:it});
  }
  return arr;
}
function soulTotals(){
  var g=SOUL_GRADE[S.soul.grade]||SOUL_GRADE['일반'];
  var o={atk:0,def:0,dex:0,hit:0,crit:0,eva:0,shield:0,pen:0,exp:0,move:0};
  if(!S.soul.on) return o;
  o.atk+=num(S.soul.st.atk); o.def+=num(S.soul.st.def); o.dex+=num(S.soul.st.dex);
  o.hit+=num(S.soul.sp.hit); o.crit+=num(S.soul.sp.crit); o.eva+=num(S.soul.sp.eva);
  for(var i=0;i<SOUL_LV.length;i++) if(num(S.soul.lv)>=SOUL_LV[i].lv) o[SOUL_LV[i].k]+=SOUL_LV[i].v;
  return o;
}
function calc(){
  var c=statContrib(S.a), out={}, parts={}, statBase={};
  for(var i=0;i<RES.length;i++){
    var k=RES[i].k; statBase[k]=sumObj(c[k]);
    out[k]=statBase[k]+num(S.base[k]);
    parts[k]={vit:c[k].vit, hel:c[k].hel, str:c[k].str, spd:c[k].spd, item:0, soul:0};
  }
  var ex={crit:0,eva:0,hit:0,pen:0,shield:0,charm:0,stam:0};
  var pct={dmgUp:0,dmgDown:0,petSell:0,grace:0,exp:0,move:0};
  var magics=[], sets={}, list=equippedList();
  for(var j=0;j<list.length;j++){
    var row=list[j], it=row.it, o=eqOpts(row.slot);
    out.atk+=num(o.atk); out.def+=num(o.def); out.dex+=num(o.dex); out.hp+=num(o.hp);
    parts.atk.item+=num(o.atk); parts.def.item+=num(o.def); parts.dex.item+=num(o.dex); parts.hp.item+=num(o.hp);
    ex.crit+=num(o.crit); ex.eva+=num(o.eva); ex.charm+=num(o.charm);
    ex.hit+=num(it.hit); ex.stam+=num(it.stamina);
    if(it.magicName&&it.magicName!=='주술없음') magics.push(it.name+' · '+it.magicName);
    if(it.setEff){ if(!sets[it.setEff]) sets[it.setEff]=[]; sets[it.setEff].push(itemType(it)); }
    var g=rarityGain(row.slot);
    for(var gk in g){
      if(gk==='atk'||gk==='def'||gk==='dex'||gk==='hp'){ out[gk]+=g[gk]; parts[gk].item+=g[gk]; }
      else if(PCT_KEYS.indexOf(gk)>=0) pct[gk]+=g[gk];
      else ex[gk]+=g[gk];
    }
  }
  var setOn=[];
  for(var s in sets){
    var types=sets[s];
    var hasWeapon=types.indexOf('weapon')>=0, hasHead=types.indexOf('head')>=0, hasBody=types.indexOf('body')>=0;
    if(!(hasWeapon&&hasHead&&hasBody)) continue; /* 세트옵션은 무기+투구+갑옷 3부위를 모두 착용해야 발동 */
    var m=String(s).match(/(공|방|순|내)\s*([+-]?\d+)/); if(!m) continue;
    var mk={'공':'atk','방':'def','순':'dex','내':'hp'}[m[1]], mv=num(m[2]);
    out[mk]+=mv; parts[mk].item+=mv; setOn.push(s+' (무기·투구·갑옷 착용)');
  }
  var so=soulTotals();
  out.atk+=so.atk; out.def+=so.def; out.dex+=so.dex;
  parts.atk.soul+=so.atk; parts.def.soul+=so.def; parts.dex.soul+=so.dex;
  ex.hit+=so.hit; ex.crit+=so.crit; ex.eva+=so.eva; ex.shield+=so.shield; ex.pen+=so.pen;
  pct.exp+=so.exp; pct.move+=so.move;
  return {out:out, statBase:statBase, parts:parts, ex:ex, pct:pct, magics:magics, sets:setOn, count:list.length};
}

function syncGauges(){

/* ===== 착용 ===== */
function canEquipAcc(slotKey, it){
  var other = slotKey==='acc1'?'acc2':'acc1', oe=S.eq[other];
  if(!oe) return true;
  var oi=findItem(oe.uid); if(!oi) return true;
  return accKind(oi)!==accKind(it);
}
function equipTo(slotKey, uid){
  var it=findItem(uid), sd=slotDef(slotKey);
  if(!it||!sd) return false;
  if(itemType(it)!==sd.type){ toast('이 칸에는 착용할 수 없어'); return false; }
  if(sd.type==='acc' && !canEquipAcc(slotKey,it)){ toast(accKind(it)+'는 이미 다른 칸에 착용중이야'); return false; }
  for(var k in S.eq) if(S.eq[k] && S.eq[k].uid===uid) delete S.eq[k];
  S.eq[slotKey]={uid:uid, r:'없음', o:defaultOpts(it)};
  SELSLOT=slotKey;
  renderAll();
  var el=byId('eqGrid').querySelector('[data-slot="'+slotKey+'"]');
  if(el){ el.classList.add('pop'); setTimeout(function(){ el.classList.remove('pop'); },340); }
  return true;
}
function autoEquip(uid){
  var it=findItem(uid); if(!it) return;
  for(var k in S.eq) if(S.eq[k] && S.eq[k].uid===uid){ delete S.eq[k]; if(SELSLOT===k) SELSLOT=null; renderAll(); return; }
  var tp=itemType(it);
  if(!tp){ toast('착용할 수 없는 아이템'); return; }
  var cands=SLOTS.filter(function(s){ return s.type===tp; });
  var target=null;
  for(var i=0;i<cands.length;i++){
    if(S.eq[cands[i].k]) continue;
    if(tp==='acc' && !canEquipAcc(cands[i].k,it)) continue;
    target=cands[i].k; break;
  }
  if(!target){
    if(tp==='acc'){
      for(var j=0;j<cands.length;j++) if(canEquipAcc(cands[j].k,it)){ target=cands[j].k; break; }
      if(!target){ toast(accKind(it)+'는 이미 착용중이야'); return; }
    } else target=cands[0].k;
  }
  equipTo(target, uid);
}

/* ===== 게이지 드래그 ===== */
function gaugeValue(el, clientX, maxVal){
  var r=el.getBoundingClientRect();
  var ratio=Math.max(0, Math.min(1, (clientX-r.left)/r.width));
  return Math.round(ratio*maxVal);
}
function bindGaugeDrag(root){
  root.addEventListener('pointerdown', function(e){
    var g=e.target.closest('.gauge'); if(!g) return;
    g.setPointerCapture(e.pointerId);
    g._drag=true; applyGauge(g, e.clientX);
  });
  root.addEventListener('pointermove', function(e){
    var g=e.target.closest('.gauge'); if(!g||!g._drag) return;
    applyGauge(g, e.clientX);
  });
  root.addEventListener('pointerup', function(e){
    var g=e.target.closest('.gauge'); if(g) g._drag=false;
  });
  root.addEventListener('pointercancel', function(e){
    var g=e.target.closest('.gauge'); if(g) g._drag=false;
  });
}
function applyGauge(g, x){
  if(g.hasAttribute('data-g')){
    setStat(g.getAttribute('data-g'), gaugeValue(g, x, totalPoints()));
  } else if(g.hasAttribute('data-sa')){
    var k=g.getAttribute('data-sa'), t=SOUL_GRADE[S.soul.grade].stat;
    var others=num(S.soul.st.atk)+num(S.soul.st.def)+num(S.soul.st.dex)-num(S.soul.st[k]);
    S.soul.st[k]=Math.max(0, Math.min(gaugeValue(g,x,t), t-others));
    S.soul.on=true; syncSoulGauges(); refreshSoulHead(); renderEquip(); renderResult(); saveLocal();
  } else if(g.hasAttribute('data-sp')){
    var k2=g.getAttribute('data-sp'), t2=SOUL_GRADE[S.soul.grade].sp;
    var o2=num(S.soul.sp.hit)+num(S.soul.sp.crit)+num(S.soul.sp.eva)-num(S.soul.sp[k2]);

  else S.a=optimize(t,p.w);
  renderStatRows(); renderAll(); toast(p.n+' 분배 적용');
});
function optimize(total,w){
  var a={vit:0,hel:0,str:0,spd:0}, left=total, guard=0;
  function score(x){ var c=statContrib(x); return sumObj(c.atk)*w.atk+sumObj(c.def)*w.def+sumObj(c.hp)*w.hp+sumObj(c.dex)*w.dex; }
  while(left>0&&guard++<1000){
    var best=null, cur=score(a);
    for(var i=0;i<STATS.length;i++){
      var k=STATS[i].k;
      for(var n=1;n<=Math.min(20,left);n++){
        var t={vit:a.vit,hel:a.hel,str:a.str,spd:a.spd}; t[k]+=n;
        var rate=(score(t)-cur)/n;
        if(!best||rate>best.rate+1e-9) best={k:k,n:n,rate:rate};
      }
    }
    if(!best||best.rate<=0){ a.vit+=left; break; }
    a[best.k]+=best.n; left-=best.n;
  }
  return a;
}

/* ===== 라이브 데이터 로딩 (아이템도감과 동일 파서) ===== */
var IDX={name:0,sys:1,desc:2,setStat:3,setCmd1:11,setCmd2:12,id:16,gfx:17,type:19,setCode:34,
  minHit:35,maxHit:36,minAtk:37,maxAtk:38,minDef:39,maxDef:40,minDex:41,maxDex:42,minHP:43,maxHP:44,
  minCharm:49,maxCharm:50,minEva:51,maxEva:52,magic:55,stamina:57,hit:61,minCrit:75,maxCrit:76};
function intOnly(x){ var s=trim(x); if(!s) return '-'; var m=s.match(/-?\d+/); return m?m[0]:'-'; }
function numOf(x){ var v=Number(trim(x)); return isFinite(v)?v:0; }
function parseMagic(text){
  var map={}, lines=String(text||'').split(/\r?\n/);
  for(var i=0;i<lines.length;i++){ var line=trim(lines[i]); if(!line||line.charAt(0)==='#'||line.indexOf('//')===0) continue;
    var a=line.split(','), nm=trim(a[0]), code=trim(a[4]); if(nm&&code) map[code]=nm; }
  return map;
}
function parseSetEffect(a){
  var c1=trim(a[IDX.setCmd1]), c2=trim(a[IDX.setCmd2]);
  if(c1!=='ITEM_suitEquip'&&c2!=='ITEM_ResuitEquip') return '';
  if(intOnly(a[IDX.setCode])==='-') return '';
  var m=trim(a[IDX.setStat]).match(/^([A-Z_]+)\s*:\s*(-?\d+)/i); if(!m) return '';
  var map={MSTR:'공',MTGH:'방',MDEX:'순',MVITAL:'내'};
  var label=map[(m[1]||'').toUpperCase()]; if(!label) return '';
  var v=Number(m[2]); if(!isFinite(v)||v===0) return '';
  return '세트효과 '+label+(v>0?'+':'')+v;
}
function parseItem(line, magicMap, order){
  var a=String(line||'').split(',');
  var name=trim(a[IDX.name]), id=trim(a[IDX.id]);
  if(!name||!id) return null;
  var magicCode=intOnly(a[IDX.magic]), magicName='주술없음';
  if(magicCode!=='-'&&magicMap[magicCode]) magicName=magicMap[magicCode];
  return {o:order, uid:id+'#'+order, name:name, id:id, gfx:trim(a[IDX.gfx]),
    route:trim(a[IDX.sys]), part:numOf(a[IDX.type]), setEff:parseSetEffect(a),
    minAtk:intOnly(a[IDX.minAtk]), maxAtk:intOnly(a[IDX.maxAtk]),
    minDef:intOnly(a[IDX.minDef]), maxDef:intOnly(a[IDX.maxDef]),
    minDex:intOnly(a[IDX.minDex]), maxDex:intOnly(a[IDX.maxDex]),
    minHP:intOnly(a[IDX.minHP]), maxHP:intOnly(a[IDX.maxHP]),
    minCrit:intOnly(a[IDX.minCrit]), maxCrit:intOnly(a[IDX.maxCrit]),
    minEva:intOnly(a[IDX.minEva]), maxEva:intOnly(a[IDX.maxEva]),
    hit:intOnly(a[IDX.hit]), minCharm:intOnly(a[IDX.minCharm]), maxCharm:intOnly(a[IDX.maxCharm]),
    magicName:magicName, stamina:intOnly(a[IDX.stamina])};
}
async function fetchTextSmart(url){
  var res=await fetch(url,{cache:'no-store'}); if(!res.ok) return '';
  var buf=await res.arrayBuffer(), encs=['utf-8','euc-kr','windows-949'], best='', bestScore=-1e9;
  for(var i=0;i<encs.length;i++){ try{
    var txt=new TextDecoder(encs[i],{fatal:false}).decode(buf);
    var broken=(txt.match(/\uFFFD/g)||[]).length, kor=(txt.match(/[가-힣]/g)||[]).length;
    var sc=kor*2-broken*80; if(sc>bestScore){ bestScore=sc; best=txt; }
  }catch(e){} }
  return best;
}
/* 레포에 자동 생성되는 캐시 파일 (같은 오리진이라 CORS 걸릴 일 없음, GitHub Actions가 주기적으로 갱신) */
var REPO_ITEM_FILE = './item_data.json';

function applyParsedItems(parsed, statusText){
  if(!parsed.length) return false;
  var keep={};
  for(var k in S.eq) if(S.eq[k]) keep[k]=S.eq[k];
  ITEMS=parsed;
  for(var k2 in keep){ if(!findItem(keep[k2].uid)) delete S.eq[k2]; }
  renderAll();
  byId('loadStatus').textContent=statusText+' '+ITEMS.filter(function(i){return !!itemType(i);}).length+'개 ✓';
  return true;
}

/* 1순위: 레포에 저장된 item_data.json (같은 오리진 fetch라 항상 성공) */
async function loadFromRepoCache(){
  try{
    var res=await fetch(REPO_ITEM_FILE,{cache:'no-store'});
    if(!res.ok) return false;
    var data=await res.json();
    var rows=data.rows||data;
    if(!rows||!rows.length) return false;
    var parsed=rows.map(function(it,i){ it.uid=it.id+'#'+(it.o!=null?it.o:i); return it; });
    var when=data.generatedAt?(' ('+String(data.generatedAt).slice(0,16).replace('T',' ')+')'):'';
    return applyParsedItems(parsed, '레포 캐시 최신'+when);
  }catch(e){ return false; }
}

/* 2순위: 게임 서버 직접 fetch — sa000001.com이 CORS 헤더를 안 내려줘서 대부분의 경우
   (예: GitHub Pages처럼 다른 오리진에서 여는 경우) 브라우저가 막고 실패함.
   그래도 혹시 되는 환경(같은 오리진, 확장 프로그램 등)이 있을 수 있어 시도는 남겨둠. */
async function loadDirectFromServer(){
  try{
    var magicMap=parseMagic(await fetchTextSmart(MAGIC_FILE));
    var itemText=await fetchTextSmart(DATA_FILE);
    if(!itemText) throw new Error('no data');
    var lines=itemText.split(/\r?\n/), parsed=[];
    for(var i=0;i<lines.length;i++){
      var line=trim(lines[i]); if(!line||line.charAt(0)==='#'||line.indexOf('//')===0) continue;
      var it=parseItem(line, magicMap, parsed.length); if(it) parsed.push(it);
    }
    return applyParsedItems(parsed, '서버 직접 최신');
  }catch(e){ return false; }
}

async function loadLive(){
  var ok = await loadFromRepoCache();
  if(!ok) ok = await loadDirectFromServer();
  if(!ok) byId('loadStatus').textContent='장착 아이템 '+ITEMS.filter(function(i){return !!itemType(i);}).length+'개 (오프라인 캐시)';
}
