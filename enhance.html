.gw-x{position:absolute;right:-14px;top:-16px;width:44px;height:44px;border-radius:50%;border:3px solid #2a2622;background:radial-gradient(circle at 40% 35%,#f4f1ea,#a9a49a);display:flex;align-items:center;justify-content:center;color:#d22;font-size:26px;font-weight:900;box-shadow:0 3px 6px rgba(0,0,0,.45);text-decoration:none;font-family:sans-serif}

  background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 3px,transparent 3px 9px),linear-gradient(180deg,#f2a55a,#d7782c 55%,#b85d1a);border:2px solid #5a2c0a;border-radius:4px;box-shadow:0 2px 0 #3a1a05,inset 0 1px 0 rgba(255,255,255,.4)}
/* 장비 칸 */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:6px 4px 14px;border-bottom:2px solid #3e4139}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:#8fc4ef;font-size:13px;cursor:pointer}
.slot .tile{position:relative;width:62px;height:62px;border:2px solid #0d0e0c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);

    radial-gradient(circle at 30% 40%,rgba(120,60,20,.35) 0 1px,transparent 1.6px) 0 0/6px 6px,

    linear-gradient(135deg,#f3c79a,#e8ad7c);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s}
.slot.off .tile{filter:grayscale(.55) brightness(.7)}
.slot.lock{cursor:default;color:#6f9fcb}
.slot.lock .tile{background:radial-gradient(circle at 30% 40%,rgba(0,0,0,.35) 0 1px,transparent 1.6px) 0 0/5px 5px,linear-gradient(135deg,#6b4a33,#4f3624);font-size:13px;color:#e9c04c}
.slot:not(.lock):hover .tile{transform:translateY(-2px)}

<script>
(function(){
"use strict";
const { $, esc } = JM;
/* ===== 쟈쟈 슬롯 강화 (공홈 안내 기준) =====
   도전 단계 +1~+10 성공률, 소모 스톤, 실패 시 하락(+1로) 확률. +2~+4 실패는 단계 유지.
   강화석은 단계와 관계없이 도전할 때마다 1개. */
const MAX = 10;
const RATE = [100, 80, 60, 50, 40, 40, 30, 20, 20, 10];
const COST = [18100, 32150, 54240, 71630, 132090, 239250, 274890, 331260, 401760, 472995];
const DROP = [0, 0, 0, 0, 60, 60, 70, 80, 80, 90];       /* 실패했을 때 +1로 떨어질 확률(%) */
const DROP_TO = 1;
const GAIN = {
  weapon:[{atk:1},{atk:1},{atk:1},{atk:2},{atk:2},{atk:2,pen:5,hit:5},{atk:2},{atk:4,pen:10,hit:5},{atk:5},{atk:5,pen:15,hit:5}],
  armor: [{def:1},{def:1},{def:1},{def:2,hp:5},{def:2},{def:2,shd:5,hp:5},{def:2},{def:4,shd:5,hp:5},{def:5},{def:5,shd:10,hp:10}]
};
const KINDS = { weapon:{ label:"무기 칸", sub:"무기" }, armor:{ label:"머리·몸 칸", sub:"투구·갑옷" } };
const LABEL = { atk:"공격력", def:"방어력", hp:"내구력", pen:"관통", hit:"명중", shd:"쉴드" };
const ORDER = ["atk", "def", "hp", "pen", "hit", "shd"];
const rate = t => RATE[t - 1], cost = t => COST[t - 1], drop = t => DROP[t - 1];
function cum(kind, lv){ const o = {}; for(let i = 0; i < lv; i++){ const g = GAIN[kind][i]; for(const k in g) o[k] = (o[k] || 0) + g[k]; } return o; }

/* 기대값: start에서 target까지 평균 시도 수, 하락 횟수, 스톤(강화석 값 포함).
   E_k = A_k + B_k·X (X = +1에서 다시 시작했을 때의 기대값) 꼴로 뒤에서부터 풀어요 */
function expected(start, target, stonePrice){
  if(start >= target) return { attempts:0, drops:0, cost:0, stones:0 };
  const solve = (perTry, perDrop) => {
    const A = new Array(MAX + 1).fill(0), B = new Array(MAX + 1).fill(0);
    for(let k = target - 1; k >= 0; k--){
      const t = k + 1, p = rate(t)/100, d = drop(t)/100, c = perTry(t);
      if(!d){ A[k] = c/p + A[k + 1]; B[k] = B[k + 1]; }
      else {
        const q = p + (1 - p)*d;                        /* 단계가 바뀌는 확률 (성공 or 하락) */
        A[k] = (c + p*A[k + 1] + (1 - p)*d*perDrop)/q;
        B[k] = (p*B[k + 1] + (1 - p)*d)/q;
      }
    }
    const X = target > DROP_TO ? A[DROP_TO]/(1 - B[DROP_TO]) : 0;
    return A[start] + B[start]*X;
  };
  return {
    attempts: solve(() => 1, 0),
    drops: solve(() => 0, 1),
    cost: solve(t => cost(t) + (stonePrice || 0), 0)
  };
}
function runOnce(start, target, stonePrice){
  let lv = start, attempts = 0, drops = 0, money = 0;
  while(lv < target){
    const t = lv + 1;
    attempts++; money += cost(t) + (stonePrice || 0);
    if(Math.random()*100 < rate(t)) lv = t;
    else if(Math.random()*100 < drop(t)){ drops++; lv = DROP_TO; }
  }
  return { attempts, drops, cost:money };
}


/* ===== 칸 ===== */
const SLOT = {
  weapon:{ label:"무기", kind:"weapon", icon:"🔱", head:"무기 능력" },
  head:  { label:"머리", kind:"armor",  icon:"⛑", head:"방어구 능력" },
  body:  { label:"몸",   kind:"armor",  icon:"🛡", head:"방어구 능력" }
};
const GRID = [["lock","장신구 2"],["head"],["lock","장신구 1"],["weapon"],["body"],["lock","날개"],["lock","토템"],["lock","삼위일체"],["lock","소울"]];
const ROWS = {
  weapon:[["atk","공격력",""],["pen","관통","(+6 · +8 · +10)"],["hit","명중","(+6 · +8 · +10)"]],
  armor: [["def","방어력",""],["shd","쉴드","(+6 · +8 · +10)"],["hp","내구력","(+4 · +6 · +8 · +10)"]]
};

/* ===== 상태 ===== */
const KEY = "jaja-enh2";
const S = { lv:{ weapon:0, head:0, body:0 }, on:{ weapon:true, head:true, body:true }, sel:"body", stonePrice:0, target:10, keep:true,
  st:{ tries:0, ok:0, fail:0, drop:0, best:0, stoneCost:0, used:0 } };
let LOG = [], running = false, last = null;
try{
  const d = JSON.parse(localStorage.getItem(KEY) || "{}");
  if(d.lv) Object.assign(S.lv, d.lv); if(d.on) Object.assign(S.on, d.on); if(d.st) Object.assign(S.st, d.st);
  ["sel","stonePrice","target","keep"].forEach(k => { if(d[k] !== undefined) S[k] = d[k]; });
}catch(e){}
const clampLv = v => Math.max(0, Math.min(MAX, Math.round(Number(v) || 0)));
Object.keys(S.lv).forEach(k => { S.lv[k] = clampLv(S.lv[k]); });
if(!SLOT[S.sel]) S.sel = "body";
S.target = Math.max(1, Math.min(MAX, Math.round(S.target) || 10));
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fmtS(n){ n = Math.round(n); return n >= 1e8 ? (n/1e8).toFixed(n >= 1e10 ? 0 : 1) + "억" : n >= 1e4 ? (Math.round(n/1e3)/10).toLocaleString() + "만" : n.toLocaleString(); }
const fmtN = n => n >= 100 ? Math.round(n).toLocaleString() : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const gainText = g => ORDER.filter(k => g[k]).map(k => `${LABEL[k]} +${g[k]}`).join(" · ");
const curLv = () => S.lv[S.sel];

/* ===== 강화 한 번 ===== */
function attempt(){
  const k = S.sel, lv = S.lv[k];
  if(lv >= MAX) return null;
  const t = lv + 1, p = rate(t);
  S.st.tries++; S.st.used++; S.st.stoneCost += cost(t);
  const r = { slot:k, t, p, ok: Math.random()*100 < p, drop:false };
  if(r.ok){ S.lv[k] = t; S.st.ok++; S.st.best = Math.max(S.st.best, t); }
  else { S.st.fail++; if(drop(t) && Math.random()*100 < drop(t)){ r.drop = true; S.st.drop++; S.lv[k] = DROP_TO; } }
  return r;
}
function describe(r){
  const nm = SLOT[r.slot].label + " 칸";
  if(r.ok) return { cls:"ok", pop:`+${r.t} 성공!`, text:`${nm} +${r.t} 강화에 성공했습니다!` };
  if(r.drop) return { cls:"boom", pop:`+${DROP_TO}로 하락…`, text:`${nm} +${r.t} 강화 실패… 칸이 +${DROP_TO}(으)로 떨어졌습니다.` };
  return { cls:"keep", pop:"실패", text:`${nm} +${r.t} 강화 실패. 단계는 그대로, 강화석과 스톤만 사라졌습니다.` };
}
function pushLog(r){
  const d = describe(r);
  LOG.unshift({ cls:d.cls, text:`#${S.st.tries} ${d.text}` });
  if(LOG.length > 80) LOG.length = 80;
}

/* ===== 장비 칸 ===== */
function tileHTML(k, big){
  const lv = S.lv[k];
  return `<span class="tile">${SLOT[k].icon}${lv ? `<span class="en${lv >= 7 ? " hi" : ""}">+${lv}</span>` : ""}</span>`;
}
function renderSlots(){
  $("slots").innerHTML = GRID.map(g => g[0] === "lock"
    ? `<div class="slot lock"><span class="tile">🔒</span><span>${g[1]}</span></div>`
    : `<button type="button" class="slot${S.sel === g[0] ? " sel" : ""}${S.on[g[0]] ? "" : " off"}" data-k="${g[0]}">${tileHTML(g[0])}<span>${SLOT[g[0]].label}</span></button>`).join("");
  const t = {};
  Object.keys(SLOT).forEach(k => { if(!S.on[k]) return; const c = cum(SLOT[k].kind, S.lv[k]); for(const x in c) t[x] = (t[x] || 0) + c[x]; });
  const cell = (l, v) => `<div><span>${l}</span><b class="${v ? "pos" : ""}">${v || 0}</b></div>`;
  $("sum").innerHTML = cell("공격력", t.atk) + cell("방어력", t.def) + cell("내구력", t.hp) + cell("순발력", 0) + cell("회피", 0) + cell("명중", t.hit) + cell("크리", 0) + cell("관통", t.pen) + cell("쉴드", t.shd);
}

/* ===== 슬롯강화 창 ===== */
function renderPanel(){
  const k = S.sel, sd = SLOT[k], lv = S.lv[k], nx = Math.min(MAX, lv + 1), full = lv >= MAX;
  const now = cum(sd.kind, lv), aft = cum(sd.kind, nx);
  const dia = Array.from({ length:MAX }, (_, i) => `<i class="${i < lv ? "on" : ""}${i >= 4 ? " hot" : ""}">${i < lv ? "◆" : "◇"}</i>`).join("");
  const rows = ROWS[sd.kind].map(([key, l, sub]) => {
    const a = now[key] || 0, b = aft[key] || 0;
    return `<tr><td>${l} ${sub ? `<small>${sub}</small>` : ""}</td><td>${a ? "+" + a : 0}</td><td class="${!full && b > a ? "up" : ""}">${full ? "-" : (b ? "+" + b : 0)}</td></tr>`;
  }).join("");
  let res;
  if(last && last.slot === k){ const d = describe(last); res = `<div class="res ${d.cls}">${esc(d.text)}</div>`; }
  else if(full) res = `<div class="res ok">최대 강화(+10)입니다.</div>`;
  else res = `<div class="res">${drop(nx) ? `실패하면 ${drop(nx)}% 확률로 +${DROP_TO}(으)로 떨어집니다.` : "실패해도 단계는 그대로, 강화석과 스톤만 사라집니다."}</div>`;
  $("enBody").innerHTML = `
    <div class="en-top">${tileHTML(k)}
      <div><div class="en-name">${sd.label} 칸</div><div class="dia">${dia}</div></div>
      <div class="en-lvbox"><b>+${lv} / +${MAX}</b><small>${full ? "최대" : "다음 +" + nx}</small></div>
    </div>
    <div class="wear"><span>지금 착용한 것</span><button type="button" id="wearBtn" class="${S.on[k] ? "on" : ""}">${S.on[k] ? "착용 중" : "비어 있음"}</button></div>
    <div class="hint">${S.on[k] ? "&nbsp;" : "빈 칸은 단계만 남고 효과는 없습니다."}</div>
    <div class="sep"></div>
    <table class="cmp"><thead><tr><th>${sd.head}</th><th>지금 (+${lv})</th><th>${full ? "강화 후" : `강화 후 (+${nx})`}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sep"></div>
    <div class="cost"><span class="ic">💎</span><span>강화석</span><span class="v">${full ? "-" : "1개"}</span><span class="own">누적 ${S.st.used.toLocaleString()}개</span></div>
    <div class="cost"><span class="ic gold">💰</span><span>스톤</span><span class="v">${full ? "-" : cost(nx).toLocaleString()}</span><span class="own">누적 ${fmtS(S.st.stoneCost)}</span></div>
    <div class="rate"><span>성공률</span><div class="bar"><i style="width:${full ? 0 : rate(nx)}%"></i></div><b>${full ? "-" : rate(nx) + "%"}</b></div>
    ${res}
    <div class="gbtns">
      <button type="button" class="gbtn main" id="enTry"${running || full ? " disabled" : ""}>강화</button>
      <button type="button" class="gbtn" id="enAuto"${full && !running ? " disabled" : ""}>${running ? "멈춤" : "목표까지 자동"}</button>
    </div>
    <div class="gauto">
      <label>목표 <select id="enTarget">${Array.from({ length:MAX }, (_, i) => `<option value="${i + 1}"${i + 1 === S.target ? " selected" : ""}>+${i + 1}</option>`).join("")}</select></label>
      <label><input type="checkbox" id="enKeep"${S.keep ? " checked" : ""}> 떨어져도 계속</label>
      <label>단계 <select id="enSet">${Array.from({ length:MAX + 1 }, (_, i) => `<option value="${i}"${i === lv ? " selected" : ""}>+${i}</option>`).join("")}</select></label>
      <label>강화석 값 <input type="number" id="enStone" min="0" inputmode="numeric" value="${S.stonePrice}"></label>
    </div>`;
}

/* ===== 아래 통계 ===== */
function renderStats(){
  const s = S.st, box = (l, v, w) => `<div${w ? ' class="wide"' : ""}><span>${l}</span><b>${v}</b></div>`;
  $("enStats").innerHTML = box("시도", s.tries.toLocaleString()) + box("성공", s.ok.toLocaleString()) + box("실패", s.fail.toLocaleString()) +
    box("+1로 하락", s.drop.toLocaleString()) + box("최고 단계", "+" + s.best) + box("성공률", s.tries ? (s.ok/s.tries*100).toFixed(1) + "%" : "-") +
    box("강화석", s.used.toLocaleString() + "개") + box("스톤", fmtS(s.stoneCost)) + box("강화석 값", S.stonePrice ? fmtS(s.used*S.stonePrice) : "0") +
    box(S.stonePrice ? "총 비용 (강화석 값 포함)" : "총 비용 (강화석 값 0으로 계산)", fmtS(s.stoneCost + s.used*S.stonePrice), true);
  $("enLog").innerHTML = LOG.length ? LOG.map(l => `<div class="${l.cls}">${esc(l.text)}</div>`).join("") : '<div style="color:var(--ink3)">강화를 누르면 여기에 쌓여요</div>';
}
function renderExpect(){
  const lv = curLv();
  $("expNote").textContent = `${SLOT[S.sel].label} 칸 +${lv}에서 출발 · 시도 횟수 = 강화석 개수`;
  let h = `<thead><tr><th>목표</th><th>평균 시도</th><th>평균 하락</th><th>평균 스톤</th></tr></thead><tbody>`;
  if(lv >= MAX) h += `<tr><td colspan="4" style="text-align:center">이미 +10이에요</td></tr>`;
  for(let t = lv + 1; t <= MAX; t++){
    const x = expected(lv, t, S.stonePrice);
    h += `<tr class="${t === S.target ? "cur" : ""}"><td>+${t}</td><td>${fmtN(x.attempts)}</td><td>${fmtN(x.drops)}</td><td>${fmtS(x.cost)}</td></tr>`;
  }
  $("enExpect").innerHTML = h + "</tbody>";
}
function renderTables(){
  let h = `<thead><tr><th>도전 단계</th><th>성공률</th><th>실패하면</th><th>소모 스톤</th><th>무기 칸</th><th>머리 · 몸 칸</th></tr></thead><tbody>`;
  for(let t = 1; t <= MAX; t++){
    h += `<tr class="${t === curLv() + 1 ? "cur" : ""}"><td>+${t}</td><td>${rate(t)}%</td><td class="${t === 1 ? "" : drop(t) ? "boomc" : "keepc"}">${t === 1 ? "-" : drop(t) ? `하락 ${drop(t)}% → +${DROP_TO}` : "단계 유지"}</td><td>${cost(t).toLocaleString()}</td><td>${esc(gainText(GAIN.weapon[t - 1]))}</td><td>${esc(gainText(GAIN.armor[t - 1]))}</td></tr>`;
  }
  h += `<tr><td>합계</td><td></td><td></td><td>${COST.reduce((a, b) => a + b, 0).toLocaleString()}</td><td>${esc(gainText(cum("weapon", MAX)))}</td><td>${esc(gainText(cum("armor", MAX)))}</td></tr>`;
  $("enRates").innerHTML = h + "</tbody>";
}
function render(){ renderSlots(); renderPanel(); renderStats(); renderExpect(); renderTables(); save(); }
function fx(r){
  const p = $("enPanel"), d = describe(r);
  p.classList.remove("flash-ok", "flash-bad", "flash-drop"); void p.offsetWidth;
  p.classList.add(r.ok ? "flash-ok" : r.drop ? "flash-drop" : "flash-bad");
  if(!JM.smooth()) return;
  p.querySelectorAll(".pop").forEach(x => x.remove());
  const el = document.createElement("div");
  el.className = "pop"; el.textContent = d.pop;
  el.style.color = r.ok ? "#ffd54a" : r.drop ? "#ff7a6b" : "#e9e6dc";
  p.appendChild(el); setTimeout(() => el.remove(), 1150);
}

/* ===== 동작 ===== */
function doTry(){
  if(running) return;
  const r = attempt(); if(!r) return;
  last = r; pushLog(r); render(); fx(r);
  JM.haptic(r.drop ? 40 : r.ok ? 16 : 10);
}
async function autoRun(){
  if(running){ running = false; return; }
  const k = S.sel;
  if(S.lv[k] >= S.target){ last = null; render(); $("enBody").querySelector(".res").textContent = "이미 목표 단계예요. 목표를 올려보세요."; return; }
  running = true; let n = 0, drops = 0;
  render();
  while(running && S.lv[k] < S.target && n < 400000){
    const r = attempt(); if(!r) break; n++; last = r;
    const quiet = n > 30;
    if(!quiet || r.drop || (r.ok && r.t >= 7)) pushLog(r);
    if(r.drop){ drops++; if(!S.keep){ running = false; render(); fx(r); return; } }
    if(!quiet){ render(); fx(r); await sleep(110); }
    else if(n % 300 === 0){ render(); await sleep(0); }
  }
  const done = S.lv[k] >= S.target;
  running = false; render();
  const res = $("enBody").querySelector(".res");
  res.className = "res " + (done ? "ok" : "keep");
  res.textContent = done ? `+${S.target} 달성! ${n.toLocaleString()}번 시도 (강화석 ${n.toLocaleString()}개), +${DROP_TO} 하락 ${drops.toLocaleString()}번` : `멈췄습니다 (${n.toLocaleString()}번 시도)`;
}
async function monteCarlo(){
  const btn = $("enMC"), out = $("enMCOut"), lv = curLv();
  if(lv >= S.target){ out.textContent = "목표가 지금 단계보다 높아야 해요."; return; }
  btn.disabled = true; const N = 1000, A = [], D = [], C = [];
  for(let i = 0; i < N; i++){
    const r = runOnce(lv, S.target, S.stonePrice);
    A.push(r.attempts); D.push(r.drops); C.push(r.cost);
    if(i % 40 === 39){ out.textContent = `돌리는 중… ${i + 1}/${N}`; await sleep(0); }
  }
  const q = (arr, p) => { const a = arr.slice().sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(a.length*p))]; };
  out.innerHTML = `${SLOT[S.sel].label} 칸 +${lv} → <b>+${S.target}</b> · ${N.toLocaleString()}번 돌린 결과<br>
    강화석: 중앙값 <b>${fmtN(q(A, .5))}</b>개 · 운 나쁜 10%는 <b>${fmtN(q(A, .9))}</b>개 이상<br>
    +${DROP_TO} 하락: 중앙값 <b>${fmtN(q(D, .5))}</b>번 · 운 나쁜 10%는 <b>${fmtN(q(D, .9))}</b>번 이상<br>
    스톤: 중앙값 <b>${fmtS(q(C, .5))}</b> · 운 나쁜 10%는 <b>${fmtS(q(C, .9))}</b> 이상`;
  btn.disabled = false;
}
function toCalc(){
  try{
    const raw = localStorage.getItem("sa2-statcalc"), d = raw ? JSON.parse(raw) : {};
    d.S = d.S || {};
    d.S.en = { weapon:S.lv.weapon, head:S.lv.head, body:S.lv.body };
    localStorage.setItem("sa2-statcalc", JSON.stringify(d));
    $("toCalc").textContent = `✔ 적용했어요 (무기 +${S.lv.weapon} · 머리 +${S.lv.head} · 몸 +${S.lv.body}) → 열기`;
    $("toCalc").onclick = () => { location.href = "statcalc.html"; };
  }catch(e){ $("toCalc").textContent = "적용하지 못했어요 (브라우저 저장소가 막혀 있어요)"; }
}
function bind(){
  $("slots").addEventListener("click", e => {
    const b = e.target.closest("[data-k]"); if(!b || running) return;
    S.sel = b.dataset.k; last = null; $("enMCOut").textContent = ""; render();
  });
  $("enBody").addEventListener("click", e => {
    if(e.target.id === "enTry") doTry();
    else if(e.target.id === "enAuto") autoRun();
    else if(e.target.id === "wearBtn"){ S.on[S.sel] = !S.on[S.sel]; render(); }
  });
  $("enBody").addEventListener("change", e => {
    const id = e.target.id;
    if(id === "enTarget"){ S.target = Number(e.target.value); render(); }
    else if(id === "enKeep"){ S.keep = e.target.checked; save(); }
    else if(id === "enSet" && !running){ S.lv[S.sel] = clampLv(e.target.value); last = null; render(); }
    else if(id === "enStone"){ S.stonePrice = Math.max(0, Math.round(Number(e.target.value) || 0)); render(); }
  });
  document.addEventListener("keydown", e => {
    if((e.key === " " || e.key === "Enter") && e.target === document.body){ e.preventDefault(); doTry(); }
  });
  $("enMC").addEventListener("click", monteCarlo);
  $("enClear").addEventListener("click", () => { Object.keys(S.st).forEach(k => { S.st[k] = 0; }); LOG = []; last = null; $("enMCOut").textContent = ""; render(); });
  $("toCalc").onclick = toCalc;
}
bind(); render();
window.__ENH = { expected, runOnce };
})();
</script>
</body>
</html>
